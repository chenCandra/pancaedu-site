name: Deploy ke Cloudflare Workers

# Jalan otomatis tiap ada commit baru ke main -- termasuk commit yang
# dibuat Sveltia CMS sendiri (edit lewat /admin di situs live), jadi
# perubahan konten langsung tayang tanpa perlu build+deploy manual.
# "workflow_dispatch" biar bisa dipicu manual dari tab Actions kalau perlu.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Tarik slug materi/artikel ber-view terbanyak dari D1 (buat section
      # Spotlight di homepage) SEBELUM build -- lihat
      # scripts/fetch-top-viewed.mjs. SENGAJA selalu exit 0 (lihat komentar
      # di skrip itu): token belum punya izin D1, atau belum ada data sama
      # sekali, TIDAK BOLEH menggagalkan deploy -- Spotlight otomatis jatuh
      # ke fallback kalau topViewed.json kosong/lama.
      - run: npm run fetch-top-viewed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npm run build

      # Butuh secret CLOUDFLARE_API_TOKEN -- lihat catatan setup di
      # README.md bagian "Auto-deploy (GitHub Actions)".
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
