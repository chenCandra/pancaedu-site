backend:
  name: github
  repo: chenCandra/pancaedu-site
  branch: main
  # Worker auth terpisah (proyek sveltia-cms-auth resmi, di-deploy sendiri
  # di C:\xampp\htdocs\sveltia-cms-auth, nama Worker "pancaedu-cms-auth")
  # -- dibutuhkan supaya login GitHub bisa dipakai dari /admin situs live,
  # bukan cuma mode "Work with Local Repository". Client ID/Secret OAuth App
  # GitHub-nya disimpan sebagai secret di Worker itu, TIDAK di sini.
  base_url: https://pancaedu-cms-auth.gravi-tazy.workers.dev

# Sveltia CMS otomatis menawarkan "Work with Local Repository" (baca/tulis
# langsung ke folder proyek lewat browser Chrome/Edge, pakai File System
# Access API) tanpa konfigurasi tambahan — tidak perlu login GitHub dulu.
# Login GitHub (backend di atas) dipakai kalau CMS diakses dari domain
# production (pancaedu.web.id/admin) -- OAuth app + Worker auth-nya sudah
# di-setup (lihat base_url di atas).

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "Halaman Depan"
    # "files" (bukan "folder") -- singleton, cuma 1 entri buat diedit,
    # beda dari Artikel/Materi/Jejak Kelas yang bisa nambah banyak.
    files:
      - name: "pengaturan"
        label: "Redaksi Halaman Depan"
        file: "src/content/homepage/index.md"
        fields:
          - label: "Quote Hero (judul besar paling atas)"
            name: heroQuotes
            widget: list
            summary: "{{fields.quote}}"
            hint: "Minimal 1, boleh banyak (mis. 10) -- tiap kali halaman dimuat/direfresh, satu quote dipilih ACAK dari daftar ini. Cocok pakai kutipan inspiratif tentang belajar/ilmu/sains."
            fields:
              - { label: "Quote", name: quote, widget: text }
              - label: "Sumber"
                name: author
                widget: string
                required: false
                hint: 'mis. "Nelson Mandela" -- kosongkan kalau quote-nya orisinal/anonim.'
          - label: "Subjudul Hero"
            name: heroLede
            widget: text
          - label: "Judul Section Tentang"
            name: aboutTitle
            widget: string
          - label: "Teks Section Tentang"
            name: aboutText
            widget: text
          - label: "Kartu Keahlian & Peran"
            name: bentoItems
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Ikon (emoji)", name: icon, widget: string }
              - { label: "Judul", name: title, widget: string }
              - { label: "Deskripsi", name: desc, widget: text }
              - label: "Ukuran Kartu"
                name: size
                widget: select
                options:
                  - { label: "Kecil", value: "sm" }
                  - { label: "Sedang", value: "md" }
                  - { label: "Besar", value: "lg" }

  - name: "mode-daring"
    label: "Pengumuman Darurat (Ruang Belajar)"
    # Singleton (pola sama seperti "Halaman Depan" di atas). Ruang Belajar
    # SENDIRI permanen -- field ini CUMA ngontrol banner darurat di
    # beranda (mis. kabut asap, cuaca ekstrem), bukan kemunculan fiturnya.
    files:
      - name: "pengaturan"
        label: "Status Pengumuman Darurat"
        file: "src/content/mode-daring/index.md"
        fields:
          - label: "Sedang Ada Pengumuman Darurat?"
            name: aktif
            widget: boolean
            default: false
            hint: "Kalau AKTIF: banner pengumuman muncul di beranda. Ruang Belajar sendiri SELALU ada di menu, tidak dipengaruhi field ini -- ini cuma buat nampilkan pengumuman situasional (mis. kabut asap, cuaca ekstrem). Matikan lagi begitu situasinya selesai."
          - label: "Keterangan (opsional)"
            name: keterangan
            widget: text
            required: false
            hint: 'Alasan/periode, ditampilkan di banner beranda. Contoh: "Kualitas udara memburuk, KBM dari rumah s.d. pemberitahuan berikutnya."'

  - name: "ruang-belajar-pengaturan"
    label: "Pengaturan Ruang Belajar"
    # Singleton -- link Refleksi GLOBAL, dipakai OTOMATIS di semua sesi
    # Ruang Belajar yang tidak isi "Link Refleksi" sendiri. Jadi tidak
    # perlu tempel link Form yang sama berulang-ulang tiap bikin sesi baru.
    files:
      - name: "pengaturan"
        label: "Link Refleksi Global"
        file: "src/content/ruang-belajar-pengaturan/index.md"
        fields:
          - label: "Link Refleksi Global (opsional)"
            name: refleksiUrlGlobal
            widget: string
            required: false
            pattern: ['^$|^https?://\S+$', 'Harus link http(s) yang valid -- atau KOSONGKAN saja kalau belum ada (jangan diisi tanda "-" atau semacamnya, itu bikin situs gagal update)']
            hint: "Satu Form yang berlaku untuk SEMUA sesi Ruang Belajar (kelas berapa pun, mapel apa pun), kecuali sesi itu punya 'Link Refleksi' sendiri yang beda (itu tetap menang). Kalau belum ada, KOSONGKAN saja -- jangan diisi tanda '-'."

  - name: "ruang-belajar"
    label: "Ruang Belajar"
    label_singular: "Sesi Belajar"
    folder: "src/content/ruang-belajar"
    create: true
    slug: "{{fields.kelas}}-{{fields.mapel}}-{{fields.judul}}"
    identifier_field: judul
    summary: "{{fields.tanggal}} — {{fields.kelas}} {{fields.mapel}}: {{fields.judul}}"
    fields:
      - label: "Tanggal"
        name: tanggal
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Tanggal aktivitas ini muncul sebagai 'Hari Ini' -- dicocokkan ke tanggal HP/laptop siswa saat halaman dibuka. Juga dipakai sbg urutan di dalam daftar per Kelas+Mapel."
      - label: "Kelas"
        name: kelas
        widget: select
        options: ["X", "XI", "XII", "TKA"]
      - label: "Mata Pelajaran"
        name: mapel
        widget: string
        hint: "mis. Fisika, Matematika, Bahasa Indonesia"
      - { label: "Judul", name: judul, widget: string }
      - label: "Deskripsi Singkat (opsional)"
        name: deskripsi
        widget: text
        required: false
        hint: "Kosongkan kalau mau otomatis pakai deskripsi dari Materi yang dirujuk di bawah."
      - label: "Durasi (menit, opsional)"
        name: durasi
        widget: number
        required: false
        value_type: int
      - label: "Tujuan Pembelajaran (opsional)"
        name: tujuanPembelajaran
        widget: list
        required: false
        hint: "Satu poin per baris, boleh dikosongkan."
      - label: "Materi yang Dirujuk (opsional)"
        name: materiSlug
        widget: relation
        collection: "materi"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Pilih dari Materi Pelajaran yang sudah ada -- Lab Maya-nya otomatis ikut, TIDAK perlu diisi ulang di sini. Kalau belum ada materinya, kosongkan dulu (langkah 'Pelajari Materi' akan tampil 'belum tersedia')."
      - label: "Video YouTube khusus sesi ini (opsional)"
        name: youtubeId
        widget: string
        required: false
        hint: "Cuma ID-nya (dari youtube.com/watch?v=XXXXXXXXXXX, isi XXXXXXXXXXX saja). Pakai ini kalau videonya BUKAN video milik sendiri/bukan konten resmi Materi (mis. video referensi orang lain) -- videonya CUMA muncul di sesi Ruang Belajar ini, TIDAK ikut tampil di halaman Materi. Kalau Materi yang dirujuk sudah punya video sendiri dan itu cukup, biarkan kosong di sini."
      - label: "Link Latihan (opsional)"
        name: latihanUrl
        widget: string
        required: false
        pattern: ['^$|^https?://\S+$', 'Harus link http(s) yang valid -- atau KOSONGKAN saja kalau belum ada (jangan diisi tanda "-" atau semacamnya, itu bikin situs gagal update)']
        hint: "Link platform apa saja -- Google Form, Wayground (Quizizz), Kahoot, LiveWorksheets, dll. Tempel link 'assign'/'join'-nya siswa di sini. Belum ada linknya? KOSONGKAN saja field ini -- jangan diisi tanda '-', itu bikin situs gagal update."
      - label: "Link Tugas (opsional)"
        name: tugasUrl
        widget: string
        required: false
        pattern: ['^$|^https?://\S+$', 'Harus link http(s) yang valid -- atau KOSONGKAN saja kalau belum ada (jangan diisi tanda "-" atau semacamnya, itu bikin situs gagal update)']
        hint: "Tempat siswa mengumpulkan tugas -- Google Form, Google Drive, atau platform lain, bebas. Belum ada linknya? KOSONGKAN saja field ini -- jangan diisi tanda '-', itu bikin situs gagal update."
      - label: "Link Tugas Paket 2 (khusus TKA, opsional)"
        name: tugasUrlPaket2
        widget: string
        required: false
        pattern: ['^$|^https?://\S+$', 'Harus link http(s) yang valid -- atau KOSONGKAN saja kalau belum ada (jangan diisi tanda "-" atau semacamnya, itu bikin situs gagal update)']
        hint: "KHUSUS kelas TKA -- kalau topik ini punya paket latihan kedua (soal berbeda dari 'Link Tugas' di atas), tempel link penugasannya di sini. Kelas X/XI/XII tidak perlu isi field ini. KOSONGKAN saja kalau belum ada -- jangan diisi tanda '-'."
      - label: "Link Refleksi Khusus Sesi Ini (opsional)"
        name: refleksiUrl
        widget: string
        required: false
        pattern: ['^$|^https?://\S+$', 'Harus link http(s) yang valid -- atau KOSONGKAN saja kalau belum ada (jangan diisi tanda "-" atau semacamnya, itu bikin situs gagal update)']
        hint: "Kosongkan saja kalau sesi ini pakai Link Refleksi Global yang sudah diatur (lihat koleksi 'Pengaturan Ruang Belajar'). Isi di sini CUMA kalau sesi ini butuh Form refleksi yang beda dari biasanya. Jangan diisi tanda '-' kalau memang kosong."
      - { label: "Draft (belum tayang)", name: draft, widget: boolean, default: false }

  - name: "penugasan-pengaturan"
    label: "Pengaturan Penugasan"
    # Singleton (pola sama seperti "Pengaturan Ruang Belajar"). Daftar
    # kelas di sini yang muncul sebagai dropdown "Kelas" saat siswa mulai
    # mengerjakan Penugasan -- edit di sini tiap semester/tahun ajaran
    # ganti, TIDAK perlu minta ubah kode.
    files:
      - name: "pengaturan"
        label: "Daftar Kelas & Roster Siswa"
        file: "src/content/penugasan-pengaturan/index.md"
        fields:
          - name: "daftarKelas"
            label: "Daftar Kelas"
            widget: list
            summary: "{{fields.kelas}} ({{fields.siswa}} siswa)"
            hint: "Satu blok per kelas. Opsi 'Umum / Lainnya' untuk pengunjung non-SMAN 4 ditambahkan OTOMATIS oleh situs -- tidak perlu dibuat di sini."
            fields:
              - { label: "Nama Kelas", name: kelas, widget: string, hint: "mis. 'X E1', 'XII F2'" }
              - label: "Daftar Nama Siswa"
                name: siswa
                widget: list
                hint: "Satu nama per baris, urut sesuai selera (mis. alfabetis). Ini yang muncul sebagai dropdown nama setelah siswa memilih kelas ini."
          # Field "PIN Guru (hash)" yang dulu ada di sini SUDAH DIHAPUS dari
          # form (2026-09-11) -- gerbang /penugasan/rekap sekarang dikelola
          # dinamis lewat /admin-panca/pin (tabel D1 `pins`), bukan lagi
          # lewat commit git di sini. `pinGuruHash` masih ada di skema
          # (content.config.ts) sebagai field deprecated, cuma tidak lagi
          # ditampilkan sebagai form di CMS ini.

  - name: "penugasan"
    label: "Penugasan"
    label_singular: "Tugas"
    folder: "src/content/penugasan"
    create: true
    slug: "{{fields.kelas}}-{{fields.mapel}}-{{fields.judul}}"
    identifier_field: judul
    summary: "{{fields.kelas}} {{fields.mapel}} — {{fields.judul}}"
    fields:
      - { label: "Judul", name: judul, widget: string }
      - label: "Kelas"
        name: kelas
        widget: select
        options: ["X", "XI", "XII", "TKA"]
      - label: "Mata Pelajaran"
        name: mapel
        widget: string
        hint: "mis. Fisika, Matematika, Bahasa Indonesia"
      - label: "Deskripsi Singkat (opsional)"
        name: deskripsi
        widget: text
        required: false
      - label: "Materi yang Dirujuk (opsional)"
        name: materiSlug
        widget: relation
        collection: "materi"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Cuma buat tautan 'materi terkait' di halaman tugas, BUKAN sumber soal -- soal tetap ditulis manual di bawah."
      - label: "PIN Leaderboard (hash)"
        name: pinHash
        widget: string
        hint: 'Buat hash-nya di halaman /penugasan/pin-generator (tanpa terminal), lalu tempel di sini. JANGAN tempel kode PIN mentahnya -- siswa/wali murid tidak boleh bisa baca kode aslinya dari sini.'
      - label: "PIN Berlaku Hingga"
        name: pinBerlakuHingga
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Wajib diisi -- kebijakan: maksimal 6 bulan dari kapan PIN ini dibuat/diperbarui. Halaman /penugasan/pin-generator otomatis mengisi tanggal 6 bulan ke depan begitu hash dibuat, tinggal disalin ke sini. Setelah lewat tanggal ini, PIN yang benar sekalipun akan ditolak."
      - name: "soal"
        label: "Daftar Soal"
        widget: list
        summary: "{{fields.soal}}"
        # Sveltia CMS "variable type" list -- tiap butir soal punya bentuk
        # field BEDA tergantung tipenya, `typeKey` menentukan nama field
        # penanda tipe yang ditulis ke tiap butir (harus cocok `tipe` di
        # src/content.config.ts -- discriminated union Zod-nya).
        typeKey: tipe
        types:
          - name: "pilihan-ganda"
            label: "Pilihan Ganda Interaktif"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string, hint: "mis. 'soal-1'" }
              - { label: "Pertanyaan", name: soal, widget: text }
              - label: "Pilihan Jawaban"
                name: pilihan
                widget: list
                summary: "{{fields.teks}}"
                fields:
                  - { label: "ID Opsi (unik dalam soal ini)", name: id, widget: string, hint: "mis. 'a', 'b', 'c'" }
                  - { label: "Teks Pilihan", name: teks, widget: string }
              - label: "ID Opsi yang Benar"
                name: jawabanBenarId
                widget: string
                hint: "Harus cocok persis salah satu ID Opsi di atas."
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
          - name: "benar-salah"
            label: "Benar / Salah"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string }
              - { label: "Pernyataan", name: soal, widget: text }
              - label: "Jawaban Benar"
                name: jawabanBenar
                widget: select
                options: [{ label: "Benar", value: true }, { label: "Salah", value: false }]
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
          - name: "isian-singkat"
            label: "Isian Singkat"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string }
              - { label: "Pertanyaan", name: soal, widget: text }
              - label: "Jawaban Berupa Angka?"
                name: angka
                widget: boolean
                default: false
                hint: "Kalau YA, jawaban dibandingkan sebagai angka + toleransi (cocok buat hitungan Fisika). Kalau TIDAK, dibandingkan sebagai teks (huruf besar/kecil & spasi di ujung diabaikan)."
              - label: "Toleransi (cuma dipakai kalau angka)"
                name: toleransi
                widget: number
                default: 0
                hint: "mis. 0.5 -- jawaban dianggap benar kalau selisihnya dari jawaban benar tidak lebih dari nilai ini."
              - label: "Varian Jawaban Benar"
                name: jawabanBenar
                widget: list
                hint: "Boleh lebih dari satu (mis. '5', '5.0', '5,0' buat angka yang sama ditulis beda format)."
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
          - name: "menjodohkan"
            label: "Menjodohkan"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string }
              - { label: "Instruksi", name: soal, widget: text }
              - label: "Pasangan"
                name: pasangan
                widget: list
                summary: "{{fields.kiri}} — {{fields.kanan}}"
                hint: "Minimal 2 pasang. Sisi kanan akan diacak urutannya otomatis saat ditampilkan ke siswa."
                fields:
                  - { label: "ID Pasangan (unik dalam soal ini)", name: id, widget: string }
                  - { label: "Sisi Kiri", name: kiri, widget: string }
                  - { label: "Sisi Kanan (pasangannya)", name: kanan, widget: string }
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
          - name: "menyusun-urutan"
            label: "Menyusun Urutan"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string }
              - { label: "Instruksi", name: soal, widget: text }
              - label: "Item (isi SUDAH dalam urutan yang benar)"
                name: item
                widget: list
                summary: "{{fields.teks}}"
                hint: "Urutan penulisan di sini ADALAH kunci jawabannya -- tampilan ke siswa otomatis diacak."
                fields:
                  - { label: "ID Item (unik dalam soal ini)", name: id, widget: string }
                  - { label: "Teks", name: teks, widget: string }
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
          - name: "drag-drop"
            label: "Drag & Drop (Kategorisasi)"
            fields:
              - { label: "ID Soal (unik dalam tugas ini)", name: id, widget: string }
              - { label: "Instruksi", name: soal, widget: text }
              - label: "Kategori (kotak tujuan)"
                name: kategori
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "ID Kategori (unik dalam soal ini)", name: id, widget: string }
                  - { label: "Label Kategori", name: label, widget: string }
              - label: "Item yang Digeser"
                name: item
                widget: list
                summary: "{{fields.teks}}"
                fields:
                  - { label: "ID Item (unik dalam soal ini)", name: id, widget: string }
                  - { label: "Teks", name: teks, widget: string }
                  - label: "ID Kategori yang Benar"
                    name: kategoriBenarId
                    widget: string
                    hint: "Harus cocok persis salah satu ID Kategori di atas."
              - { label: "Penjelasan (opsional)", name: penjelasan, widget: text, required: false }
              - { label: "Skor", name: skor, widget: number, value_type: int, default: 1 }
      - { label: "Draft (belum tayang)", name: draft, widget: boolean, default: false }

  - name: "artikel"
    label: "Artikel"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    filter: { field: "category", value: "artikel" }
    fields:
      - { label: "Judul", name: title, widget: string }
      - { label: "Deskripsi Singkat", name: description, widget: text }
      - { label: "Kategori", name: category, widget: hidden, default: "artikel" }
      - label: "Tanggal Terbit"
        name: pubDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Tanggal Update"
        name: updatedDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - { label: "Tags", name: tags, widget: list, required: false }
      - label: "Gambar Cover"
        name: coverImage
        widget: image
        required: false
        hint: "Dipakai sebagai gambar sampul kartu & Open Graph (preview saat dibagikan)."
      - { label: "Draft (belum tayang)", name: draft, widget: boolean, default: false }
      - { label: "Isi Artikel", name: body, widget: markdown }

  - name: "materi"
    label: "Materi Pelajaran"
    label_singular: "Materi"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    filter: { field: "category", value: "materi" }
    fields:
      - { label: "Judul", name: title, widget: string }
      - { label: "Deskripsi Singkat", name: description, widget: text }
      - { label: "Kategori", name: category, widget: hidden, default: "materi" }
      - label: "Kelas"
        name: kelas
        widget: select
        options: ["X", "XI", "XII", "TKA"]
        required: false
      - label: "Mata Pelajaran"
        name: mapel
        widget: string
        required: false
        hint: "mis. Fisika, Matematika, Bahasa Indonesia"
      - label: "Tanggal Terbit"
        name: pubDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Tanggal Update"
        name: updatedDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - { label: "Tags", name: tags, widget: list, required: false }
      - label: "Gambar Cover"
        name: coverImage
        widget: image
        required: false
        hint: "Dipakai sebagai gambar sampul kartu & Open Graph (preview saat dibagikan)."
      - label: "Video YouTube (ID saja)"
        name: youtubeId
        widget: string
        required: false
        hint: "Dari youtube.com/watch?v=dQw4w9WgXcQ, isi dQw4w9WgXcQ saja (bukan link lengkap)."
      - name: "simulasi"
        label: "Lab Maya (Simulasi Interaktif)"
        widget: object
        required: false
        collapsed: true
        fields:
          - label: "URL Simulasi"
            name: url
            widget: string
            pattern: ['^https?://\S+$', 'Harus link http(s) yang valid (jangan diisi tanda "-" atau semacamnya)']
            hint: "Link embed dari PhET/GeoGebra/dsb, atau URL app JS hasil generate AI yang sudah kamu hosting sendiri."
          - { label: "Judul Simulasi", name: judul, widget: string }
          - label: "Sumber"
            name: sumber
            widget: string
            required: false
            hint: "mis. PhET Interactive Simulations — ditampilkan sebagai kredit."
          - label: "Tinggi Embed (px)"
            name: tinggi
            widget: number
            default: 600
            required: false
      - name: "simulasiTambahan"
        label: "Simulasi Tambahan (Pihak Ketiga, mis. PhET)"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.judul}}"
        hint: "MELENGKAPI Lab Maya di atas, bukan menggantikan. Untuk embed simulasi pihak ketiga (PhET Colorado dsb.) yang dipasang APA ADANYA (bukan hasil hosting sendiri) -- atribusi Sumber wajib diisi sesuai ketentuan lisensinya."
        fields:
          - label: "URL Simulasi"
            name: url
            widget: string
            pattern: ['^https?://\S+$', 'Harus link http(s) yang valid']
          - { label: "Judul Simulasi", name: judul, widget: string }
          - label: "Sumber (wajib -- atribusi lisensi)"
            name: sumber
            widget: string
            hint: "mis. PhET Interactive Simulations, University of Colorado Boulder, CC BY 4.0"
          - label: "Tinggi Embed (px)"
            name: tinggi
            widget: number
            default: 600
            required: false
      - name: "kuis"
        label: "Kuis (Uji Pemahaman)"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.soal}}"
        hint: "Tampil di akhir materi, feedback langsung tiap soal dijawab. Boleh dikosongkan kalau belum sempat dibuat."
        fields:
          - { label: "Pertanyaan", name: soal, widget: string }
          - label: "Pilihan Jawaban"
            name: pilihan
            widget: list
            hint: "Tulis tiap pilihan satu per baris (minimal 2)."
          - label: "Nomor Pilihan yang Benar"
            name: jawaban
            widget: number
            value_type: int
            hint: "Dihitung dari 0 — pilihan pertama = 0, kedua = 1, dst."
          - label: "Penjelasan"
            name: penjelasan
            widget: text
            required: false
            hint: "Muncul setelah murid menjawab — jelaskan kenapa jawabannya begitu."
      - { label: "Draft (belum tayang)", name: draft, widget: boolean, default: false }
      - { label: "Isi Materi", name: body, widget: markdown }

  - name: "kelas"
    label: "Jejak Kelas (Buku Alumni)"
    label_singular: "Angkatan"
    folder: "src/content/kelas"
    create: true
    slug: "{{fields.tahunAjaran}}"
    identifier_field: namaKelas
    fields:
      - label: "Tahun Ajaran"
        name: tahunAjaran
        widget: string
        hint: 'Format bebas, mis. "2023/2024" — dipakai juga sebagai nama file, hindari karakter aneh.'
      - label: "Nama Kelas"
        name: namaKelas
        widget: string
        hint: 'mis. "XI IPA 2"'
      - label: "Siswa"
        name: siswa
        widget: list
        hint: "Tambahkan tiap siswa satu per satu."
        summary: "{{fields.namaLengkap}}"
        fields:
          - { label: "Nama Lengkap", name: namaLengkap, widget: string }
          - { label: "Nama Panggilan", name: namaPanggilan, widget: string, required: false }
          - { label: "Desa Tempat Tinggal", name: desa, widget: string, required: false }
          - label: "Akun Instagram"
            name: instagram
            widget: string
            required: false
            hint: 'Username saja, mis. "budi.s" — boleh pakai "@" di depan atau tidak, sama saja.'
          - label: "Kata Mutiara/Pesan/Kesan"
            name: quote
            widget: string
            required: false
          - label: "Foto"
            name: foto
            widget: image
            required: false
            hint: "Opsional — kalau kosong, tampil inisial nama sebagai pengganti foto."
      - label: "Foto Bersama (Landscape)"
        name: fotoBersama
        widget: list
        required: false
        hint: "Foto kegiatan/foto bareng seluruh kelas (perpisahan, study tour, dst.) — pakai foto landscape (lebar), tampil sebelum daftar per-siswa. Jumlah bebas."
        summary: "{{fields.keterangan}}"
        fields:
          - { label: "Foto", name: foto, widget: image }
          - label: "Keterangan (opsional)"
            name: keterangan
            widget: string
            required: false
            hint: 'mis. "Perpisahan Sekolah", "Study Tour ke Jakarta"'
      - label: "Catatan (opsional)"
        name: body
        widget: markdown
        required: false
        hint: "Teks pengantar di atas galeri foto, mis. cerita singkat soal kelas ini."
