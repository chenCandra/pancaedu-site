<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan | Arena Game Edukasi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/game/assets/style.css">
<style>
  .panggung {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.25rem;
  }

  .panggung .kode {
    font-family: var(--font-judul);
    font-size: 5rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--biru), var(--ungu));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .panggung h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    margin-block: 0.75rem 0.5rem;
  }

  .panggung p {
    max-width: 26rem;
    color: var(--tinta-lembut);
    font-size: 1.0625rem;
    margin-bottom: 1.75rem;
  }
</style>
</head>
<body>
  <div class="bentuk-dekor" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
  </div>

  <main class="panggung">
    <span class="kode" aria-hidden="true">404</span>
    <h1>Wah, game/halaman ini belum ada 🧐</h1>
    <p>Sepertinya tautannya salah ketik atau game-nya sudah dipindah. Yuk kembali dan pilih game lain.</p>
    <a href="/game/" class="tombol">🎮 Kembali ke Arena Game</a>
  </main>
</body>
</html>
