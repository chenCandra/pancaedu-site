<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konverter Satuan Fisika | Kotak Alat PancaEdu</title>
<meta name="description" content="Konversi cepat satuan panjang, massa, waktu, suhu, energi, dan gaya -- bantu kerjakan soal fisika tanpa hitung manual.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tools/assets/style.css">
<style>
  .panggung { max-width: 38rem; margin-inline: auto; padding: 1rem 1.25rem 3rem; padding-top: 4.5rem; }
  .judul-alat { text-align: center; margin-bottom: 1.5rem; }
  .judul-alat h1 { font-size: clamp(1.5rem, 4vw, 2rem); background: linear-gradient(90deg, var(--teal), var(--biru)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .judul-alat p { color: var(--tinta-lembut); margin-top: 0.4rem; }

  .baris-kategori { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; justify-content: center; }
  .baris-konversi { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: end; }
  .kolom-konversi { display: flex; flex-direction: column; gap: 0.4rem; }
  .kolom-konversi label { font-weight: 700; font-size: 0.85rem; }

  .btn-tukar {
    width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 2px solid var(--garis);
    background: #fff; font-size: 1.1rem; cursor: pointer; align-self: center; margin-top: 1.4rem;
  }
  .btn-tukar:hover { border-color: var(--teal); }

  .kotak-hasil {
    margin-top: 1.5rem; background: var(--teal-lembut); border-radius: var(--radius-sedang);
    padding: 1.25rem; text-align: center;
  }
  .kotak-hasil .nilai-hasil { font-family: 'Courier New', monospace; font-weight: 800; font-size: 1.75rem; color: var(--teal); word-break: break-word; }
  .kotak-hasil .formula-kecil { font-size: 0.8rem; color: var(--tinta-lembut); margin-top: 0.4rem; }

  @media (max-width: 26rem) {
    .baris-konversi { grid-template-columns: 1fr; }
    .btn-tukar { justify-self: center; transform: rotate(90deg); margin-top: 0; }
  }
</style>
</head>
<body>
  <div class="bentuk-dekor" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
  </div>

  <a href="/tools/" class="tombol-kembali-mengambang">← Kembali ke Kotak Alat</a>

  <div class="panggung">
    <header class="judul-alat">
      <h1>📐 Konverter Satuan Fisika</h1>
      <p>Pilih kategori, masukkan angka, hasilnya langsung muncul.</p>
    </header>

    <div class="kartu-panel">
      <div class="baris-kategori" id="baris-kategori"></div>

      <div class="baris-konversi">
        <div class="kolom-konversi">
          <label for="input-nilai">Nilai</label>
          <input type="number" id="input-nilai" value="1">
          <select id="select-dari"></select>
        </div>
        <button type="button" class="btn-tukar" id="btn-tukar" aria-label="Tukar satuan">⇄</button>
        <div class="kolom-konversi">
          <label for="select-ke">Ke satuan</label>
          <div style="height:2.6rem;"></div>
          <select id="select-ke"></select>
        </div>
      </div>

      <div class="kotak-hasil">
        <div class="nilai-hasil" id="nilai-hasil">-</div>
        <div class="formula-kecil" id="formula-kecil"></div>
      </div>
    </div>
  </div>

  <script>
    // Faktor konversi ke satuan dasar SI (semua KECUALI suhu, yang linear
    // sederhana lewat perkalian -- suhu ditangani terpisah karena ada offset).
    var KATEGORI = {
      panjang: {
        label: '📏 Panjang', satuanDasar: 'm',
        satuan: { km: 1000, m: 1, dm: 0.1, cm: 0.01, mm: 0.001, 'µm': 0.000001, inci: 0.0254, kaki: 0.3048, mil: 1609.34 },
      },
      massa: {
        label: '⚖️ Massa', satuanDasar: 'kg',
        satuan: { ton: 1000, kuintal: 100, kg: 1, ons: 0.1, gram: 0.001, mg: 0.000001, pound: 0.453592 },
      },
      waktu: {
        label: '⏳ Waktu', satuanDasar: 's',
        satuan: { hari: 86400, jam: 3600, menit: 60, detik: 1, milidetik: 0.001 },
      },
      suhu: {
        label: '🌡️ Suhu', khusus: true,
        satuan: ['celsius', 'fahrenheit', 'kelvin', 'reamur'],
      },
      energi: {
        label: '⚡ Energi', satuanDasar: 'J',
        satuan: { kWh: 3600000, kkal: 4184, kalori: 4.184, joule: 1, erg: 0.0000001 },
      },
      gaya: {
        label: '➡️ Gaya', satuanDasar: 'N',
        satuan: { kgf: 9.80665, newton: 1, lbf: 4.44822, dyne: 0.00001 },
      },
    };

    function keCelsius(nilai, satuan) {
      if (satuan === 'celsius') return nilai;
      if (satuan === 'fahrenheit') return (nilai - 32) * 5 / 9;
      if (satuan === 'kelvin') return nilai - 273.15;
      if (satuan === 'reamur') return nilai * 5 / 4;
      return nilai;
    }
    function dariCelsius(celsius, satuan) {
      if (satuan === 'celsius') return celsius;
      if (satuan === 'fahrenheit') return celsius * 9 / 5 + 32;
      if (satuan === 'kelvin') return celsius + 273.15;
      if (satuan === 'reamur') return celsius * 4 / 5;
      return celsius;
    }

    var elBarisKategori = document.getElementById('baris-kategori');
    var elSelectDari = document.getElementById('select-dari');
    var elSelectKe = document.getElementById('select-ke');
    var elInputNilai = document.getElementById('input-nilai');
    var elNilaiHasil = document.getElementById('nilai-hasil');
    var elFormulaKecil = document.getElementById('formula-kecil');
    var elBtnTukar = document.getElementById('btn-tukar');

    var kategoriAktif = 'panjang';

    function daftarSatuan(kategori) {
      var k = KATEGORI[kategori];
      return k.khusus ? k.satuan : Object.keys(k.satuan);
    }

    function isiDropdownSatuan() {
      var daftar = daftarSatuan(kategoriAktif);
      elSelectDari.innerHTML = '';
      elSelectKe.innerHTML = '';
      daftar.forEach(function (s) {
        var opt1 = document.createElement('option'); opt1.value = s; opt1.textContent = s;
        var opt2 = document.createElement('option'); opt2.value = s; opt2.textContent = s;
        elSelectDari.appendChild(opt1);
        elSelectKe.appendChild(opt2);
      });
      if (daftar.length > 1) elSelectKe.selectedIndex = 1;
    }

    function formatAngka(n) {
      if (!isFinite(n)) return '-';
      if (Math.abs(n) >= 1e9 || (Math.abs(n) < 1e-6 && n !== 0)) return n.toExponential(4);
      var dibulatkan = Math.round(n * 1e6) / 1e6;
      return dibulatkan.toString();
    }

    function hitungKonversi() {
      var nilai = parseFloat(elInputNilai.value);
      var dari = elSelectDari.value;
      var ke = elSelectKe.value;
      var k = KATEGORI[kategoriAktif];

      if (isNaN(nilai)) { elNilaiHasil.textContent = '-'; elFormulaKecil.textContent = ''; return; }

      var hasil;
      if (k.khusus) {
        hasil = dariCelsius(keCelsius(nilai, dari), ke);
      } else {
        var nilaiDasar = nilai * k.satuan[dari];
        hasil = nilaiDasar / k.satuan[ke];
      }
      elNilaiHasil.textContent = formatAngka(hasil) + ' ' + ke;
      elFormulaKecil.textContent = nilai + ' ' + dari + ' = ' + formatAngka(hasil) + ' ' + ke;
    }

    function buatChipKategori() {
      Object.keys(KATEGORI).forEach(function (key) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (key === kategoriAktif ? ' aktif' : '');
        btn.textContent = KATEGORI[key].label;
        btn.dataset.kategori = key;
        btn.addEventListener('click', function () {
          kategoriAktif = key;
          document.querySelectorAll('#baris-kategori .chip').forEach(function (c) { c.classList.toggle('aktif', c.dataset.kategori === key); });
          isiDropdownSatuan();
          hitungKonversi();
        });
        elBarisKategori.appendChild(btn);
      });
    }

    elInputNilai.addEventListener('input', hitungKonversi);
    elSelectDari.addEventListener('change', hitungKonversi);
    elSelectKe.addEventListener('change', hitungKonversi);
    elBtnTukar.addEventListener('click', function () {
      var sementara = elSelectDari.value;
      elSelectDari.value = elSelectKe.value;
      elSelectKe.value = sementara;
      hitungKonversi();
    });

    buatChipKategori();
    isiDropdownSatuan();
    hitungKonversi();
  </script>
</body>
</html>
