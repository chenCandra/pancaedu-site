<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Tugas Pribadi | Kotak Alat PancaEdu</title>
<meta name="description" content="Daftar tugas sederhana yang tersimpan di browser sendiri -- tambah tugas, centang kalau sudah selesai, tidak perlu akun.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tools/assets/style.css">
<style>
  .panggung { max-width: 34rem; margin-inline: auto; padding: 1rem 1.25rem 3rem; padding-top: 4.5rem; }
  .judul-alat { text-align: center; margin-bottom: 1.5rem; }
  .judul-alat h1 { font-size: clamp(1.5rem, 4vw, 2rem); background: linear-gradient(90deg, var(--kuning), var(--oranye)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .judul-alat p { color: var(--tinta-lembut); margin-top: 0.4rem; }

  .baris-tambah { display: flex; gap: 0.6rem; }
  .baris-tambah input[type="text"] { flex: 1; }
  .baris-tambah input[type="date"] { width: 9.5rem; }
  @media (max-width: 26rem) { .baris-tambah { flex-wrap: wrap; } .baris-tambah input[type="date"] { width: 100%; } }

  .daftar-tugas { list-style: none; margin: 1.25rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .item-tugas {
    display: flex; align-items: center; gap: 0.75rem; background: var(--kertas-alt);
    border-radius: var(--radius-sedang); padding: 0.8rem 1rem;
  }
  .item-tugas input[type="checkbox"] { width: 1.25rem; height: 1.25rem; flex-shrink: 0; accent-color: var(--kuning); cursor: pointer; }
  .item-tugas .teks-tugas { flex: 1; }
  .item-tugas .tenggat { font-size: 0.75rem; color: var(--tinta-lembut); }
  .item-tugas.selesai .teks-tugas { text-decoration: line-through; color: var(--tinta-lembut); }
  .item-tugas .btn-hapus { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--pink); flex-shrink: 0; }

  .pesan-kosong-hasil { text-align: center; color: var(--tinta-lembut); padding: 2rem 1rem; }
  .baris-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--tinta-lembut); }
  .baris-footer button { background: none; border: none; color: var(--pink); cursor: pointer; font-weight: 700; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="bentuk-dekor" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
  </div>

  <a href="/tools/" class="tombol-kembali-mengambang">← Kembali ke Kotak Alat</a>

  <div class="panggung">
    <header class="judul-alat">
      <h1>✅ Checklist Tugas Pribadi</h1>
      <p>Tersimpan di browser ini saja -- tidak perlu akun, tidak dikirim ke mana pun.</p>
    </header>

    <div class="kartu-panel">
      <div class="baris-tambah">
        <input type="text" id="input-tugas" placeholder="Tulis tugas baru..." maxlength="200">
        <input type="date" id="input-tenggat">
        <button class="tombol" id="btn-tambah">➕ Tambah</button>
      </div>

      <ul class="daftar-tugas" id="daftar-tugas"></ul>
      <p class="pesan-kosong-hasil" id="pesan-kosong" hidden>Belum ada tugas. Tambahkan satu di atas!</p>

      <div class="baris-footer">
        <span id="ringkasan-tugas"></span>
        <button id="btn-hapus-selesai">Hapus yang sudah selesai</button>
      </div>
    </div>
  </div>

  <script>
    var KUNCI_SIMPAN = 'pancaedu-tools:checklist-tugas';

    var elInputTugas = document.getElementById('input-tugas');
    var elInputTenggat = document.getElementById('input-tenggat');
    var elBtnTambah = document.getElementById('btn-tambah');
    var elDaftarTugas = document.getElementById('daftar-tugas');
    var elPesanKosong = document.getElementById('pesan-kosong');
    var elRingkasan = document.getElementById('ringkasan-tugas');
    var elBtnHapusSelesai = document.getElementById('btn-hapus-selesai');

    var daftar = [];

    function muatDariPenyimpanan() {
      try {
        var mentah = localStorage.getItem(KUNCI_SIMPAN);
        daftar = mentah ? JSON.parse(mentah) : [];
      } catch (e) {
        daftar = [];
      }
    }

    function simpanKePenyimpanan() {
      try { localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(daftar)); } catch (e) { /* mode privat dll -- abaikan, cuma tidak persisten */ }
    }

    function formatTanggal(iso) {
      if (!iso) return '';
      var d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function render() {
      elDaftarTugas.innerHTML = '';
      elPesanKosong.hidden = daftar.length > 0;

      daftar
        .slice()
        .sort(function (a, b) { return (a.selesai === b.selesai) ? 0 : a.selesai ? 1 : -1; })
        .forEach(function (tugas) {
          var li = document.createElement('li');
          li.className = 'item-tugas' + (tugas.selesai ? ' selesai' : '');
          li.innerHTML =
            '<input type="checkbox" ' + (tugas.selesai ? 'checked' : '') + '>' +
            '<span class="teks-tugas">' + escapeHtml(tugas.teks) + (tugas.tenggat ? ' <span class="tenggat">(' + formatTanggal(tugas.tenggat) + ')</span>' : '') + '</span>' +
            '<button class="btn-hapus" aria-label="Hapus tugas">✕</button>';

          li.querySelector('input[type="checkbox"]').addEventListener('change', function () {
            tugas.selesai = !tugas.selesai;
            simpanKePenyimpanan();
            render();
          });
          li.querySelector('.btn-hapus').addEventListener('click', function () {
            daftar = daftar.filter(function (t) { return t.id !== tugas.id; });
            simpanKePenyimpanan();
            render();
          });
          elDaftarTugas.appendChild(li);
        });

      var jumlahSelesai = daftar.filter(function (t) { return t.selesai; }).length;
      elRingkasan.textContent = daftar.length === 0 ? '' : jumlahSelesai + ' dari ' + daftar.length + ' selesai';
    }

    function escapeHtml(teks) {
      var div = document.createElement('div');
      div.textContent = teks;
      return div.innerHTML;
    }

    function tambahTugas() {
      var teks = elInputTugas.value.trim();
      if (!teks) return;
      daftar.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), teks: teks, tenggat: elInputTenggat.value || null, selesai: false });
      elInputTugas.value = '';
      elInputTenggat.value = '';
      simpanKePenyimpanan();
      render();
    }

    elBtnTambah.addEventListener('click', tambahTugas);
    elInputTugas.addEventListener('keydown', function (e) { if (e.key === 'Enter') tambahTugas(); });
    elBtnHapusSelesai.addEventListener('click', function () {
      daftar = daftar.filter(function (t) { return !t.selesai; });
      simpanKePenyimpanan();
      render();
    });

    muatDariPenyimpanan();
    render();
  </script>
</body>
</html>
