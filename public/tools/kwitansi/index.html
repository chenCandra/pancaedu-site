<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Kwitansi | Perkakas PancaEdu</title>
<meta name="description" content="Isi nomor, sumber dana, penerima, dan jumlah uang -- jumlahnya otomatis dieja jadi terbilang, hasilnya kwitansi dinas siap cetak dengan 3 tanda tangan (Kepala Sekolah, Bendahara, Penerima).">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tools/assets/style.css">
<style>
  .panggung { max-width: 60rem; margin-inline: auto; padding: 1rem 1.25rem 3rem; padding-top: 4.5rem; }
  .judul-alat { text-align: center; margin-bottom: 1.5rem; }
  .judul-alat h1 { font-size: clamp(1.5rem, 4vw, 2rem); background: linear-gradient(90deg, var(--oranye), var(--kuning)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .judul-alat p { color: var(--tinta-lembut); margin-top: 0.4rem; }

  .tata-letak { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 56rem) { .tata-letak { grid-template-columns: 1fr 1.15fr; align-items: start; } }

  .baris-2kol { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  @media (max-width: 22rem) { .baris-2kol { grid-template-columns: 1fr; } }

  .subjudul-form { font-family: var(--font-judul); font-weight: 700; font-size: 0.9rem; color: var(--tinta-lembut); margin: 1.25rem 0 0.5rem; padding-top: 1rem; border-top: 1px solid var(--garis); }
  .subjudul-form:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

  .kwitansi {
    position: sticky; top: 1.5rem;
    background: #fffdf2; border: 2px solid var(--tinta); box-shadow: var(--bayangan-kuat);
    padding: 1.75rem 2rem; font-size: 0.85rem; line-height: 1.7;
  }
  .kwitansi .judul-kwitansi { text-align: center; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.1em; text-decoration: underline; margin-bottom: 1.1rem; }
  .kwitansi table.data-atas { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
  .kwitansi table.data-atas td { padding: 0.15rem 0; vertical-align: top; }
  .kwitansi table.data-atas td.label { width: 8.5rem; font-weight: 600; }
  .kwitansi table.data-atas td.titik-dua { width: 0.8rem; }

  .kwitansi table.data-bawah { width: 100%; border-collapse: collapse; }
  .kwitansi table.data-bawah td { padding: 0.4rem 0; vertical-align: top; }
  .kwitansi table.data-bawah td.label { width: 8.5rem; font-weight: 600; }
  .kwitansi table.data-bawah td.titik-dua { width: 0.8rem; }
  .kwitansi table.data-bawah tr.bergaris td { border-bottom: 1px solid #c9c4b8; }

  .kwitansi .jumlah-rupiah { font-weight: 800; font-size: 1.1rem; border: 2px solid var(--tinta); padding: 0.3rem 0.75rem; display: inline-block; }
  .kwitansi .terbilang-box { font-style: italic; }

  .kwitansi .baris-tanggal { text-align: right; margin-top: 1.25rem; }

  .kwitansi .baris-ttd { display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 1.5rem; text-align: center; }
  .kwitansi .kolom-ttd { flex: 1; min-width: 0; }
  .kwitansi .kolom-ttd .prefix-ttd { font-size: 0.8rem; }
  .kwitansi .kolom-ttd .peran-ttd { font-weight: 700; font-size: 0.8rem; }
  .kwitansi .ruang-ttd { height: 3.2rem; }
  .kwitansi .nama-ttd { font-weight: 700; text-decoration: underline; word-break: break-word; }
  .kwitansi .nip-ttd { font-size: 0.78rem; }

  @media print {
    body { background: #fff; }
    .panggung { max-width: none; padding: 0; }
    .tata-letak { display: block; }
    .kwitansi { box-shadow: none; position: static; max-width: 34rem; margin-inline: auto; }
  }
</style>
</head>
<body>
  <div class="bentuk-dekor no-print" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
  </div>

  <a href="/tools/" class="tombol-kembali-mengambang no-print">← Kembali ke Perkakas</a>

  <div class="panggung">
    <header class="judul-alat no-print">
      <h1>🧾 Generator Kwitansi</h1>
      <p>Isi form di sebelah kiri, pratinjau kwitansi dinas (3 tanda tangan) langsung tersusun di kanan.</p>
    </header>

    <div class="tata-letak">
      <div class="kartu-panel no-print" id="panel-form">
        <p class="subjudul-form">Data Transaksi</p>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-no">Nomor</label><input type="text" id="f-no" placeholder="mis. BPU 198"></div>
          <div class="bidang"><label for="f-rekening">Nama Rekening</label><input type="text" id="f-rekening" placeholder="mis. Belanja Konsumsi"></div>
        </div>
        <div class="bidang"><label for="f-sumberdana">Sumber Dana</label><input type="text" id="f-sumberdana" placeholder="mis. BOS Kinerja 2026"></div>
        <div class="bidang"><label for="f-dari">Sudah Terima Dari</label><input type="text" id="f-dari" placeholder="mis. Bendahara BOS SMA Negeri 1 Contoh"></div>
        <div class="bidang"><label for="f-jumlah">Banyaknya Uang (Rp)</label><input type="number" id="f-jumlah" min="0" placeholder="mis. 640000"></div>
        <div class="bidang"><label for="f-untuk">Untuk Pembayaran</label><textarea id="f-untuk" rows="2" placeholder="mis. Nasi bungkus untuk rapat perencanaan BOSKIN"></textarea></div>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-tempat">Tempat</label><input type="text" id="f-tempat" placeholder="mis. Muaro Jambi"></div>
          <div class="bidang"><label for="f-tanggal">Tanggal</label><input type="date" id="f-tanggal"></div>
        </div>

        <p class="subjudul-form">Penanda Tangan</p>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-kepsek-nama">Nama Kepala Sekolah</label><input type="text" id="f-kepsek-nama" placeholder="mis. Bambang Sugiharto, S.Pd"></div>
          <div class="bidang"><label for="f-kepsek-nip">NIP Kepala Sekolah</label><input type="text" id="f-kepsek-nip" placeholder="mis. 196801142005011000"></div>
        </div>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-bendahara-nama">Nama Bendahara Sekolah</label><input type="text" id="f-bendahara-nama" placeholder="mis. Rahmad Agus S.S, SE"></div>
          <div class="bidang"><label for="f-bendahara-nip">NIP Bendahara Sekolah</label><input type="text" id="f-bendahara-nip" placeholder="mis. 198208012014081002"></div>
        </div>
        <div class="bidang"><label for="f-penerima-nama">Nama Penerima Uang</label><input type="text" id="f-penerima-nama" placeholder="mis. Dendeng Batokok"></div>

        <button class="tombol" id="btn-print" style="width:100%; margin-top:0.5rem;">🖨️ Cetak / Simpan PDF</button>
      </div>

      <div class="kwitansi" id="kwitansi-cetak"></div>
    </div>
  </div>

  <script>
    // Algoritma terbilang baku Bahasa Indonesia (rekursif per 3 digit).
    var SATUAN = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
    function eja(n) {
      if (n < 12) return SATUAN[n];
      if (n < 20) return eja(n - 10) + ' belas';
      if (n < 100) return eja(Math.floor(n / 10)) + ' puluh' + (n % 10 !== 0 ? ' ' + eja(n % 10) : '');
      if (n < 200) return 'seratus' + (n % 100 !== 0 ? ' ' + eja(n % 100) : '');
      if (n < 1000) return eja(Math.floor(n / 100)) + ' ratus' + (n % 100 !== 0 ? ' ' + eja(n % 100) : '');
      if (n < 2000) return 'seribu' + (n % 1000 !== 0 ? ' ' + eja(n % 1000) : '');
      if (n < 1000000) return eja(Math.floor(n / 1000)) + ' ribu' + (n % 1000 !== 0 ? ' ' + eja(n % 1000) : '');
      if (n < 1000000000) return eja(Math.floor(n / 1000000)) + ' juta' + (n % 1000000 !== 0 ? ' ' + eja(n % 1000000) : '');
      if (n < 1000000000000) return eja(Math.floor(n / 1000000000)) + ' miliar' + (n % 1000000000 !== 0 ? ' ' + eja(n % 1000000000) : '');
      return eja(Math.floor(n / 1000000000000)) + ' triliun' + (n % 1000000000000 !== 0 ? ' ' + eja(n % 1000000000000) : '');
    }
    function terbilang(n) {
      n = Math.floor(Math.abs(n || 0));
      if (n === 0) return 'Nol';
      var teks = eja(n);
      return teks.charAt(0).toUpperCase() + teks.slice(1);
    }

    function formatRupiah(n) {
      if (!isFinite(n)) return 'Rp 0';
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }

    function nilai(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function escapeHtml(teks) {
      var div = document.createElement('div');
      div.textContent = teks || '';
      return div.innerHTML;
    }

    function formatTanggalIndo(iso, tempat) {
      var tempatTeks = tempat ? escapeHtml(tempat) + ', ' : '';
      if (!iso) return tempatTeks + '......................';
      var d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return tempatTeks + '......................';
      var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      return tempatTeks + d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
    }

    function render() {
      var jumlah = parseFloat(nilai('f-jumlah')) || 0;
      var el = document.getElementById('kwitansi-cetak');
      el.innerHTML =
        '<div class="judul-kwitansi">KUITANSI</div>' +

        '<table class="data-atas">' +
        '<tr><td class="label">Nomor</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-no')) || '......................') + '</td></tr>' +
        '<tr><td class="label">Nama Rekening</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-rekening')) || '......................') + '</td></tr>' +
        '<tr><td class="label">Sumber Dana</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-sumberdana')) || '......................') + '</td></tr>' +
        '</table>' +

        '<table class="data-bawah">' +
        '<tr class="bergaris"><td class="label">Sudah terima dari</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-dari')) || '......................') + '</td></tr>' +
        '<tr><td class="label">Banyaknya uang</td><td class="titik-dua">:</td><td><span class="jumlah-rupiah">' + formatRupiah(jumlah) + '</span></td></tr>' +
        '<tr><td class="label">Terbilang</td><td class="titik-dua">:</td><td class="terbilang-box">' + terbilang(jumlah) + ' Rupiah</td></tr>' +
        '<tr class="bergaris"><td class="label">Untuk pembayaran</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-untuk')) || '......................') + '</td></tr>' +
        '</table>' +

        '<div class="baris-tanggal">' + formatTanggalIndo(nilai('f-tanggal'), nilai('f-tempat')) + '</div>' +

        '<div class="baris-ttd">' +
        '<div class="kolom-ttd">' +
        '<div class="prefix-ttd">Setuju Dibayar,</div><div class="peran-ttd">Kepala Sekolah</div>' +
        '<div class="ruang-ttd"></div>' +
        '<div class="nama-ttd">' + (escapeHtml(nilai('f-kepsek-nama')) || '......................') + '</div>' +
        '<div class="nip-ttd">NIP. ' + (escapeHtml(nilai('f-kepsek-nip')) || '......................') + '</div>' +
        '</div>' +
        '<div class="kolom-ttd">' +
        '<div class="prefix-ttd">Lunas Dibayar,</div><div class="peran-ttd">Bendahara Sekolah</div>' +
        '<div class="ruang-ttd"></div>' +
        '<div class="nama-ttd">' + (escapeHtml(nilai('f-bendahara-nama')) || '......................') + '</div>' +
        '<div class="nip-ttd">NIP. ' + (escapeHtml(nilai('f-bendahara-nip')) || '......................') + '</div>' +
        '</div>' +
        '<div class="kolom-ttd">' +
        '<div class="peran-ttd">&nbsp;</div><div class="peran-ttd">Penerima Uang</div>' +
        '<div class="ruang-ttd"></div>' +
        '<div class="nama-ttd">' + (escapeHtml(nilai('f-penerima-nama')) || '......................') + '</div>' +
        '<div class="nip-ttd">&nbsp;</div>' +
        '</div>' +
        '</div>';
    }

    document.querySelectorAll('#panel-form input, #panel-form textarea').forEach(function (el) {
      el.addEventListener('input', render);
    });
    document.getElementById('btn-print').addEventListener('click', function () { window.print(); });

    render();
  </script>
</body>
</html>
