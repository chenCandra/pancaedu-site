<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Kwitansi | Perkakas PancaEdu</title>
<meta name="description" content="Isi nama penerima, jumlah uang, dan keperluan -- jumlahnya otomatis dieja jadi terbilang, hasilnya kwitansi siap cetak.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tools/assets/style.css">
<style>
  .panggung { max-width: 56rem; margin-inline: auto; padding: 1rem 1.25rem 3rem; padding-top: 4.5rem; }
  .judul-alat { text-align: center; margin-bottom: 1.5rem; }
  .judul-alat h1 { font-size: clamp(1.5rem, 4vw, 2rem); background: linear-gradient(90deg, var(--oranye), var(--kuning)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .judul-alat p { color: var(--tinta-lembut); margin-top: 0.4rem; }

  .tata-letak { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 52rem) { .tata-letak { grid-template-columns: 1fr 1fr; align-items: start; } }

  .baris-2kol { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  @media (max-width: 22rem) { .baris-2kol { grid-template-columns: 1fr; } }

  .kwitansi {
    position: sticky; top: 1.5rem;
    background: #fffdf2; border: 2px solid var(--tinta); box-shadow: var(--bayangan-kuat);
    padding: 1.75rem; font-size: 0.9rem; line-height: 1.8;
  }
  .kwitansi .judul-kwitansi { text-align: center; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.1em; border-bottom: 2px solid var(--tinta); padding-bottom: 0.75rem; margin-bottom: 1rem; }
  .kwitansi .baris-no { text-align: right; margin-bottom: 0.5rem; font-size: 0.85rem; }
  .kwitansi table { width: 100%; border-collapse: collapse; }
  .kwitansi table td { padding: 0.35rem 0; vertical-align: top; }
  .kwitansi table td.label { width: 9rem; font-weight: 600; }
  .kwitansi table td.titik-dua { width: 1rem; }
  .kwitansi .jumlah-rupiah { font-weight: 800; font-size: 1.15rem; border: 2px solid var(--tinta); padding: 0.4rem 0.75rem; display: inline-block; margin-top: 0.25rem; }
  .kwitansi .terbilang-box { font-style: italic; }
  .kwitansi .baris-ttd { display: flex; justify-content: space-between; margin-top: 2rem; }
  .kwitansi .kolom-ttd { text-align: center; width: 48%; }
  .kwitansi .ruang-ttd { height: 3.5rem; }

  @media print {
    body { background: #fff; }
    .panggung { max-width: none; padding: 0; }
    .tata-letak { display: block; }
    .kwitansi { box-shadow: none; position: static; max-width: 30rem; margin-inline: auto; }
  }
</style>
</head>
<body>
  <div class="bentuk-dekor no-print" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
  </div>

  <a href="/tools/" class="tombol-kembali-mengambang no-print">← Kembali ke Perkakas</a>

  <div class="panggung">
    <header class="judul-alat no-print">
      <h1>🧾 Generator Kwitansi</h1>
      <p>Isi form di sebelah kiri, jumlah uang otomatis dieja jadi terbilang di pratinjau kanan.</p>
    </header>

    <div class="tata-letak">
      <div class="kartu-panel no-print" id="panel-form">
        <div class="bidang"><label for="f-no">Nomor Kwitansi</label><input type="text" id="f-no" placeholder="mis. 001/KWT/2026"></div>
        <div class="bidang"><label for="f-dari">Sudah Terima Dari</label><input type="text" id="f-dari" placeholder="mis. Bendahara BOS SMA Negeri 1 Contoh"></div>
        <div class="bidang"><label for="f-jumlah">Jumlah Uang (Rp)</label><input type="number" id="f-jumlah" min="0" placeholder="mis. 1500000"></div>
        <div class="bidang"><label for="f-untuk">Untuk Pembayaran</label><textarea id="f-untuk" rows="3" placeholder="mis. pembelian ATK semester genap tahun ajaran 2025/2026"></textarea></div>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-tempat">Tempat</label><input type="text" id="f-tempat" placeholder="mis. Muaro Jambi"></div>
          <div class="bidang"><label for="f-tanggal">Tanggal</label><input type="date" id="f-tanggal"></div>
        </div>
        <div class="baris-2kol">
          <div class="bidang"><label for="f-penerima">Nama Penerima (penandatangan)</label><input type="text" id="f-penerima" placeholder="mis. Rina Marlina"></div>
          <div class="bidang"><label for="f-pemberi">Nama Pemberi (opsional)</label><input type="text" id="f-pemberi" placeholder="mis. Kepala Sekolah"></div>
        </div>

        <button class="tombol" id="btn-print" style="width:100%; margin-top:0.5rem;">🖨️ Cetak / Simpan PDF</button>
      </div>

      <div class="kwitansi" id="kwitansi-cetak"></div>
    </div>
  </div>

  <script>
    // Algoritma terbilang baku Bahasa Indonesia (rekursif per 3 digit).
    var SATUAN = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
    function eja(n) {
      if (n < 12) return SATUAN[n];
      if (n < 20) return eja(n - 10) + ' belas';
      if (n < 100) return eja(Math.floor(n / 10)) + ' puluh' + (n % 10 !== 0 ? ' ' + eja(n % 10) : '');
      if (n < 200) return 'seratus' + (n % 100 !== 0 ? ' ' + eja(n % 100) : '');
      if (n < 1000) return eja(Math.floor(n / 100)) + ' ratus' + (n % 100 !== 0 ? ' ' + eja(n % 100) : '');
      if (n < 2000) return 'seribu' + (n % 1000 !== 0 ? ' ' + eja(n % 1000) : '');
      if (n < 1000000) return eja(Math.floor(n / 1000)) + ' ribu' + (n % 1000 !== 0 ? ' ' + eja(n % 1000) : '');
      if (n < 1000000000) return eja(Math.floor(n / 1000000)) + ' juta' + (n % 1000000 !== 0 ? ' ' + eja(n % 1000000) : '');
      if (n < 1000000000000) return eja(Math.floor(n / 1000000000)) + ' miliar' + (n % 1000000000 !== 0 ? ' ' + eja(n % 1000000000) : '');
      return eja(Math.floor(n / 1000000000000)) + ' triliun' + (n % 1000000000000 !== 0 ? ' ' + eja(n % 1000000000000) : '');
    }
    function terbilang(n) {
      n = Math.floor(Math.abs(n || 0));
      if (n === 0) return 'Nol';
      var teks = eja(n);
      return teks.charAt(0).toUpperCase() + teks.slice(1);
    }

    function formatRupiah(n) {
      if (!isFinite(n)) return 'Rp 0';
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }

    function nilai(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function escapeHtml(teks) {
      var div = document.createElement('div');
      div.textContent = teks || '';
      return div.innerHTML;
    }

    function formatTanggalIndo(iso, tempat) {
      var tempatTeks = tempat ? escapeHtml(tempat) + ', ' : '';
      if (!iso) return tempatTeks + '......................';
      var d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return tempatTeks + '......................';
      var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      return tempatTeks + d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
    }

    function render() {
      var jumlah = parseFloat(nilai('f-jumlah')) || 0;
      var el = document.getElementById('kwitansi-cetak');
      el.innerHTML =
        '<div class="judul-kwitansi">KWITANSI</div>' +
        '<div class="baris-no">No: ' + (escapeHtml(nilai('f-no')) || '......................') + '</div>' +
        '<table>' +
        '<tr><td class="label">Sudah terima dari</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-dari')) || '......................') + '</td></tr>' +
        '<tr><td class="label">Banyaknya uang</td><td class="titik-dua">:</td><td class="terbilang-box">' + terbilang(jumlah) + ' rupiah</td></tr>' +
        '<tr><td class="label">Untuk pembayaran</td><td class="titik-dua">:</td><td>' + (escapeHtml(nilai('f-untuk')) || '......................') + '</td></tr>' +
        '</table>' +
        '<div style="text-align:right;" class="jumlah-rupiah">' + formatRupiah(jumlah) + '</div>' +
        '<div class="baris-ttd">' +
        '<div class="kolom-ttd"><div>&nbsp;</div><div class="ruang-ttd"></div><div>(' + (escapeHtml(nilai('f-pemberi')) || '......................') + ')</div></div>' +
        '<div class="kolom-ttd"><div>' + formatTanggalIndo(nilai('f-tanggal'), nilai('f-tempat')) + '</div><div class="ruang-ttd"></div><div><strong>' + (escapeHtml(nilai('f-penerima')) || '......................') + '</strong></div></div>' +
        '</div>';
    }

    document.querySelectorAll('#panel-form input, #panel-form textarea').forEach(function (el) {
      el.addEventListener('input', render);
    });
    document.getElementById('btn-print').addEventListener('click', function () { window.print(); });

    render();
  </script>
</body>
</html>
