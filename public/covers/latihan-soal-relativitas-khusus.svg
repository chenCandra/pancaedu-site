<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint7" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG7" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boardG7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pencilG7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint7)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG7)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG7)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="132" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#1b2340">Latihan Soal</text>
  <text x="26" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#1b2340">Relativitas Khusus (1)</text>
  <text x="26" y="188" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#4338ca">Latihan Soal dengan Pembahasan Lengkap</text>

  <!-- mini badge chips: Latihan / Soal / Pembahasan -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="15" y="14" width="22" height="26" rx="3" fill="#2563eb"/>
      <line x1="19" y1="22" x2="33" y2="22" stroke="#dbeafe" stroke-width="2"/>
      <line x1="19" y1="28" x2="33" y2="28" stroke="#dbeafe" stroke-width="2"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Latihan</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#d97706" stroke-width="2.2"/>
      <text x="26" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">?</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Soal</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M16 26 L23 33 L37 18" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">Pembahasan</text>
    </g>
  </g>

  <!-- hero illustration: clipboard with pencil and checkmark (simple) -->
  <g transform="translate(400,112)">
    <ellipse cx="90" cy="196" rx="120" ry="16" fill="#1b2340" opacity="0.08"/>

    <rect x="10" y="20" width="150" height="180" rx="14" fill="url(#boardG7)"/>
    <rect x="28" y="4" width="114" height="26" rx="8" fill="#1d4ed8"/>
    <rect x="28" y="52" width="114" height="150" rx="8" fill="#ffffff"/>

    <g stroke="#93c5fd" stroke-width="4" stroke-linecap="round">
      <line x1="42" y1="78" x2="128" y2="78"/>
      <line x1="42" y1="100" x2="128" y2="100"/>
      <line x1="42" y1="122" x2="100" y2="122"/>
    </g>

    <!-- checkmark badge -->
    <circle cx="118" cy="150" r="20" fill="#d1fae5"/>
    <path d="M108 150 L116 158 L130 142" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- pencil -->
    <g transform="translate(170,40) rotate(40)">
      <rect x="0" y="0" width="14" height="80" rx="3" fill="url(#pencilG7)"/>
      <path d="M0 80 L14 80 L7 100 Z" fill="#b45309"/>
      <rect x="0" y="-10" width="14" height="12" rx="2" fill="#f87171"/>
    </g>

    <!-- sparkle accents -->
    <path d="M190 150 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="4" cy="60" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="200" cy="70" r="4" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
