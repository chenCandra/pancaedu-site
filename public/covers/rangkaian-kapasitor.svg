<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG5)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1b2340">
    <text x="26" y="120">Rangkaian Kapasitor:</text>
    <text x="26" y="154">Seri dan Paralel</text>
  </g>
  <text x="26" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9d174d">Seri vs Paralel: Kapasitansi Total</text>

  <!-- mini badge chips: Seri / Paralel / C total -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,204)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="10" y1="26" x2="18" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="22" y1="19" x2="22" y2="33" stroke="#1d4ed8" stroke-width="2.4"/>
      <line x1="26" y1="19" x2="26" y2="33" stroke="#1d4ed8" stroke-width="2.4"/>
      <line x1="30" y1="26" x2="34" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="34" y1="26" x2="42" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round" opacity="0"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Seri</text>
    </g>
    <g transform="translate(104,206)">
      <circle cx="26" cy="26" r="26" fill="#ccfbf1"/>
      <line x1="12" y1="16" x2="12" y2="36" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="40" y1="16" x2="40" y2="36" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="12" y1="20" x2="40" y2="20" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="12" y1="32" x2="40" y2="32" stroke="#0d9488" stroke-width="2.2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">Paralel</text>
    </g>
    <g transform="translate(182,206)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <text x="26" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#7c3aed">ΣC</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">C total</text>
    </g>
  </g>

  <!-- hero illustration: series capacitor loop vs parallel capacitor branches -->
  <g transform="translate(372,85)">
    <ellipse cx="130" cy="190" rx="130" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- SERIES diagram -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <rect x="8" y="40" width="94" height="92" rx="8"/>
    </g>
    <!-- series caps on top wire -->
    <rect x="6" y="36" width="98" height="8" fill="#fde7f3" opacity="0"/>
    <line x1="33" y1="34" x2="33" y2="46" stroke="#7c3aed" stroke-width="4"/>
    <line x1="39" y1="34" x2="39" y2="46" stroke="#7c3aed" stroke-width="4"/>
    <line x1="71" y1="34" x2="71" y2="46" stroke="#7c3aed" stroke-width="4"/>
    <line x1="77" y1="34" x2="77" y2="46" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="8" cy="40" r="3.5" fill="#64748b"/>
    <circle cx="102" cy="132" r="3.5" fill="#64748b"/>
    <text x="55" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Seri</text>

    <!-- PARALLEL diagram -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="150" y1="40" x2="230" y2="40"/>
      <line x1="150" y1="132" x2="230" y2="132"/>
      <line x1="150" y1="40" x2="150" y2="132"/>
      <line x1="230" y1="40" x2="230" y2="132"/>
    </g>
    <!-- parallel branch 1 -->
    <line x1="176" y1="40" x2="176" y2="80" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="176" y1="92" x2="176" y2="132" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="168" y1="80" x2="184" y2="80" stroke="#7c3aed" stroke-width="4"/>
    <line x1="168" y1="92" x2="184" y2="92" stroke="#7c3aed" stroke-width="4"/>
    <!-- parallel branch 2 -->
    <line x1="204" y1="40" x2="204" y2="80" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="204" y1="92" x2="204" y2="132" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="196" y1="80" x2="212" y2="80" stroke="#7c3aed" stroke-width="4"/>
    <line x1="196" y1="92" x2="212" y2="92" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="150" cy="40" r="3.5" fill="#64748b"/>
    <circle cx="150" cy="132" r="3.5" fill="#64748b"/>
    <text x="190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Paralel</text>

    <!-- decorative accents -->
    <path d="M232 20 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="14" cy="18" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="246" cy="168" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <path d="M118 185 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
