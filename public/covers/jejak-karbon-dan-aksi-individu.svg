<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi siluet jejak kaki yang berisi ikon-ikon ramah lingkungan seperti sepeda, gelas guna ulang, dan tanaman, menggambarkan jejak karbon dan aksi individu secara positif">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <clipPath id="footClip2">
      <path d="M130 55
        C 175 55 182 95 178 125
        C 174 155 198 165 202 200
        C 206 240 182 260 145 258
        C 110 256 98 230 102 200
        C 105 175 88 160 86 130
        C 84 95 100 55 130 55 Z"/>
    </clipPath>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Jejak Karbon</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Aksi Kecil, Dampak Besar untuk Bumi</text>

  <!-- badge chips: Transportasi / Listrik / Sampah -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="18" cy="34" r="7" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <circle cx="34" cy="34" r="7" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <path d="M18 34 L24 18 H30 L34 34 M24 18 L28 24" stroke="#1d4ed8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Transportasi</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M28 12 L18 28 H24 L21 40 L34 23 H27 Z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Listrik</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <path d="M18 18 H34 L32 38 H20 Z" fill="#16a34a"/>
      <rect x="16" y="14" width="20" height="5" rx="2" fill="#15803d"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Sampah</text>
    </g>
  </g>

  <!-- hero illustration: jejak kaki hijau berisi ikon ramah lingkungan -->
  <g transform="translate(362,96)">
    <ellipse cx="90" cy="222" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- jejak kaki -->
    <path d="M130 55
      C 175 55 182 95 178 125
      C 174 155 198 165 202 200
      C 206 240 182 260 145 258
      C 110 256 98 230 102 200
      C 105 175 88 160 86 130
      C 84 95 100 55 130 55 Z" fill="url(#footG)"/>
    <circle cx="94" cy="70" r="12" fill="url(#footG)"/>
    <circle cx="118" cy="56" r="13" fill="url(#footG)"/>
    <circle cx="146" cy="54" r="13" fill="url(#footG)"/>
    <circle cx="172" cy="62" r="11" fill="url(#footG)"/>
    <circle cx="192" cy="78" r="9" fill="url(#footG)"/>

    <g clip-path="url(#footClip2)">
      <!-- sepeda, biru -->
      <g transform="translate(130,120)">
        <circle cx="-22" cy="16" r="15" fill="none" stroke="#2563eb" stroke-width="3.6"/>
        <circle cx="22" cy="16" r="15" fill="none" stroke="#2563eb" stroke-width="3.6"/>
        <path d="M-22 16 L-4 -10 L16 -10 L22 16 M-4 -10 L8 16 M-22 16 L16 -10" stroke="#1d4ed8" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- gelas guna ulang, teal -->
      <g transform="translate(104,192)">
        <path d="M-9 -12 L9 -12 L6 18 Q0 23 -6 18 Z" fill="#2dd4bf"/>
        <rect x="-11" y="-18" width="22" height="6" rx="3" fill="#0f766e"/>
      </g>

      <!-- tanaman kecil, hijau+pink bunga -->
      <g transform="translate(150,196)">
        <rect x="-9" y="4" width="18" height="12" rx="2" fill="#a16207"/>
        <path d="M0 4 Q -9 -12 -2 -22" stroke="#15803d" stroke-width="2.6" fill="none"/>
        <path d="M0 4 Q 9 -9 4 -20" stroke="#16a34a" stroke-width="2.6" fill="none"/>
        <circle cx="-2" cy="-22" r="5.5" fill="#f472b6"/>
        <circle cx="4" cy="-20" r="5.5" fill="#fbbf24"/>
      </g>
    </g>

    <path d="M130 55
      C 175 55 182 95 178 125
      C 174 155 198 165 202 200
      C 206 240 182 260 145 258
      C 110 256 98 230 102 200
      C 105 175 88 160 86 130
      C 84 95 100 55 130 55 Z" fill="none" stroke="#15803d" stroke-width="3.5"/>

    <!-- panah aksi positif -->
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M220 110 Q 254 118 248 150"/>
      <path d="M248 150 l -11 -5 M248 150 l 3 -12"/>
    </g>

    <!-- dotted link, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <path d="M40 90 Q 70 70 86 56" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M30 170 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="220" cy="60" r="3.5" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
