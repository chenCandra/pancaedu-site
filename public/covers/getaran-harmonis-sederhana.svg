<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint7" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG7" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="springHG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="massG3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bobG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint7)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG7)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG7)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="118">Getaran Harmonis</text>
    <text x="26" y="152">Sederhana (Pegas</text>
    <text x="26" y="186">dan Bandul)</text>
  </g>
  <text x="26" y="214" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Periode Konstan, Pegas dan Bandul</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,244)">
      <circle cx="26" cy="26" r="26" fill="#ccfbf1"/>
      <path d="M14 26 l6 -7 6 7 6 -7 6 7" stroke="#0d9488" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Pegas</text>
    </g>
    <g transform="translate(104,244)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <path d="M26 14 L26 20" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 20 L36 34" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="38" r="5" fill="#ca8a04"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Bandul</text>
    </g>
    <g transform="translate(182,244)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M12 26 Q19 14 26 26 Q33 38 40 26" stroke="#db2777" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Periode</text>
    </g>
  </g>

  <!-- hero illustration: mass-on-spring oscillating beside a swinging pendulum, with motion arcs -->
  <g transform="translate(360,100)">
    <ellipse cx="130" cy="236" rx="132" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- mass-on-spring, horizontal, left -->
    <rect x="0" y="130" width="10" height="36" rx="3" fill="#64748b"/>
    <path d="M10 134 l10 -8 10 16 10 -16 10 16 10 -16 10 16 10 -16 10 16 L100 134" stroke="url(#springHG)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="122" width="40" height="40" rx="7" fill="url(#massG3)"/>
    <line x1="120" y1="122" x2="120" y2="90" stroke="#1b2340" stroke-width="0" opacity="0"/>

    <!-- oscillation dashed arc for the spring mass -->
    <path d="M100 100 Q140 90 100 180 Q60 190 100 100" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 6" opacity="0.5"/>

    <!-- pendulum, right -->
    <circle cx="210" cy="30" r="5" fill="#334155"/>
    <line x1="210" y1="30" x2="178" y2="140" stroke="#334155" stroke-width="2.6"/>
    <circle cx="178" cy="150" r="16" fill="url(#bobG)"/>

    <!-- pendulum swing dashed arc -->
    <path d="M150 140 A62 62 0 0 1 240 134" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2 6" opacity="0.55"/>
    <line x1="210" y1="30" x2="150" y2="140" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.5"/>

    <!-- sparkle accents -->
    <path d="M60 60 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="246" cy="170" r="4" fill="#059669" opacity="0.7"/>
    <circle cx="20" cy="210" r="3" fill="#fbbf24" opacity="0.6"/>
  </g>
</svg>
