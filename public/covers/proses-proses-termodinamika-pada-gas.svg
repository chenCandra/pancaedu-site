<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cylG5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="pistonG5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="gaugeG5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG5)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f97316" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fed7aa" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#ffedd5"/>
    <text x="493" y="32" text-anchor="middle" fill="#9a3412">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="188" height="24" rx="12" fill="#f97316"/>
    <text x="122" y="84.5" text-anchor="middle" fill="#ffffff">TERMODINAMIKA</text>
  </g>

  <!-- title (2 lines, long title) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Proses-proses</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Termodinamika pada Gas</text>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9a3412">Isobarik, Isokhorik, Isotermal di Diagram P-V</text>

  <!-- mini badge chips: Isobarik / Isokhorik / Isotermal -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="13" y="22" width="26" height="9" rx="2" fill="#2563eb"/>
      <path d="M16 16 h20 m-6 -3 l6 3 -6 3" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Isobarik</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <rect x="15" y="15" width="22" height="22" rx="2" fill="none" stroke="#059669" stroke-width="2.4"/>
      <path d="M15 15 l-3 -3 M37 15 l3 -3 M15 37 l-3 3 M37 37 l3 3" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">Isokhorik</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <rect x="22" y="12" width="8" height="24" rx="4" fill="#dc2626"/>
      <circle cx="26" cy="38" r="7" fill="#dc2626"/>
      <rect x="23" y="16" width="2" height="18" fill="#fecaca"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Isotermal</text>
    </g>
  </g>

  <!-- hero illustration: piston-cylinder with gas molecules and a pressure gauge -->
  <g transform="translate(366,106)">
    <ellipse cx="120" cy="196" rx="140" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- cylinder body -->
    <rect x="38" y="48" width="100" height="148" rx="10" fill="url(#cylG5)" stroke="#64748b" stroke-width="2"/>
    <rect x="46" y="56" width="84" height="132" rx="6" fill="#f8fafc" opacity="0.5"/>

    <!-- gas molecules inside -->
    <g>
      <circle cx="62" cy="150" r="6" fill="#38bdf8"/>
      <circle cx="88" cy="170" r="5" fill="#a855f7"/>
      <circle cx="112" cy="146" r="6.5" fill="#34d399"/>
      <circle cx="70" cy="178" r="4.5" fill="#fbbf24"/>
      <circle cx="104" cy="178" r="5" fill="#38bdf8"/>
      <circle cx="90" cy="134" r="4" fill="#a855f7"/>
    </g>

    <!-- piston -->
    <rect x="42" y="92" width="92" height="22" rx="4" fill="url(#pistonG5)" stroke="#9a3412" stroke-width="1.5"/>
    <rect x="80" y="40" width="16" height="54" rx="4" fill="#94a3b8"/>
    <rect x="68" y="18" width="40" height="22" rx="6" fill="#475569"/>

    <!-- piston motion arrows -->
    <path d="M22 70 v34 m0 -34 l-5 8 m5 -8 l5 8" stroke="#c2410c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 118 v-10 m0 10 l-5 -8 m5 8 l5 -8" stroke="#c2410c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- pressure gauge -->
    <g transform="translate(176,80)">
      <rect x="-10" y="18" width="20" height="14" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <g stroke="#94a3b8" stroke-width="1.6">
        <line x1="0" y1="-24" x2="0" y2="-19"/>
        <line x1="17" y1="-17" x2="13.5" y2="-13.5"/>
        <line x1="-17" y1="-17" x2="-13.5" y2="-13.5"/>
        <line x1="24" y1="0" x2="19" y2="0"/>
        <line x1="-24" y1="0" x2="-19" y2="0"/>
      </g>
      <line x1="0" y1="2" x2="14" y2="-12" stroke="url(#gaugeG5)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="3" fill="#1b2340"/>
      <text x="0" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">P</text>
    </g>

    <!-- small flame accent, bottom (isotermal heating context) -->
    <path d="M86 214 C80 206 78 198 82 193 C81 197 85 200 86 197 C88 200 92 203 90 208 C94 203 92 196 86 190 Z" fill="#fb923c" opacity="0.9"/>

    <!-- sparkle accents, varied colors -->
    <circle cx="4" cy="30" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <path d="M226 40 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="200" cy="150" r="3" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
