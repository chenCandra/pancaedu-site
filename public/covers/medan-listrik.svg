<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chargeG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="testG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG1)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1b2340">
    <text x="26" y="108">Medan Listrik: Pengaruh</text>
    <text x="26" y="134">yang Tak Terlihat di</text>
    <text x="26" y="160">Sekitar Muatan</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9d174d">Gaya Coulomb &amp; Muatan Uji</text>

  <!-- mini badge chips: E=F/q / Field Lines / Muatan Uji -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,206)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M14 30 L26 14 L23 24 L34 24 L22 40 L25 30 Z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">E=F/q</text>
    </g>
    <g transform="translate(104,206)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="26" r="3" fill="#d97706"/>
      <g stroke="#d97706" stroke-width="2.2" stroke-linecap="round">
        <line x1="26" y1="26" x2="26" y2="13"/>
        <line x1="26" y1="26" x2="37" y2="20"/>
        <line x1="26" y1="26" x2="37" y2="33"/>
        <line x1="26" y1="26" x2="26" y2="39"/>
        <line x1="26" y1="26" x2="15" y2="33"/>
        <line x1="26" y1="26" x2="15" y2="20"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Field Lines</text>
    </g>
    <g transform="translate(182,206)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
      <path d="M26 20 L26 32 M20 26 L32 26" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Muatan Uji</text>
    </g>
  </g>

  <!-- hero illustration: + charge radiating field lines, dashed equipotentials, small test charge -->
  <g transform="translate(372,60)">
    <ellipse cx="130" cy="236" rx="138" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- dashed equipotential circles -->
    <circle cx="130" cy="120" r="70" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.45"/>
    <circle cx="130" cy="120" r="108" fill="none" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.4"/>

    <!-- radiating field lines with small arrow ticks -->
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
      <line x1="176" y1="120" x2="234" y2="120"/>
      <line x1="162" y1="152" x2="203" y2="193"/>
      <line x1="130" y1="166" x2="130" y2="224"/>
      <line x1="98" y1="152" x2="57" y2="193"/>
      <line x1="84" y1="120" x2="26" y2="120"/>
      <line x1="98" y1="88" x2="57" y2="47"/>
      <line x1="130" y1="74" x2="130" y2="16"/>
      <line x1="162" y1="88" x2="203" y2="47"/>
    </g>
    <g fill="#64748b">
      <path d="M234 120 l-9 -5 l0 10 z"/>
      <path d="M130 224 l-5 -9 l10 0 z"/>
      <path d="M26 120 l9 -5 l0 10 z"/>
      <path d="M130 16 l-5 9 l10 0 z"/>
    </g>

    <!-- central positive charge sphere -->
    <circle cx="130" cy="120" r="42" fill="url(#chargeG1)"/>
    <rect x="112" y="117" width="36" height="7" rx="3" fill="#ffffff"/>
    <rect x="126.5" y="102" width="7" height="36" rx="3" fill="#ffffff"/>

    <!-- small test charge nearby -->
    <circle cx="214" cy="198" r="15" fill="url(#testG1)"/>
    <rect x="208" y="195.5" width="12" height="5" rx="2" fill="#ffffff"/>
    <rect x="211.5" y="192" width="5" height="12" rx="2" fill="#ffffff"/>
    <text x="214" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0d9488">q</text>

    <!-- decorative accents -->
    <path d="M232 36 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="36" cy="46" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="246" cy="236" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M44 220 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
