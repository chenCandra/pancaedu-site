<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG2)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">
    <text x="26" y="120">Medan Magnet:</text>
    <text x="26" y="158">Konsep Dasar</text>
  </g>
  <text x="26" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9d174d">Kutub, Kompas, dan Garis Gaya</text>

  <!-- mini badge chips: Kutub U-S / Field Lines / Kompas -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#f1f5f9"/>
      <rect x="14" y="19" width="12" height="14" rx="2" fill="url(#redG2)"/>
      <rect x="26" y="19" width="12" height="14" rx="2" fill="url(#blueG2)"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Kutub U-S</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="26" r="3" fill="#d97706"/>
      <g stroke="#d97706" stroke-width="2.2" stroke-linecap="round">
        <line x1="26" y1="26" x2="26" y2="13"/>
        <line x1="26" y1="26" x2="37" y2="20"/>
        <line x1="26" y1="26" x2="37" y2="33"/>
        <line x1="26" y1="26" x2="26" y2="39"/>
        <line x1="26" y1="26" x2="15" y2="33"/>
        <line x1="26" y1="26" x2="15" y2="20"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Field Lines</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#f1f5f9"/>
      <circle cx="26" cy="26" r="13" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M26 15 L30 26 L26 23 L22 26 Z" fill="#dc2626"/>
      <path d="M26 37 L22 26 L26 29 L30 26 Z" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Kompas</text>
    </g>
  </g>

  <!-- hero illustration: bar magnet with curving field lines + compass -->
  <g transform="translate(372,55)">
    <ellipse cx="120" cy="270" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- curved field lines, outer loops -->
    <g fill="none" stroke-linecap="round">
      <path d="M50 105 Q120 8 190 105" stroke="#14b8a6" stroke-width="2.2" stroke-dasharray="2 6" opacity="0.6"/>
      <path d="M71 105 Q120 42 169 105" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="2 6" opacity="0.6"/>
      <path d="M50 155 Q120 252 190 155" stroke="#14b8a6" stroke-width="2.2" stroke-dasharray="2 6" opacity="0.6"/>
      <path d="M71 155 Q120 218 169 155" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="2 6" opacity="0.6"/>
    </g>

    <!-- bar magnet -->
    <rect x="22" y="105" width="98" height="50" rx="10" fill="url(#redG2)"/>
    <rect x="120" y="105" width="98" height="50" rx="10" fill="url(#blueG2)"/>
    <text x="71" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">U</text>
    <text x="169" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">S</text>

    <!-- small compass, separate, lower right -->
    <g transform="translate(222,228)">
      <circle cx="0" cy="0" r="24" fill="#f1f5f9"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M0 -17 L5 0 L0 -3 L-5 0 Z" fill="#dc2626"/>
      <path d="M0 17 L-5 0 L0 3 L5 0 Z" fill="#2563eb"/>
      <circle cx="0" cy="0" r="2.6" fill="#334155"/>
    </g>

    <!-- decorative accents -->
    <path d="M222 30 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="20" cy="40" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="238" cy="110" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M30 230 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
