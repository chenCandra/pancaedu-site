<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <radialGradient id="blobG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soupG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="spoonHeatG3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="potG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="sunG3" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="rodHeatG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint3)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG3)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG3)"/>
  <rect width="640" height="360" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f97316" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fed7aa" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#ffedd5"/>
    <text x="493" y="32" text-anchor="middle" fill="#9a3412">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="188" height="24" rx="12" fill="#f97316"/>
    <text x="122" y="84.5" text-anchor="middle" fill="#ffffff">TERMODINAMIKA</text>
  </g>

  <!-- title (2 lines, long title) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1b2340">Perpindahan Kalor:</text>
  <text x="26" y="154" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1b2340">Konduksi, Konveksi, Radiasi</text>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9a3412">Tiga Cara Kalor Berpindah Tempat</text>

  <!-- mini badge chips: Konduksi / Konveksi / Radiasi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <rect x="12" y="23" width="28" height="6" rx="3" fill="url(#rodHeatG3)"/>
      <path d="M15 17 h12 m-4 -3 l4 3 -4 3" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Konduksi</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M16 20 a12 12 0 0 1 20 -2" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M36 18 l1 -6 l5 3" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 32 a12 12 0 0 1 -20 2" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M16 34 l-1 6 l-5 -3" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Konveksi</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="27" r="8" fill="#f59e0b"/>
      <g stroke="#d97706" stroke-width="2" stroke-linecap="round">
        <line x1="26" y1="12" x2="26" y2="16"/>
        <line x1="14" y1="27" x2="18" y2="27"/>
        <line x1="34" y1="27" x2="38" y2="27"/>
        <line x1="17" y1="18" x2="20" y2="21"/>
        <line x1="35" y1="18" x2="32" y2="21"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Radiasi</text>
    </g>
  </g>

  <!-- hero illustration: 3 mini-scenes -- spoon in soup, circulating pot, sun warming a face -->
  <g transform="translate(360,112)">
    <ellipse cx="135" cy="192" rx="150" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- scene A: konduksi -- spoon in hot soup bowl -->
    <g>
      <path d="M4 136 A36 18 0 0 0 76 136 L68 162 Q40 174 12 162 Z" fill="url(#soupG3)" stroke="#9a3412" stroke-width="2"/>
      <ellipse cx="40" cy="136" rx="36" ry="12" fill="#fb923c"/>
      <ellipse cx="40" cy="136" rx="36" ry="12" fill="none" stroke="#c2410c" stroke-width="1.4" opacity="0.6"/>
      <path d="M44 130 L62 66" stroke="url(#spoonHeatG3)" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="46" cy="128" rx="7" ry="11" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4" transform="rotate(-18 46 128)"/>
      <g stroke="#fdba74" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M20 118 q4 -8 0 -16"/>
        <path d="M32 112 q4 -8 0 -16"/>
      </g>
    </g>

    <!-- scene B: konveksi -- circulating water in a pot -->
    <g transform="translate(90,0)">
      <ellipse cx="42" cy="108" rx="32" ry="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M10 108 L18 164 Q42 176 66 164 L74 108 Z" fill="url(#potG3)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="42" cy="110" rx="28" ry="5" fill="#38bdf8"/>
      <path d="M28 118 Q20 136 34 148 Q48 157 58 140 Q62 128 52 120" stroke="#0369a1" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M52 120 l-9 -2 l4 9 z" fill="#0369a1"/>
      <rect x="4" y="112" width="8" height="5" rx="2" fill="#475569"/>
      <rect x="72" y="112" width="8" height="5" rx="2" fill="#475569"/>
      <g transform="translate(42,180)">
        <path d="M0 10 C-5 3 -7 -4 -3 -9 C-4 -5 0 -2 1 -5 C3 -2 6 1 4 6 C8 1 7 -6 0 -12 Z" fill="#f97316"/>
      </g>
    </g>

    <!-- scene C: radiasi -- sun warming a face, no medium needed -->
    <g transform="translate(176,0)">
      <g transform="translate(58,30)">
        <circle cx="0" cy="0" r="17" fill="url(#sunG3)"/>
        <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85">
          <line x1="0" y1="-25" x2="0" y2="-31"/>
          <line x1="17" y1="-17" x2="22" y2="-22"/>
          <line x1="24" y1="0" x2="30" y2="0"/>
        </g>
      </g>
      <g stroke="#fbbf24" stroke-width="2" stroke-dasharray="1 5" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M42 46 Q28 78 18 104"/>
      </g>
      <g transform="translate(14,118)">
        <circle cx="0" cy="0" r="18" fill="#fcd9b8"/>
        <path d="M-13 -4 A14 14 0 0 1 10 -12" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-5" cy="-1" r="1.6" fill="#78350f"/>
        <path d="M-9 6 Q-3 11 3 6" stroke="#92400e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- sparkle accents, varied colors -->
    <circle cx="4" cy="60" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <path d="M250 150 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="150" cy="20" r="3" fill="#2563eb" opacity="0.6"/>
  </g>
</svg>
