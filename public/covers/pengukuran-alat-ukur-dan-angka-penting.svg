<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi penggaris raksasa dengan beberapa tanda ukur berulang yang berkumpul menuju nilai rata-rata, siswa tersenyum puas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="560" cy="300" r="90" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="70" cy="70" r="80" fill="#ffffff" fill-opacity="0.08"/>

  <g fill="#fde68a">
    <path transform="translate(580,70) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <circle cx="500" cy="60" r="5" fill="#ec4899"/>

  <ellipse cx="320" cy="290" rx="200" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- penggaris besar -->
  <g transform="translate(320,170) rotate(-2)">
    <rect x="-260" y="-36" width="520" height="72" rx="16" fill="#3b82f6"/>
    <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="3">
      <line x1="-220" y1="-36" x2="-220" y2="-10"/>
      <line x1="-160" y1="-36" x2="-160" y2="2"/>
      <line x1="-100" y1="-36" x2="-100" y2="-10"/>
      <line x1="-40" y1="-36" x2="-40" y2="2"/>
      <line x1="20" y1="-36" x2="20" y2="-10"/>
      <line x1="80" y1="-36" x2="80" y2="2"/>
      <line x1="140" y1="-36" x2="140" y2="-10"/>
      <line x1="200" y1="-36" x2="200" y2="2"/>
    </g>
  </g>

  <!-- beberapa titik hasil ukur berulang berkumpul ke tengah -->
  <g>
    <circle cx="-30" cy="235" r="7" fill="#ec4899" transform="translate(330,0)"/>
    <circle cx="10" cy="240" r="7" fill="#fde047" transform="translate(330,0)"/>
    <circle cx="-15" cy="250" r="7" fill="#14b8a6" transform="translate(330,0)"/>
    <circle cx="25" cy="248" r="7" fill="#8b5cf6" transform="translate(330,0)"/>
    <circle cx="0" cy="258" r="7" fill="#ffffff" transform="translate(330,0)"/>
  </g>
  <!-- garis panah dari titik ke rata rata -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-dasharray="2 6">
    <line x1="300" y1="235" x2="325" y2="268"/>
    <line x1="340" y1="240" x2="327" y2="268"/>
    <line x1="315" y1="250" x2="326" y2="268"/>
    <line x1="355" y1="248" x2="328" y2="268"/>
    <line x1="330" y1="258" x2="330" y2="268"/>
  </g>
  <!-- lingkaran rata rata -->
  <circle cx="328" cy="272" r="16" fill="#22c55e"/>
  <circle cx="328" cy="272" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="328" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">x&#773;</text>

  <!-- karakter siswa puas di pojok -->
  <g transform="translate(110,250)">
    <path d="M-34 10 Q 0 -16 34 10 L 30 60 L -30 60 Z" fill="#ec4899"/>
    <circle cx="0" cy="-22" r="30" fill="#fde68a"/>
    <circle cx="-10" cy="-26" r="4.5" fill="#1e293b"/>
    <circle cx="10" cy="-26" r="4.5" fill="#1e293b"/>
    <path d="M-12 -10 Q 0 0 12 -10" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="-16" r="6" fill="#f9a8d4" fill-opacity="0.6"/>
    <circle cx="20" cy="-16" r="6" fill="#f9a8d4" fill-opacity="0.6"/>
    <path d="M26 20 L50 0" stroke="#fde68a" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(55,-6) rotate(-20)">
      <rect x="-9" y="-5" width="18" height="16" rx="6" fill="#fde68a"/>
      <rect x="-6" y="-18" width="9" height="16" rx="4" fill="#fde68a"/>
    </g>
  </g>
</svg>
