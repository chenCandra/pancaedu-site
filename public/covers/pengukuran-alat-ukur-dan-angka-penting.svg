<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="pg-bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pg-rulerG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pg-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="pg-blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#pg-bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#pg-blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#pg-blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">PENGUKURAN</text>
  </g>

  <text x="26" y="134" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Pengukuran Tunggal</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">&amp; Berulang</text>
  <text x="26" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Mencari Nilai yang Paling Bisa Dipercaya</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,210)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="27" r="4" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Tunggal</text>
    </g>
    <g transform="translate(104,210)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <circle cx="18" cy="23" r="3.2" fill="#be185d"/>
      <circle cx="28" cy="29" r="3.2" fill="#be185d"/>
      <circle cx="34" cy="20" r="3.2" fill="#be185d"/>
      <circle cx="22" cy="33" r="3.2" fill="#be185d"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9d174d">Berulang</text>
    </g>
    <g transform="translate(182,210)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#047857">x̄</text>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">Rata-rata</text>
    </g>
  </g>

  <g transform="translate(366,130)">
    <ellipse cx="128" cy="180" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- penggaris / garis bilangan besar -->
    <rect x="-4" y="30" width="264" height="34" rx="10" fill="url(#pg-rulerG)"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.9">
      <line x1="30" y1="30" x2="30" y2="46"/>
      <line x1="80" y1="30" x2="80" y2="52"/>
      <line x1="130" y1="30" x2="130" y2="46"/>
      <line x1="180" y1="30" x2="180" y2="52"/>
      <line x1="230" y1="30" x2="230" y2="46"/>
    </g>

    <!-- titik hasil ukur berulang, warna beragam, mengumpul -->
    <circle cx="100" cy="96" r="7" fill="#ec4899"/>
    <circle cx="140" cy="100" r="7" fill="#fbbf24"/>
    <circle cx="112" cy="108" r="7" fill="#14b8a6"/>
    <circle cx="150" cy="110" r="7" fill="#8b5cf6"/>
    <circle cx="126" cy="116" r="7" fill="#60a5fa"/>

    <!-- garis panah menuju rata-rata -->
    <g stroke="#78350f" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.5">
      <line x1="100" y1="96" x2="128" y2="140"/>
      <line x1="140" y1="100" x2="128" y2="140"/>
      <line x1="112" y1="108" x2="128" y2="140"/>
      <line x1="150" y1="110" x2="128" y2="140"/>
      <line x1="126" y1="116" x2="128" y2="140"/>
    </g>

    <!-- lingkaran rata-rata, hijau, besar -->
    <g transform="translate(128,150)">
      <circle r="22" fill="#22c55e"/>
      <circle r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">x̄</text>
    </g>

    <!-- karakter puas kecil, pink -->
    <g transform="translate(222,160)">
      <path d="M-26 8 Q 0 -14 26 8 L22 48 L-22 48 Z" fill="url(#pg-shirt)"/>
      <circle cx="0" cy="-18" r="24" fill="#fde68a"/>
      <circle cx="-8" cy="-20" r="3.6" fill="#1b2340"/>
      <circle cx="8" cy="-20" r="3.6" fill="#1b2340"/>
      <path d="M-9 -8 Q 0 0 9 -8" stroke="#1b2340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="-12" r="5" fill="#f9a8d4" opacity="0.6"/>
      <circle cx="16" cy="-12" r="5" fill="#f9a8d4" opacity="0.6"/>
      <path d="M22 16 L40 2" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="44" cy="-2" r="6" fill="#fde68a"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="20" cy="80" r="3.5" fill="#f97316" opacity="0.7"/>
    <circle cx="250" cy="90" r="4" fill="#a855f7" opacity="0.6"/>
    <path d="M40 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24"/>
  </g>
</svg>
