<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="gmBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="gmBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gmBlobPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gmHubG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#gmBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#gmBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#gmBlobPurple)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="170" height="24" rx="12" fill="#2563eb"/>
    <text x="113" y="84.5" text-anchor="middle" fill="#ffffff">GERAK MELINGKAR</text>
  </g>

  <!-- title -->
  <text x="26" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#1b2340">Gerak Melingkar</text>
  <text x="26" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">Berputar pada Lintasan Melingkar</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,206)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M26 26 L26 12 M26 26 L36 32" stroke="#2563eb" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Sudut</text>
    </g>
    <g transform="translate(104,206)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M16 26 A10 10 0 1 1 26 36" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M26 36 l-5 -2 2 5" stroke="#7c3aed" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Periode</text>
    </g>
    <g transform="translate(182,206)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M14 30 q3 -10 6 0 q3 -14 6 0 q3 -10 6 0 q3 -14 6 0" stroke="#d97706" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Frekuensi</text>
    </g>
  </g>

  <!-- hero illustration: colorful ferris wheel -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="196" rx="140" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- post -->
    <rect x="114" y="140" width="12" height="54" rx="3" fill="#1b2340" opacity="0.65"/>

    <!-- dashed orbit path -->
    <circle cx="120" cy="86" r="76" fill="none" stroke="#93c5fd" stroke-width="4" stroke-dasharray="10 9" opacity="0.8"/>

    <!-- direction arrow on the path -->
    <g transform="translate(120,6)">
      <path d="M-12 5 L8 -3 L-2 -14" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- spokes -->
    <g stroke="#93c5fd" stroke-width="4" opacity="0.9">
      <line x1="120" y1="86" x2="120" y2="12"/>
      <line x1="120" y1="86" x2="186" y2="48"/>
      <line x1="120" y1="86" x2="186" y2="124"/>
      <line x1="120" y1="86" x2="120" y2="160"/>
      <line x1="120" y1="86" x2="54" y2="124"/>
      <line x1="120" y1="86" x2="54" y2="48"/>
    </g>

    <!-- hub -->
    <circle cx="120" cy="86" r="16" fill="url(#gmHubG)"/>
    <circle cx="120" cy="86" r="6" fill="#fde047"/>

    <!-- gondolas: varied colors -->
    <g>
      <rect x="107" y="-4" width="26" height="22" rx="6" fill="#ef4444"/>
      <circle cx="115" cy="5" r="2" fill="#fff"/><circle cx="125" cy="5" r="2" fill="#fff"/>
      <path d="M113 11 Q120 15 127 11" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="173" y="37" width="26" height="22" rx="6" fill="#22c55e"/>
      <circle cx="181" cy="46" r="2" fill="#fff"/><circle cx="191" cy="46" r="2" fill="#fff"/>
      <path d="M179 52 Q186 56 193 52" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="173" y="113" width="26" height="22" rx="6" fill="#f97316"/>
      <circle cx="181" cy="122" r="2" fill="#fff"/><circle cx="191" cy="122" r="2" fill="#fff"/>
      <path d="M179 128 Q186 132 193 128" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="107" y="149" width="26" height="22" rx="6" fill="#eab308"/>
      <circle cx="115" cy="158" r="2" fill="#fff"/><circle cx="125" cy="158" r="2" fill="#fff"/>
      <path d="M113 164 Q120 168 127 164" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="41" y="113" width="26" height="22" rx="6" fill="#ec4899"/>
      <circle cx="49" cy="122" r="2" fill="#fff"/><circle cx="59" cy="122" r="2" fill="#fff"/>
      <path d="M47 128 Q54 132 61 128" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="41" y="37" width="26" height="22" rx="6" fill="#06b6d4"/>
      <circle cx="49" cy="46" r="2" fill="#fff"/><circle cx="59" cy="46" r="2" fill="#fff"/>
      <path d="M47 52 Q54 56 61 52" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- sparkle accents -->
    <path d="M232 170 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="8" cy="176" r="3.5" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
