<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drumG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coilPrimG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="coilSecG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#1b2340">
    <text x="26" y="108">Aplikasi Induksi:</text>
    <text x="26" y="140">Generator dan</text>
    <text x="26" y="172">Transformator</text>
  </g>
  <text x="26" y="196" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Mengubah Gerak Jadi Listrik AC</text>

  <!-- mini badge chips: Generator / Transformator / Induksi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,224)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <path d="M26 16 l8 5 -8 5 z" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.3" font-weight="700" fill="#1e3a8a">Generator</text>
    </g>
    <g transform="translate(104,224)">
      <circle cx="26" cy="26" r="26" fill="#f3e8ff"/>
      <rect x="22" y="12" width="8" height="28" rx="2" fill="#9333ea"/>
      <circle cx="16" cy="19" r="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
      <circle cx="16" cy="33" r="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
      <circle cx="36" cy="19" r="4" fill="none" stroke="#a855f7" stroke-width="1.6"/>
      <circle cx="36" cy="33" r="4" fill="none" stroke="#a855f7" stroke-width="1.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#6b21a8">Transformator</text>
    </g>
    <g transform="translate(182,224)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <circle cx="26" cy="26" r="3" fill="#db2777"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="3 4"/>
      <circle cx="26" cy="26" r="16" fill="none" stroke="#db2777" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Induksi</text>
    </g>
  </g>

  <!-- hero illustration: rotating-coil generator + transformer with voltage labels -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- generator drum -->
    <g transform="translate(50,70)">
      <circle r="44" fill="url(#drumG)"/>
      <circle r="44" fill="none" stroke="#1d4ed8" stroke-width="2"/>
      <path d="M-26 -8 a26 26 0 1 0 52 0" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M-26 8 a26 26 0 1 0 52 0" fill="none" stroke="#bfdbfe" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <!-- crank handle -->
      <line x1="44" y1="0" x2="62" y2="-14" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="62" cy="-14" r="6" fill="#1e3a8a"/>
      <!-- rotation arrows -->
      <path d="M-10 -40 a44 44 0 0 1 30 -4" fill="none" stroke="#14b8a6" stroke-width="2.4" stroke-dasharray="3 4"/>
      <path d="M20 -44 l7 3 -8 7 z" fill="#14b8a6"/>
    </g>
    <rect x="18" y="108" width="64" height="10" rx="4" fill="#1e3a8a"/>
    <g font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1e3a8a">
      <text x="50" y="140" text-anchor="middle">GENERATOR</text>
    </g>

    <!-- transformer -->
    <g transform="translate(150,30)">
      <rect x="18" y="0" width="14" height="86" rx="3" fill="url(#coreG)"/>
      <!-- primary coil -->
      <g stroke="url(#coilPrimG)" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M18 12 q-16 0 -16 10 q0 10 16 10"/>
        <path d="M18 30 q-16 0 -16 10 q0 10 16 10"/>
        <path d="M18 48 q-16 0 -16 10 q0 10 16 10"/>
      </g>
      <!-- secondary coil -->
      <g stroke="url(#coilSecG)" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M32 12 q16 0 16 10 q0 10 -16 10"/>
        <path d="M32 30 q16 0 16 10 q0 10 -16 10"/>
        <path d="M32 48 q16 0 16 10 q0 10 -16 10"/>
      </g>
      <g font-family="Arial, sans-serif" font-size="10" font-weight="800">
        <rect x="-32" y="90" width="42" height="18" rx="9" fill="#0284c7"/>
        <text x="-11" y="103" text-anchor="middle" fill="#ffffff">220V</text>
        <rect x="24" y="90" width="42" height="18" rx="9" fill="#9333ea"/>
        <text x="45" y="103" text-anchor="middle" fill="#ffffff">110V</text>
      </g>
    </g>

    <!-- sparkle accents -->
    <path d="M250 8 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="8" cy="20" r="3.5" fill="#f97316" opacity="0.75"/>
    <circle cx="240" cy="170" r="3" fill="#14b8a6" opacity="0.7"/>
  </g>
</svg>
