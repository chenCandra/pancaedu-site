<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="glbBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="glbBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glbBlobOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glbCarG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glbSunG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glbSpeedG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#glbBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#glbBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#glbBlobOrange)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="130" height="24" rx="12" fill="#2563eb"/>
    <text x="93" y="84.5" text-anchor="middle" fill="#ffffff">KINEMATIKA</text>
  </g>

  <!-- title -->
  <text x="26" y="108" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Gerak Lurus</text>
  <text x="26" y="150" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Beraturan</text>
  <text x="26" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">Kecepatan Konstan di Jalan Lurus</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,212)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 26 h28" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <path d="M30 20 l8 6 -8 6" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="26" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Kecepatan</text>
      <text x="26" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Tetap</text>
    </g>
    <g transform="translate(104,212)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M12 26 h28" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Lurus</text>
    </g>
    <g transform="translate(182,212)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">x=v·t</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Rumus</text>
    </g>
  </g>

  <!-- hero illustration: car on a straight road, constant speed -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="182" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sun, top right -->
    <circle cx="232" cy="4" r="22" fill="url(#glbSunG)"/>
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="232" y1="-28" x2="232" y2="-20"/>
      <line x1="260" y1="4" x2="252" y2="4"/>
      <line x1="252" y1="-16" x2="246" y2="-10"/>
    </g>

    <!-- small clouds -->
    <ellipse cx="60" cy="8" rx="20" ry="8" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="78" cy="4" rx="14" ry="7" fill="#ffffff" opacity="0.8"/>

    <!-- road -->
    <rect x="-10" y="150" width="270" height="34" rx="8" fill="#64748b"/>
    <g stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10" opacity="0.85">
      <line x1="-10" y1="167" x2="260" y2="167"/>
    </g>

    <!-- evenly spaced motion lines (constant speed) -->
    <g stroke="#93c5fd" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="6" y1="100" x2="26" y2="100"/>
      <line x1="40" y1="100" x2="60" y2="100"/>
      <line x1="6" y1="116" x2="26" y2="116"/>
      <line x1="40" y1="116" x2="60" y2="116"/>
    </g>

    <!-- cartoon car, cruising -->
    <g transform="translate(78,78)">
      <path d="M0 62 Q0 34 28 30 L54 12 Q70 4 92 4 L124 12 Q146 20 152 38 L160 38 Q176 38 176 56 L176 68 Z" fill="url(#glbCarG)"/>
      <path d="M58 16 Q72 8 90 8 L116 16 Q122 24 124 34 L64 34 Q60 24 58 16 Z" fill="#dbeafe"/>
      <circle cx="96" cy="46" r="3" fill="#1b2340"/>
      <circle cx="112" cy="46" r="3" fill="#1b2340"/>
      <path d="M92 54 Q102 59 112 54" stroke="#1b2340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="160" y="50" width="12" height="14" rx="3" fill="#fde047"/>
      <circle cx="36" cy="68" r="15" fill="#1b2340"/>
      <circle cx="36" cy="68" r="6" fill="#cbd5e1"/>
      <circle cx="142" cy="68" r="15" fill="#1b2340"/>
      <circle cx="142" cy="68" r="6" fill="#cbd5e1"/>
    </g>

    <!-- speedometer badge, needle steady -->
    <g transform="translate(224,56)">
      <circle cx="0" cy="0" r="24" fill="#ffffff"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#bfdbfe" stroke-width="2"/>
      <path d="M-14 8 A17 17 0 0 1 14 8" fill="none" stroke="url(#glbSpeedG)" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="2" x2="8" y2="-9" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="2.6" fill="#1b2340"/>
    </g>

    <!-- dotted guide line, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="4" y1="192" x2="248" y2="192"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M10 134 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="248" cy="130" r="4" fill="#ec4899" opacity="0.75"/>
    <circle cx="4" cy="40" r="3" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
