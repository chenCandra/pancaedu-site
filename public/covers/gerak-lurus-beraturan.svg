<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- decorative sky elements -->
  <circle cx="540" cy="70" r="36" fill="#fde047" opacity="0.95"/>
  <circle cx="540" cy="70" r="46" fill="#fde047" opacity="0.25"/>
  <circle cx="90" cy="60" r="16" fill="#ffffff" opacity="0.18"/>
  <circle cx="150" cy="95" r="10" fill="#ffffff" opacity="0.15"/>
  <circle cx="470" cy="150" r="8" fill="#ffffff" opacity="0.18"/>
  <circle cx="60" cy="150" r="22" fill="#ffffff" opacity="0.12"/>

  <!-- distant hills -->
  <ellipse cx="120" cy="260" rx="160" ry="40" fill="#60a5fa" opacity="0.35"/>
  <ellipse cx="480" cy="270" rx="200" ry="45" fill="#2563eb" opacity="0.35"/>

  <!-- road -->
  <rect x="0" y="255" width="640" height="105" fill="#334155"/>
  <rect x="0" y="255" width="640" height="10" fill="#1e293b"/>
  <!-- evenly spaced dashes implying constant speed -->
  <g fill="#fde047">
    <rect x="30" y="302" width="34" height="10" rx="4"/>
    <rect x="124" y="302" width="34" height="10" rx="4"/>
    <rect x="218" y="302" width="34" height="10" rx="4"/>
    <rect x="312" y="302" width="34" height="10" rx="4"/>
    <rect x="406" y="302" width="34" height="10" rx="4"/>
    <rect x="500" y="302" width="34" height="10" rx="4"/>
    <rect x="594" y="302" width="34" height="10" rx="4"/>
  </g>

  <!-- even, evenly-spaced motion lines behind the car (constant speed) -->
  <g stroke="#f97316" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="235" x2="105" y2="235"/>
    <line x1="60" y1="255" x2="105" y2="255"/>
    <line x1="140" y1="235" x2="185" y2="235"/>
    <line x1="140" y1="255" x2="185" y2="255"/>
  </g>

  <!-- cartoon car -->
  <g>
    <!-- shadow -->
    <ellipse cx="330" cy="292" rx="110" ry="14" fill="#0f172a" opacity="0.25"/>
    <!-- body -->
    <path d="M220 270 Q220 230 260 225 L300 200 Q320 190 350 190 L400 200 Q430 210 440 230 L450 230 Q470 230 470 255 L470 270 Z" fill="#ef4444"/>
    <!-- cabin window -->
    <path d="M305 205 Q322 196 348 196 L388 205 Q396 215 398 228 L312 228 Q306 216 305 205 Z" fill="#bfdbfe"/>
    <!-- roof highlight -->
    <rect x="230" y="258" width="235" height="12" fill="#fecaca" opacity="0.6"/>
    <!-- bumper + headlight -->
    <rect x="452" y="248" width="16" height="20" rx="4" fill="#fde047"/>
    <!-- smiley face on car -->
    <circle cx="340" cy="235" r="3.5" fill="#1e293b"/>
    <circle cx="362" cy="235" r="3.5" fill="#1e293b"/>
    <path d="M335 245 Q350 253 365 245" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="268" cy="275" r="22" fill="#1e293b"/>
    <circle cx="268" cy="275" r="9" fill="#cbd5e1"/>
    <circle cx="415" cy="275" r="22" fill="#1e293b"/>
    <circle cx="415" cy="275" r="9" fill="#cbd5e1"/>
  </g>

  <!-- speedometer icon holding steady -->
  <g transform="translate(486,210)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M-22 10 A26 26 0 0 1 22 10" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="2" x2="14" y2="-12" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="4" fill="#1e293b"/>
  </g>

  <!-- extra motion sparkle dots -->
  <circle cx="180" cy="225" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="215" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
