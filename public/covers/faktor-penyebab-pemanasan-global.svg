<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi mobil berasap, cerobong asap pabrik, dan tunggul pohon yang asapnya mengalir ke sebuah awan besar, menggambarkan faktor penyebab pemanasan global">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg3)"/>

  <!-- dekorasi lembut -->
  <circle cx="70" cy="70" r="50" fill="#ffffff" opacity="0.08"/>
  <circle cx="580" cy="300" r="60" fill="#ffffff" opacity="0.08"/>

  <!-- awan besar tujuan asap -->
  <g fill="#e2e8f0">
    <ellipse cx="320" cy="95" rx="90" ry="40"/>
    <ellipse cx="260" cy="85" rx="55" ry="34"/>
    <ellipse cx="390" cy="88" rx="58" ry="32"/>
  </g>
  <g fill="#cbd5e1" opacity="0.7">
    <ellipse cx="320" cy="110" rx="80" ry="22"/>
  </g>

  <!-- tanah -->
  <path d="M0 300 Q 160 275 330 300 T 640 290 L 640 360 L 0 360 Z" fill="#15803d"/>
  <path d="M0 320 Q 180 300 340 315 T 640 310 L 640 360 L 0 360 Z" fill="#22c55e"/>

  <!-- pabrik kiri -->
  <g transform="translate(110,230)">
    <rect x="-55" y="20" width="110" height="60" fill="#94a3b8"/>
    <rect x="-40" y="-20" width="18" height="40" fill="#64748b"/>
    <rect x="-10" y="-35" width="18" height="55" fill="#64748b"/>
    <rect x="-50" y="35" width="16" height="16" fill="#cbd5e1"/>
    <rect x="-20" y="35" width="16" height="16" fill="#cbd5e1"/>
    <rect x="10" y="35" width="16" height="16" fill="#cbd5e1"/>
    <!-- asap -->
    <g fill="#9ca3af" opacity="0.8">
      <circle cx="-1" cy="-50" r="12"/>
      <circle cx="10" cy="-68" r="15"/>
      <circle cx="4" cy="-90" r="18"/>
    </g>
  </g>

  <!-- mobil tengah -->
  <g transform="translate(320,275)">
    <rect x="-55" y="-18" width="110" height="26" rx="8" fill="#ef4444"/>
    <path d="M-35 -18 Q -20 -40 20 -40 Q 42 -40 48 -18 Z" fill="#ef4444"/>
    <rect x="-20" y="-34" width="36" height="16" fill="#bfdbfe" opacity="0.9"/>
    <circle cx="-30" cy="8" r="13" fill="#1f2937"/>
    <circle cx="30" cy="8" r="13" fill="#1f2937"/>
    <circle cx="-30" cy="8" r="5" fill="#9ca3af"/>
    <circle cx="30" cy="8" r="5" fill="#9ca3af"/>
    <!-- knalpot asap -->
    <g fill="#9ca3af" opacity="0.8">
      <circle cx="-72" cy="2" r="8"/>
      <circle cx="-88" cy="-10" r="11"/>
      <circle cx="-95" cy="-28" r="13"/>
    </g>
  </g>

  <!-- tunggul pohon kanan -->
  <g transform="translate(520,268)">
    <rect x="-16" y="0" width="32" height="30" fill="#92400e"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#b45309"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#78350f" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#78350f" stroke-width="2"/>
    <!-- asap halus dari tunggul -->
    <g fill="#9ca3af" opacity="0.6">
      <circle cx="4" cy="-22" r="8"/>
      <circle cx="10" cy="-38" r="10"/>
    </g>
  </g>

  <!-- rumput kecil -->
  <g stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M200 330 q 3 -12 0 -18"/>
    <path d="M210 332 q 3 -12 0 -18"/>
    <path d="M430 335 q 3 -12 0 -18"/>
  </g>
</svg>
