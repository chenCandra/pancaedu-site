<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="b7bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="b7blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b7beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="b7fulcrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
    <linearGradient id="b7weightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="b7weightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#b7bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#b7blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#b7blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1b2340">
    <text x="26" y="120">Kesetimbangan Benda</text>
    <text x="26" y="156">Tegar &amp; Titik Berat</text>
  </g>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Syarat &#931;F=0 dan &#931;&#964;=0 pada Benda Diam</text>

  <!-- mini badge chips: SF=0 / St=0 / Titik Berat -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,202)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="10" y1="26" x2="22" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22 26 l-7 -4 l0 8 z" fill="#1d4ed8"/>
      <line x1="30" y1="26" x2="42" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30 26 l7 -4 l0 8 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">&#931;F=0</text>
    </g>
    <g transform="translate(104,202)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M16 20 a11 11 0 1 1 0 14" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M16 34 l-6 1 l3 -6 z" fill="#7c3aed"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">&#931;&#964;=0</text>
    </g>
    <g transform="translate(182,202)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 14 L38 36 H14 Z" fill="none" stroke="#d97706" stroke-width="2.2"/>
      <circle cx="26" cy="27" r="3.2" fill="#d97706"/>
      <text x="26" y="59" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e"><tspan x="26">Titik</tspan><tspan x="26" dy="10">Berat</tspan></text>
    </g>
  </g>

  <!-- hero illustration: see-saw balanced on fulcrum with two weights -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="210" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- ground block -->
    <rect x="100" y="193" width="60" height="10" rx="3" fill="#94a3b8" opacity="0.8"/>

    <!-- fulcrum -->
    <path d="M105 193 L155 193 L130 156 Z" fill="url(#b7fulcrum)"/>

    <!-- beam -->
    <rect x="8" y="149" width="244" height="14" rx="7" fill="url(#b7beam)"/>
    <line x1="8" y1="153" x2="252" y2="153" stroke="#fde68a" stroke-width="2" opacity="0.6"/>

    <!-- distance markers -->
    <line x1="130" y1="143" x2="36" y2="143" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2 5" opacity="0.6"/>
    <line x1="130" y1="143" x2="190" y2="143" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 5" opacity="0.6"/>

    <!-- weight A: small, far from fulcrum -->
    <circle cx="36" cy="134" r="14" fill="url(#b7weightA)"/>
    <ellipse cx="31" cy="129" rx="4" ry="2.6" fill="#ffffff" opacity="0.35"/>

    <!-- weight B: bigger, closer to fulcrum -->
    <circle cx="190" cy="128" r="19" fill="url(#b7weightB)"/>
    <ellipse cx="183" cy="121" rx="5" ry="3.2" fill="#ffffff" opacity="0.35"/>

    <!-- balance check -->
    <g transform="translate(130,112)">
      <circle r="13" fill="#ffffff"/>
      <circle r="13" fill="none" stroke="#16a34a" stroke-width="2"/>
      <path d="M-6 0 L-1 6 L7 -7" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkle accents -->
    <path d="M246 60 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#f97316" opacity="0.85"/>
    <circle cx="14" cy="80" r="3" fill="#ec4899" opacity="0.75"/>
    <circle cx="230" cy="178" r="2.6" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
