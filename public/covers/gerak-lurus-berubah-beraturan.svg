<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- energetic background streaks -->
  <circle cx="560" cy="60" r="30" fill="#fde047" opacity="0.9"/>
  <circle cx="560" cy="60" r="42" fill="#fde047" opacity="0.2"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.18" stroke-linecap="round">
    <line x1="20" y1="60" x2="90" y2="50"/>
    <line x1="10" y1="100" x2="100" y2="92"/>
    <line x1="40" y1="140" x2="130" y2="130"/>
  </g>

  <!-- road -->
  <rect x="0" y="255" width="640" height="105" fill="#334155"/>
  <rect x="0" y="255" width="640" height="10" fill="#1e293b"/>

  <!-- dashes getting closer together to the right implying speeding up -->
  <g fill="#fde047">
    <rect x="20" y="302" width="18" height="10" rx="4"/>
    <rect x="70" y="302" width="22" height="10" rx="4"/>
    <rect x="128" y="302" width="26" height="10" rx="4"/>
    <rect x="196" y="302" width="30" height="10" rx="4"/>
    <rect x="276" y="302" width="36" height="10" rx="4"/>
  </g>

  <!-- dramatic curved skid marks -->
  <path d="M250 320 Q340 335 440 322" stroke="#0f172a" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M260 332 Q350 346 450 334" stroke="#0f172a" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- progressively longer / closer motion lines (acceleration) behind the car -->
  <g stroke="#f97316" stroke-linecap="round" opacity="0.95">
    <line x1="30" y1="225" x2="55" y2="225" stroke-width="5"/>
    <line x1="30" y1="245" x2="55" y2="245" stroke-width="5"/>
    <line x1="80" y1="222" x2="120" y2="222" stroke-width="6"/>
    <line x1="80" y1="248" x2="120" y2="248" stroke-width="6"/>
    <line x1="150" y1="219" x2="205" y2="219" stroke-width="7"/>
    <line x1="150" y1="251" x2="205" y2="251" stroke-width="7"/>
  </g>

  <!-- cartoon sporty car, leaning forward for urgency -->
  <g transform="translate(10,0)">
    <ellipse cx="370" cy="292" rx="115" ry="14" fill="#0f172a" opacity="0.3"/>
    <path d="M250 268 Q255 225 300 218 L345 192 Q368 182 398 184 L442 198 Q470 210 478 232 L492 232 Q512 232 512 256 L512 268 Z" fill="#f97316"/>
    <path d="M352 198 Q372 190 394 192 L430 203 Q438 214 440 227 L358 227 Q353 212 352 198 Z" fill="#bfdbfe"/>
    <rect x="262" y="256" width="250" height="12" fill="#fed7aa" opacity="0.6"/>
    <!-- spoiler -->
    <rect x="232" y="235" width="28" height="8" rx="3" fill="#1e293b"/>
    <rect x="236" y="225" width="6" height="16" fill="#1e293b"/>
    <!-- headlight -->
    <rect x="494" y="248" width="16" height="20" rx="4" fill="#fde047"/>
    <!-- determined face -->
    <path d="M378 232 L392 232" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M402 232 L416 232" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 245 Q397 240 412 245" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="305" cy="275" r="22" fill="#1e293b"/>
    <circle cx="305" cy="275" r="9" fill="#cbd5e1"/>
    <circle cx="458" cy="275" r="22" fill="#1e293b"/>
    <circle cx="458" cy="275" r="9" fill="#cbd5e1"/>
  </g>

  <!-- speedometer with needle swinging up fast -->
  <g transform="translate(120,90)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M-22 10 A26 26 0 0 1 22 10" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="2" x2="20" y2="-20" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="4" fill="#1e293b"/>
  </g>

  <!-- small motion stars for extra energy -->
  <path d="M560 180 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1 z" fill="#fde047" opacity="0.85"/>
  <circle cx="200" cy="140" r="5" fill="#ffffff" opacity="0.6"/>
</svg>
