<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="glbbBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="glbbBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glbbBlobRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glbbCarG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="glbbSpeedG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="glbbArrowG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#glbbBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#glbbBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#glbbBlobRed)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="130" height="24" rx="12" fill="#2563eb"/>
    <text x="93" y="84.5" text-anchor="middle" fill="#ffffff">KINEMATIKA</text>
  </g>

  <!-- title (reduced size, two lines, to fit the long name) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Gerak Lurus Berubah</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Beraturan</text>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c2410c">Melaju dengan Percepatan Tetap</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M12 32 Q26 16 40 32" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M34 20 l6 -4 1 7" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Percepatan</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M10 32 h12 m4 -6 h10 m4 -8 h10" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Kecepatan</text>
      <text x="26" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Berubah</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">v=v0+at</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Rumus</text>
    </g>
  </g>

  <!-- hero illustration: sportier car, accelerating -->
  <g transform="translate(372,118)">
    <ellipse cx="130" cy="182" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- growing motion lines (acceleration) -->
    <g stroke="#fca5a5" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="96" x2="14" y2="96" stroke-width="4"/>
      <line x1="0" y1="112" x2="14" y2="112" stroke-width="4"/>
      <line x1="22" y1="94" x2="44" y2="94" stroke-width="5"/>
      <line x1="22" y1="114" x2="44" y2="114" stroke-width="5"/>
      <line x1="54" y1="92" x2="84" y2="92" stroke-width="6"/>
      <line x1="54" y1="116" x2="84" y2="116" stroke-width="6"/>
    </g>

    <!-- skid marks -->
    <path d="M30 176 Q110 190 220 178" stroke="#1b2340" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.2"/>

    <!-- sporty car -->
    <g transform="translate(100,70)">
      <path d="M0 64 Q4 32 36 26 L62 8 Q82 -2 108 0 L138 10 Q158 20 164 40 L176 40 Q192 40 192 58 L192 70 Z" fill="url(#glbbCarG)"/>
      <path d="M66 12 Q84 2 104 4 L130 14 Q136 24 138 36 L72 36 Q68 22 66 12 Z" fill="#dbeafe"/>
      <!-- spoiler -->
      <rect x="-8" y="30" width="18" height="6" rx="2" fill="#1b2340"/>
      <rect x="-5" y="18" width="5" height="14" fill="#1b2340"/>
      <rect x="176" y="52" width="12" height="14" rx="3" fill="#fde047"/>
      <path d="M102 46 l10 0 M122 46 l10 0" stroke="#1b2340" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 58 Q112 53 124 58" stroke="#1b2340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="40" cy="70" r="15" fill="#1b2340"/>
      <circle cx="40" cy="70" r="6" fill="#cbd5e1"/>
      <circle cx="158" cy="70" r="15" fill="#1b2340"/>
      <circle cx="158" cy="70" r="6" fill="#cbd5e1"/>
    </g>

    <!-- speedometer, needle swung high -->
    <g transform="translate(224,34)">
      <circle cx="0" cy="0" r="24" fill="#ffffff"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#fecaca" stroke-width="2"/>
      <path d="M-14 8 A17 17 0 0 1 14 8" fill="none" stroke="url(#glbbSpeedG)" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="2" x2="12" y2="-13" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="2.6" fill="#1b2340"/>
    </g>

    <!-- acceleration arrow, green accent -->
    <g transform="translate(6,150)">
      <line x1="0" y1="0" x2="54" y2="0" stroke="url(#glbbArrowG)" stroke-width="7" stroke-linecap="round"/>
      <path d="M46 -9 L62 0 L46 9 Z" fill="#16a34a"/>
    </g>

    <!-- dotted guide, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="10" y1="192" x2="250" y2="192"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M250 110 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fde047" opacity="0.9"/>
    <circle cx="62" cy="4" r="4" fill="#14b8a6" opacity="0.8"/>
    <circle cx="200" cy="140" r="3.5" fill="#ec4899" opacity="0.7"/>
  </g>
</svg>
