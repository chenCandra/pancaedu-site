<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="waterG5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bugG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#422006"/>
    </linearGradient>
    <linearGradient id="candleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG5)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#a5f3fc" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a5f3fc" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#a5f3fc"/>
    <text x="493" y="32" text-anchor="middle" fill="#0e7490">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="110" height="24" rx="12" fill="#0e7490"/>
    <text x="83" y="84.5" text-anchor="middle" fill="#ffffff">FLUIDA</text>
  </g>

  <!-- title (3 lines, long title) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Tegangan Permukaan,</text>
  <text x="26" y="154" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Kapilaritas, dan</text>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Viskositas</text>
  <text x="26" y="208" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#155e75">Sifat-Sifat Tersembunyi di Permukaan Fluida</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,230)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M26 14 c6 8 9 12 9 17 a9 9 0 0 1 -18 0 c0 -5 3 -9 9 -17z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">Tegangan Permukaan</text>
    </g>
    <g transform="translate(104,230)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <path d="M18 14 L18 36 M34 14 L34 36" stroke="#0e7490" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M26 30 L26 18 M22 22 L26 18 L30 22" fill="none" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#155e75">Kapilaritas</text>
    </g>
    <g transform="translate(182,230)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 14 c6 7 10 12 10 17 a10 10 0 0 1 -20 0 c0 -5 4 -10 10 -17z" fill="#d97706"/>
      <path d="M22 28 q4 4 8 0" stroke="#fffbeb" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Viskositas</text>
    </g>
  </g>

  <!-- hero illustration: water strider on the surface + candle capillary detail -->
  <g transform="translate(372,112)">
    <ellipse cx="110" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- water surface -->
    <path d="M-20 108 Q20 102 50 108 Q80 114 110 108 Q140 102 170 108 Q200 114 240 108 L240 196 L-20 196 Z" fill="url(#waterG5)" opacity="0.88"/>
    <path d="M-20 108 Q20 102 50 108 Q80 114 110 108 Q140 102 170 108 Q200 114 240 108" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.9"/>

    <!-- surface tension dimples where the strider's legs touch -->
    <g stroke="#0369a1" stroke-width="1.6" fill="none" opacity="0.6">
      <ellipse cx="60" cy="110" rx="9" ry="3"/>
      <ellipse cx="96" cy="112" rx="9" ry="3"/>
      <ellipse cx="132" cy="110" rx="9" ry="3"/>
      <ellipse cx="156" cy="112" rx="9" ry="3"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="1.2" fill="none" opacity="0.5">
      <circle cx="60" cy="110" r="15"/>
      <circle cx="132" cy="110" r="15"/>
    </g>

    <!-- water strider insect standing on the surface -->
    <g>
      <ellipse cx="108" cy="92" rx="24" ry="8" fill="url(#bugG)"/>
      <circle cx="134" cy="90" r="6.5" fill="url(#bugG)"/>
      <circle cx="137" cy="88" r="1.3" fill="#fef3c7"/>
      <path d="M140 86 L148 80 M140 92 L148 96" stroke="#422006" stroke-width="1.6" stroke-linecap="round"/>
      <!-- legs touching dimples -->
      <path d="M96 96 L60 108" stroke="#422006" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M100 98 L96 112" stroke="#422006" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M112 98 L132 110" stroke="#422006" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M90 92 L132 110" stroke="#422006" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
      <path d="M120 96 L156 112" stroke="#422006" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- small candle + wick capillary detail, tucked corner -->
    <g transform="translate(232,150)">
      <circle cx="0" cy="0" r="22" fill="#ffffff"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#fde68a" stroke-width="2"/>
      <rect x="-6" y="-2" width="12" height="18" fill="url(#candleG)"/>
      <line x1="0" y1="-2" x2="0" y2="-10" stroke="#78350f" stroke-width="1.6"/>
      <path d="M0 -10 c-4 -5 4 -8 0 -14 c4 4 6 9 0 14z" fill="url(#flameG)"/>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M18 24 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="212" cy="20" r="3.4" fill="#f472b6" opacity="0.75"/>
    <circle cx="200" cy="50" r="3" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4">
      <line x1="0" y1="60" x2="190" y2="60"/>
    </g>
  </g>
</svg>
