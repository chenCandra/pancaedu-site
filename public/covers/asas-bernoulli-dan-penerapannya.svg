<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="pipeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flowG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="blobG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint3)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG3)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG3)"/>
  <rect width="640" height="360" fill="none" stroke="#a5f3fc" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a5f3fc" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#a5f3fc"/>
    <text x="493" y="32" text-anchor="middle" fill="#0e7490">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="110" height="24" rx="12" fill="#0e7490"/>
    <text x="83" y="84.5" text-anchor="middle" fill="#ffffff">FLUIDA</text>
  </g>

  <!-- title -->
  <text x="26" y="138" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Asas Bernoulli dan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Penerapannya</text>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#155e75">Aliran Cepat, Tekanan Jadi Rendah</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M14 30 q6 -6 12 0 q6 -6 12 0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M14 22 q6 -6 12 0 q6 -6 12 0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Bernoulli</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#fde68a"/>
      <circle cx="26" cy="27" r="10" fill="none" stroke="#b45309" stroke-width="2.2"/>
      <path d="M26 27 L26 20 M26 27 L31 29" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Tekanan</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M12 18 L26 18 M12 26 L30 26 M12 34 L22 34" stroke="#047857" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Kecepatan</text>
    </g>
  </g>

  <!-- hero illustration: venturi tube with flow particles + pressure gauges -->
  <g transform="translate(372,112)">
    <ellipse cx="110" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- venturi pipe cross-section (wide-narrow-wide) -->
    <path d="M-20 40 C 40 40, 70 70, 110 74 C 150 70, 180 40, 240 40 L 240 140 C 180 140, 150 110, 110 106 C 70 110, 40 140, -20 140 Z"
          fill="url(#pipeG)" opacity="0.9" stroke="#1e3a8a" stroke-width="2"/>

    <!-- flow particles: spaced wide at ends, bunched tight in the narrow middle -->
    <g fill="url(#flowG)">
      <circle cx="-6" cy="90" r="4.2"/>
      <circle cx="20" cy="90" r="4.2"/>
      <circle cx="46" cy="90" r="4.2"/>
      <circle cx="72" cy="90" r="3.6"/>
      <circle cx="90" cy="90" r="3"/>
      <circle cx="102" cy="90" r="2.6"/>
      <circle cx="113" cy="90" r="2.6"/>
      <circle cx="124" cy="90" r="2.6"/>
      <circle cx="136" cy="90" r="3"/>
      <circle cx="154" cy="90" r="3.6"/>
      <circle cx="180" cy="90" r="4.2"/>
      <circle cx="206" cy="90" r="4.2"/>
      <circle cx="232" cy="90" r="4.2"/>
    </g>

    <!-- pressure gauge: high pressure at wide section (left) -->
    <g transform="translate(10,16)">
      <circle cx="0" cy="0" r="18" fill="#ffffff"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#86efac" stroke-width="2"/>
      <path d="M-5 2 L0 -8 L5 2" stroke="#059669" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="12" text-anchor="middle" font-size="9" font-weight="800" fill="#065f46">P</text>
    </g>

    <!-- pressure gauge: low pressure at narrow section (middle) -->
    <g transform="translate(110,42)">
      <circle cx="0" cy="0" r="18" fill="#ffffff"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <path d="M-5 -2 L0 8 L5 -2" stroke="#b91c1c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#991b1b">P</text>
    </g>

    <!-- small speed label gauge at narrow section (velocity increases) -->
    <g transform="translate(110,138)">
      <circle cx="0" cy="0" r="16" fill="#ffffff"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M-7 4 L7 -4" stroke="#0369a1" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M2 -6 L7 -4 L5 1" fill="none" stroke="#0369a1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M230 170 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="-8" cy="160" r="3.6" fill="#f472b6" opacity="0.75"/>
    <circle cx="214" cy="20" r="3" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#f472b6" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.45">
      <line x1="0" y1="162" x2="220" y2="162"/>
    </g>
  </g>
</svg>
