<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <radialGradient id="blobG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hotG4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="coldG4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mercuryG4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint4)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG4)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG4)"/>
  <rect width="640" height="360" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f97316" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fed7aa" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#ffedd5"/>
    <text x="493" y="32" text-anchor="middle" fill="#9a3412">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="188" height="24" rx="12" fill="#f97316"/>
    <text x="122" y="84.5" text-anchor="middle" fill="#ffffff">TERMODINAMIKA</text>
  </g>

  <!-- title (2 lines, long title) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Hukum ke-Nol dan</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Hukum I Termodinamika</text>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9a3412">Kesetimbangan Termal dan Kekekalan Energi</text>

  <!-- mini badge chips: Kesetimbangan / Q / ΔU=Q-W -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <line x1="10" y1="20" x2="42" y2="20" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="26" y1="20" x2="26" y2="12" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M26 20 L12 20 L18 32 Z" fill="none" stroke="#059669" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M26 20 L40 20 L34 32 Z" fill="none" stroke="#059669" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M18 34 h16" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Kesetimbangan</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <text x="26" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#ea580c">Q</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Q</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#f3e8ff"/>
      <text x="26" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">ΔU</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">ΔU=Q-W</text>
    </g>
  </g>

  <!-- hero illustration: thermometer reaching equilibrium between a hot and cold object -->
  <g transform="translate(360,112)">
    <ellipse cx="135" cy="192" rx="150" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- hot block, left -->
    <g>
      <rect x="0" y="70" width="72" height="92" rx="12" fill="url(#hotG4)"/>
      <circle cx="36" cy="94" r="3" fill="#fee2e2"/>
      <g stroke="#fee2e2" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
        <path d="M14 134 q4 -8 0 -16"/>
        <path d="M26 138 q4 -8 0 -16"/>
        <path d="M46 138 q4 -8 0 -16"/>
        <path d="M58 134 q4 -8 0 -16"/>
      </g>
      <text x="36" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Panas</text>
    </g>

    <!-- cold block, right -->
    <g transform="translate(198,0)">
      <rect x="0" y="70" width="72" height="92" rx="12" fill="url(#coldG4)"/>
      <g fill="#dbeafe">
        <circle cx="36" cy="112" r="3"/>
        <g stroke="#dbeafe" stroke-width="2" stroke-linecap="round">
          <line x1="36" y1="98" x2="36" y2="126"/>
          <line x1="23" y1="112" x2="49" y2="112"/>
          <line x1="26" y1="102" x2="46" y2="122"/>
          <line x1="46" y1="102" x2="26" y2="122"/>
        </g>
      </g>
      <text x="36" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Dingin</text>
    </g>

    <!-- thermometer, centered, equilibrium reading -->
    <g transform="translate(135,36)">
      <rect x="-8" y="0" width="16" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="-4.5" y="30" width="9" height="86" rx="4.5" fill="url(#mercuryG4)"/>
      <circle cx="0" cy="124" r="15" fill="url(#mercuryG4)" stroke="#ffffff" stroke-width="2"/>
      <g stroke="#94a3b8" stroke-width="1.4">
        <line x1="8" y1="24" x2="13" y2="24"/>
        <line x1="8" y1="48" x2="13" y2="48"/>
        <line x1="8" y1="72" x2="13" y2="72"/>
        <line x1="8" y1="96" x2="13" y2="96"/>
      </g>
    </g>

    <!-- heat-flow arrows toward equilibrium -->
    <path d="M78 110 Q100 108 120 108" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M120 108 l-10 -4 l1 9 z" fill="#ef4444"/>
    <path d="M192 110 Q170 108 150 108" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M150 108 l10 -4 l-1 9 z" fill="#3b82f6"/>

    <!-- dashed equilibrium line -->
    <line x1="18" y1="150" x2="252" y2="150" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 5" opacity="0.6"/>

    <!-- sparkle accents, varied colors -->
    <circle cx="4" cy="40" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <path d="M260 44 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="135" cy="10" r="3" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
