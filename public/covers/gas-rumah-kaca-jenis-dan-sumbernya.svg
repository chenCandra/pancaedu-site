<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi kubah kaca rumah kaca menutupi sebuah lanskap kecil dengan sinar matahari masuk dan titik-titik molekul gas CO2, CH4, dan N2O di dalamnya">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="landG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Gas Rumah Kaca</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Jenis dan Sumbernya di Sekitar Kita</text>

  <!-- badge chips: CO2 / CH4 / N2O -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#e2e8f0"/>
      <circle cx="26" cy="26" r="9" fill="#374151"/>
      <circle cx="18" cy="18" r="6" fill="#ef4444"/>
      <circle cx="34" cy="18" r="6" fill="#ef4444"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">CO2</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#e2e8f0"/>
      <circle cx="26" cy="26" r="8" fill="#374151"/>
      <circle cx="17" cy="17" r="5" fill="#f1f5f9"/>
      <circle cx="35" cy="17" r="5" fill="#f1f5f9"/>
      <circle cx="17" cy="35" r="5" fill="#f1f5f9"/>
      <circle cx="35" cy="35" r="5" fill="#f1f5f9"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">CH4</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="20" cy="26" r="7" fill="#a855f7"/>
      <circle cx="33" cy="26" r="7" fill="#6d28d9"/>
      <circle cx="26.5" cy="15" r="6" fill="#ef4444"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">N2O</text>
    </g>
  </g>

  <!-- hero illustration: kubah rumah kaca lintas-bagian -->
  <g transform="translate(336,96)">
    <ellipse cx="140" cy="220" rx="170" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- matahari -->
    <circle cx="240" cy="18" r="22" fill="#fde047"/>
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="240" y1="-10" x2="240" y2="-20"/>
      <line x1="272" y1="18" x2="282" y2="18"/>
      <line x1="258" y1="0" x2="266" y2="-8"/>
    </g>
    <g stroke="#fde047" stroke-width="2.4" opacity="0.55">
      <line x1="218" y1="40" x2="150" y2="110"/>
      <line x1="200" y1="36" x2="124" y2="118"/>
      <line x1="182" y1="32" x2="100" y2="124"/>
    </g>

    <!-- tanah di dalam kubah -->
    <path d="M30 170 Q 140 150 250 170 L 250 190 L 30 190 Z" fill="url(#landG2)"/>

    <!-- kubah kaca -->
    <path d="M30 170 A 110 110 0 0 1 250 170" fill="#bae6fd" opacity="0.35" stroke="#38bdf8" stroke-width="4"/>
    <path d="M30 170 A 110 110 0 0 1 250 170 L 250 176 A 110 110 0 0 0 30 176 Z" fill="url(#domeG)" opacity="0.25"/>
    <line x1="30" y1="170" x2="30" y2="190" stroke="#38bdf8" stroke-width="4"/>
    <line x1="250" y1="170" x2="250" y2="190" stroke="#38bdf8" stroke-width="4"/>

    <!-- pohon kecil -->
    <g transform="translate(60,160)">
      <rect x="-3" y="0" width="6" height="14" fill="#78350f"/>
      <circle cx="0" cy="-6" r="12" fill="#22c55e"/>
    </g>
    <g transform="translate(220,160)">
      <rect x="-3" y="0" width="6" height="14" fill="#78350f"/>
      <circle cx="0" cy="-6" r="12" fill="#16a34a"/>
    </g>

    <!-- molekul gas di dalam kubah, warna beragam -->
    <g>
      <circle cx="100" cy="110" r="9" fill="#374151"/>
      <circle cx="90" cy="100" r="6" fill="#ef4444"/>
      <circle cx="110" cy="100" r="6" fill="#ef4444"/>
    </g>
    <g>
      <circle cx="175" cy="122" r="8" fill="#374151"/>
      <circle cx="166" cy="113" r="4.6" fill="#f1f5f9"/>
      <circle cx="184" cy="113" r="4.6" fill="#f1f5f9"/>
      <circle cx="166" cy="131" r="4.6" fill="#f1f5f9"/>
      <circle cx="184" cy="131" r="4.6" fill="#f1f5f9"/>
    </g>
    <g>
      <circle cx="140" cy="90" r="6" fill="#a855f7"/>
      <circle cx="150" cy="90" r="6" fill="#6d28d9"/>
      <circle cx="145" cy="80" r="5" fill="#ef4444"/>
    </g>

    <!-- dotted link, teal accent -->
    <g stroke="#14b8a6" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <path d="M50 70 Q 90 50 130 46" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M10 60 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f97316" opacity="0.85"/>
    <circle cx="270" cy="90" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
