<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dropG5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG5)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="163" height="24" rx="12" fill="#fbbf24"/>
    <text x="109.5" y="84.5" text-anchor="middle" fill="#ffffff">ENERGI BERSIH</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">Energi Terbarukan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Surya, Angin, Air, dan Panas Bumi</text>

  <!-- mini badge chips: Bersih / Berkelanjutan / Alami -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <path d="M26 10 C34 20 36 28 26 34 C16 28 18 20 26 10 Z" fill="#16a34a"/>
      <path d="M20 16 Q26 18 24 24" stroke="#86efac" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Bersih</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M26 38 C14 30 14 18 26 10 C38 18 38 30 26 38 Z" fill="#0ea5e9"/>
      <path d="M26 16 l0 16 M20 24 l6 -4 l6 4" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#075985">Berkelanjutan</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <path d="M26 12 C30 20 34 22 34 28 C34 34 30 38 26 38 C22 38 18 34 18 28 C18 22 22 20 26 12 Z" fill="#65a30d"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6212">Alami</text>
    </g>
  </g>

  <!-- hero illustration: bright optimistic scene -->
  <g>
    <!-- green ground -->
    <path d="M330 310 Q420 288 510 308 Q580 324 640 302 L640 360 L330 360 Z" fill="#16a34a"/>
    <path d="M330 328 Q440 312 540 330 Q590 340 640 320 L640 360 L330 360 Z" fill="#15803d"/>

    <!-- sun -->
    <g transform="translate(480,155)">
      <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-44" x2="0" y2="-33"/>
        <line x1="31" y1="-31" x2="23" y2="-23"/>
        <line x1="-31" y1="-31" x2="-23" y2="-23"/>
        <line x1="44" y1="0" x2="33" y2="0"/>
        <line x1="-44" y1="0" x2="-33" y2="0"/>
      </g>
      <circle r="30" fill="url(#sunG5)"/>
      <circle cx="-9" cy="-3" r="3" fill="#78350f"/>
      <circle cx="9" cy="-3" r="3" fill="#78350f"/>
      <path d="M-10 9 Q0 17 10 9" stroke="#78350f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- wind turbine -->
    <g transform="translate(598,190)">
      <rect x="-5" y="0" width="10" height="100" fill="#f3f4f6"/>
      <circle r="8" fill="#e5e7eb"/>
      <ellipse cx="0" cy="-32" rx="7" ry="32" fill="#f9fafb" transform="rotate(-15)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="32" fill="#f3f4f6" transform="rotate(105)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="32" fill="#bae6fd" transform="rotate(225)"/>
    </g>

    <!-- water droplet -->
    <g transform="translate(500,270)">
      <path d="M0 -44 C23 -12 26 12 0 30 C-26 12 -23 -12 0 -44 Z" fill="url(#dropG5)"/>
      <path d="M0 -26 C10 -9 12 5 0 16 C-5 9 -3 0 0 -26 Z" fill="#e0f2fe" opacity="0.8"/>
      <ellipse cx="0" cy="40" rx="50" ry="11" fill="#60a5fa" opacity="0.4"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M610 118 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fde047" opacity="0.9"/>
    <circle cx="438" cy="120" r="3.6" fill="#a855f7" opacity="0.65"/>
    <circle cx="452" cy="106" r="2.4" fill="#a855f7" opacity="0.55"/>
    <path d="M405 240 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f472b6" opacity="0.8"/>
    <circle cx="560" cy="270" r="3" fill="#14b8a6" opacity="0.65"/>
  </g>
</svg>
