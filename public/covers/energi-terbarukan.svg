  </defs>
  <rect width="640" height="360" fill="url(#bg5)"/>
  <circle cx="100" cy="300" r="90" fill="#ffffff" opacity="0.07"/>
  <circle cx="560" cy="60" r="70" fill="#ffffff" opacity="0.07"/>

  <g fill="#fff7ed" opacity="0.85">
