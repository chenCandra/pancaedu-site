<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint8" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG8" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalG8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="photonG8" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="electronG8" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint8)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG8)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG8)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="114" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Efek Fotolistrik dan</text>
  <text x="26" y="142" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Dualisme Gelombang-</text>
  <text x="26" y="170" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Partikel Cahaya</text>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4338ca">Cahaya: Kadang Gelombang, Kadang Partikel</text>

  <!-- mini badge chips: Foton / Elektron / Dualisme -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <circle cx="26" cy="26" r="7" fill="#eab308"/>
      <g stroke="#ca8a04" stroke-width="2" stroke-linecap="round">
        <line x1="26" y1="11" x2="26" y2="16"/>
        <line x1="26" y1="36" x2="26" y2="41"/>
        <line x1="11" y1="26" x2="16" y2="26"/>
        <line x1="36" y1="26" x2="41" y2="26"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">Foton</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="26" r="6" fill="#1d4ed8"/>
      <ellipse cx="26" cy="26" rx="16" ry="7" fill="none" stroke="#2563eb" stroke-width="1.8"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">Elektron</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M12 22 Q20 16 28 22 Q36 28 44 22" stroke="#6d28d9" stroke-width="2" fill="none"/>
      <circle cx="30" cy="30" r="4" fill="#a855f7"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Dualisme</text>
    </g>
  </g>

  <!-- hero illustration: photon hits metal surface, electron knocked loose -->
  <g transform="translate(372,122)">
    <ellipse cx="118" cy="186" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- metal surface -->
    <rect x="70" y="70" width="34" height="140" rx="6" fill="url(#metalG8)"/>
    <g stroke="#e2e8f0" stroke-width="2" opacity="0.6">
      <line x1="78" y1="90" x2="96" y2="90"/>
      <line x1="78" y1="110" x2="96" y2="110"/>
      <line x1="78" y1="130" x2="96" y2="130"/>
      <line x1="78" y1="150" x2="96" y2="150"/>
    </g>

    <!-- incoming photon with light-ray lines -->
    <g transform="translate(8,40)">
      <circle cx="0" cy="0" r="9" fill="url(#photonG8)"/>
      <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="-16" y1="-6" x2="-6" y2="-2"/>
        <line x1="-16" y1="6" x2="-6" y2="2"/>
        <line x1="-16" y1="0" x2="-8" y2="0"/>
      </g>
    </g>
    <line x1="18" y1="40" x2="68" y2="78" stroke="#eab308" stroke-width="2.4" stroke-dasharray="3 3"/>

    <!-- electron knocked loose with motion arrow -->
    <circle cx="150" cy="60" r="11" fill="url(#electronG8)"/>
    <path d="M110 78 Q130 68 148 62" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-dasharray="2 3"/>
    <path d="M140 56 L148 62 L142 70" stroke="#1d4ed8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="87" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">Permukaan Logam</text>

    <!-- sparkle accents -->
    <path d="M210 150 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="200" cy="30" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="20" cy="150" r="3.5" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
