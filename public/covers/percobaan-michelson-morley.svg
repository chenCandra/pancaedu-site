<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint6" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorG6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="beamG6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint6)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG6)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG6)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="114" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Percobaan Michelson-</text>
  <text x="26" y="144" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Morley: Eksperimen</text>
  <text x="26" y="174" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">yang Mengubah Fisika</text>
  <text x="26" y="194" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4338ca">Eksperimen yang Gagal Membuktikan Eter</text>

  <!-- mini badge chips: Interferometer / Eter / Hasil Nol -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,210)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M12 26 L32 26" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M32 26 L40 18 M32 26 L40 34" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="7.6" font-weight="700" fill="#92400e">Interferometer</text>
    </g>
    <g transform="translate(104,210)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <g stroke="#2563eb" stroke-width="1.6" opacity="0.8">
        <path d="M10 20 Q18 24 26 20 Q34 16 42 20" fill="none"/>
        <path d="M10 28 Q18 32 26 28 Q34 24 42 28" fill="none"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Eter</text>
    </g>
    <g transform="translate(182,210)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M16 26 L23 33 L37 18" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Hasil Nol</text>
    </g>
  </g>

  <!-- hero illustration: interferometer, beam split + recombine, mirrors -->
  <g transform="translate(372,122)">
    <ellipse cx="118" cy="186" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- source -->
    <rect x="0" y="100" width="22" height="22" rx="4" fill="#475569"/>
    <circle cx="11" cy="111" r="4" fill="#fde68a"/>

    <!-- beam splitter (diagonal mirror) -->
    <rect x="70" y="92" width="36" height="8" rx="2" fill="url(#mirrorG6)" transform="rotate(-45 88 111)"/>

    <!-- beam in -->
    <line x1="22" y1="111" x2="80" y2="111" stroke="url(#beamG6)" stroke-width="3"/>

    <!-- beam path 1: up to mirror -->
    <line x1="88" y1="104" x2="88" y2="40" stroke="url(#beamG6)" stroke-width="3"/>
    <rect x="66" y="30" width="44" height="9" rx="2" fill="url(#mirrorG6)"/>

    <!-- beam path 2: right to mirror -->
    <line x1="96" y1="111" x2="180" y2="111" stroke="url(#beamG6)" stroke-width="3"/>
    <rect x="178" y="92" width="9" height="40" rx="2" fill="url(#mirrorG6)"/>

    <!-- recombine down to detector -->
    <line x1="88" y1="118" x2="88" y2="168" stroke="url(#beamG6)" stroke-width="3" opacity="0.85"/>
    <circle cx="88" cy="178" r="12" fill="#fef3c7"/>
    <circle cx="88" cy="178" r="5" fill="#f59e0b"/>

    <!-- dashed eter wind lines -->
    <g stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.4">
      <line x1="140" y1="40" x2="210" y2="40"/>
      <line x1="140" y1="60" x2="200" y2="60"/>
    </g>

    <!-- sparkle accents -->
    <path d="M215 150 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="20" cy="40" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="200" cy="155" r="4" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
