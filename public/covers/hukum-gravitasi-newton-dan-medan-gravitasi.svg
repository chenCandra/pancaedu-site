<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="g1bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="g1blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="g1land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="g1moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="g1sat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="g1earthClip">
      <circle cx="0" cy="0" r="48"/>
    </clipPath>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#g1bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#g1blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#g1blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#1b2340">
    <text x="26" y="110">Hukum Gravitasi</text>
    <text x="26" y="142">Newton dan Medan</text>
    <text x="26" y="174">Gravitasi</text>
  </g>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Gaya Tarik Antar Massa di Jagat Raya</text>

  <!-- mini badge chips: F=Gm1m2/r2 / Medan / Gravitasi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,224)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="14" y1="26" x2="38" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="14" cy="26" r="5" fill="#2563eb"/>
      <circle cx="38" cy="26" r="7" fill="#1d4ed8"/>
      <path d="M22 26 l4 -3 l0 6 z" fill="#1d4ed8"/>
      <path d="M30 26 l-4 -3 l0 6 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.3" font-weight="700" fill="#1e3a8a">F=Gm1m2/r²</text>
    </g>
    <g transform="translate(104,224)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="26" cy="26" r="3" fill="#7c3aed"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="3 4"/>
      <circle cx="26" cy="26" r="16" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="3 4" opacity="0.7"/>
      <circle cx="26" cy="26" r="22" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.45"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Medan</text>
    </g>
    <g transform="translate(182,224)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <circle cx="26" cy="32" r="9" fill="#16a34a"/>
      <path d="M26 23 a9 9 0 0 1 0 18" stroke="#15803d" stroke-width="1.2" fill="none"/>
      <line x1="26" y1="8" x2="26" y2="19" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22 18 l4 6 l4 -6 z" fill="#15803d"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Gravitasi</text>
    </g>
  </g>

  <!-- hero illustration: Earth + orbiting satellite + Moon + gravity arrow -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="185" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- Earth -->
    <g transform="translate(60,100)">
      <circle r="48" fill="url(#g1ocean)"/>
      <g clip-path="url(#g1earthClip)">
        <ellipse cx="-14" cy="-12" rx="22" ry="15" fill="url(#g1land)" transform="rotate(-15)"/>
        <ellipse cx="18" cy="16" rx="16" ry="11" fill="url(#g1land)"/>
        <ellipse cx="-6" cy="24" rx="10" ry="7" fill="url(#g1land)"/>
      </g>
      <ellipse cx="-14" cy="-18" rx="18" ry="10" fill="#ffffff" opacity="0.15"/>
    </g>

    <!-- orbit path -->
    <ellipse cx="60" cy="100" rx="92" ry="38" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 6" opacity="0.5" transform="rotate(-12 60 100)"/>

    <!-- satellite -->
    <g transform="translate(140,50) rotate(25)">
      <rect x="-14" y="-6" width="28" height="12" rx="3" fill="url(#g1sat)"/>
      <rect x="-26" y="-3" width="10" height="6" fill="#fbbf24"/>
      <rect x="16" y="-3" width="10" height="6" fill="#fbbf24"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <line x1="0" y1="-6" x2="0" y2="-15" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Moon -->
    <g transform="translate(215,148)">
      <circle r="20" fill="url(#g1moon)"/>
      <circle cx="-6" cy="-5" r="3" fill="#9ca3af" opacity="0.6"/>
      <circle cx="7" cy="7" r="2.4" fill="#9ca3af" opacity="0.6"/>
    </g>

    <!-- dashed gravity arrow toward Earth center -->
    <path d="M198 142 L98 108" stroke="#ec4899" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.8" fill="none"/>
    <path d="M98 108 l11 -2 l-4 10 z" fill="#ec4899"/>

    <!-- sparkle accents -->
    <path d="M246 18 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#f97316" opacity="0.85"/>
    <path d="M16 182 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="252" cy="96" r="3" fill="#a855f7" opacity="0.7"/>
    <circle cx="6" cy="58" r="2.5" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
