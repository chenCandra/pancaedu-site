<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="t4bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="t4blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t4ballA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="t4ballB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#t4bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#t4blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#t4blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Jenis-jenis Tumbukan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1e3a8a">Lenting Sempurna, Sebagian &amp; Tidak Lenting</text>

  <!-- mini badge chips: Lenting Sempurna / Sebagian / Tidak Lenting -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <circle cx="26" cy="20" r="8" fill="#16a34a"/>
      <path d="M14 34 q12 10 24 0" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="26" y="59" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534"><tspan x="26">Lenting</tspan><tspan x="26" dy="10">Sempurna</tspan></text>
    </g>
    <g transform="translate(120,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M14 20 a12 12 0 0 1 24 0" stroke="#d97706" stroke-width="2.4" fill="none"/>
      <path d="M14 20 a12 12 0 0 0 24 0" stroke="#fde68a" stroke-width="2.4" fill="none"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Sebagian</text>
    </g>
    <g transform="translate(214,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <circle cx="19" cy="24" r="9" fill="#dc2626"/>
      <circle cx="33" cy="24" r="9" fill="#ef4444"/>
      <text x="26" y="59" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991b1b"><tspan x="26">Tidak</tspan><tspan x="26" dy="10">Lenting</tspan></text>
    </g>
  </g>

  <!-- hero illustration: two balls approaching + before/after bounce-vs-stick cue -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="195" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- approaching balls -->
    <circle cx="48" cy="96" r="21" fill="url(#t4ballA)"/>
    <ellipse cx="41" cy="88" rx="6" ry="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="210" cy="96" r="21" fill="url(#t4ballB)"/>
    <ellipse cx="203" cy="88" rx="6" ry="4" fill="#ffffff" opacity="0.3"/>

    <g stroke-linecap="round">
      <line x1="76" y1="96" x2="98" y2="96" stroke="#1d4ed8" stroke-width="3"/>
      <path d="M98 96 l-9 -5 l0 10 z" fill="#1d4ed8"/>
      <line x1="182" y1="96" x2="160" y2="96" stroke="#ea580c" stroke-width="3"/>
      <path d="M160 96 l9 -5 l0 10 z" fill="#ea580c"/>
    </g>

    <!-- impact spark -->
    <path d="M130 78 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#fbbf24" opacity="0.9"/>

    <!-- divider -->
    <line x1="128" y1="138" x2="128" y2="198" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 5" opacity="0.5"/>

    <!-- before/after outcome cues -->
    <g transform="translate(58,168)">
      <circle cx="-10" cy="0" r="9" fill="#4ade80"/>
      <circle cx="12" cy="0" r="9" fill="#16a34a"/>
      <path d="M-22 -10 q-6 -8 -2 -16" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M24 -10 q6 -8 2 -16" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(196,168)">
      <circle cx="-7" cy="0" r="10" fill="#f87171"/>
      <circle cx="9" cy="0" r="10" fill="#dc2626"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="250" cy="150" r="3.2" fill="#14b8a6" opacity="0.8"/>
    <path d="M8 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.75"/>
    <circle cx="140" cy="30" r="2.6" fill="#ec4899" opacity="0.8"/>
  </g>
</svg>
