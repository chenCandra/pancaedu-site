<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fefb"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="andG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="notG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#a7f3d0" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#10b981" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a7f3d0" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#d1fae5"/>
    <text x="493" y="32" text-anchor="middle" fill="#065f46">Fisika</text>
    <rect x="526" y="16" width="86" height="24" rx="12" fill="#e0e7ff"/>
    <text x="569" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="240" height="24" rx="12" fill="#10b981"/>
    <text x="148" y="84.5" text-anchor="middle" fill="#ffffff">ELEKTRONIKA DIGITAL</text>
  </g>

  <!-- title (3 lines, long title) -->
  <g font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">
    <text x="26" y="108">Gerbang Logika:</text>
    <text x="26" y="140">AND, OR, NOT,</text>
    <text x="26" y="172">dan Turunannya</text>
  </g>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#065f46">Blok Bangunan Dasar Semua Chip Komputer</text>

  <!-- mini badge chips: AND / OR / NOT -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,220)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 14 H22 A12,12 0 0 1 22,38 H12 Z" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">AND</text>
    </g>
    <g transform="translate(104,220)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M13 14 C21 14 30 19 30 26 C30 33 21 38 13 38 C18 31 18 19 13 14 Z" fill="#7c3aed"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">OR</text>
    </g>
    <g transform="translate(182,220)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M14 14 L34 26 L14 38 Z" fill="#dc2626"/>
      <circle cx="37" cy="26" r="3.5" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">NOT</text>
    </g>
  </g>

  <!-- hero illustration: three logic gates with glowing I/O dots and connecting traces -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="178" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- connecting lines (drawn first, under the gates) -->
    <g stroke="#475569" stroke-width="2" fill="none" opacity="0.6">
      <path d="M68 34 C100 40 118 50 146 68"/>
      <path d="M190 82 C160 100 110 110 54 138"/>
    </g>
    <g stroke="#14b8a6" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.6">
      <path d="M68 34 C100 40 118 50 146 68"/>
      <path d="M190 82 C160 100 110 110 54 138"/>
    </g>

    <!-- Gate 1: AND -->
    <g transform="translate(6,6)">
      <path d="M0 0 H28 A28,28 0 0 1 28,56 H0 Z" fill="url(#andG)"/>
      <circle cx="-6" cy="14" r="6" fill="#14b8a6" opacity="0.25"/>
      <circle cx="-6" cy="14" r="3" fill="#14b8a6"/>
      <circle cx="-6" cy="42" r="6" fill="#14b8a6" opacity="0.25"/>
      <circle cx="-6" cy="42" r="3" fill="#14b8a6"/>
      <circle cx="62" cy="28" r="7" fill="#fbbf24" opacity="0.3"/>
      <circle cx="62" cy="28" r="4" fill="#fbbf24"/>
    </g>

    <!-- Gate 2: OR -->
    <g transform="translate(150,54)">
      <path d="M0 2 C20 2 34 15 34 28 C34 41 20 54 0 54 C11 40 11 16 0 2 Z" fill="url(#orG)"/>
      <circle cx="-4" cy="16" r="6" fill="#14b8a6" opacity="0.25"/>
      <circle cx="-4" cy="16" r="3" fill="#14b8a6"/>
      <circle cx="-4" cy="40" r="6" fill="#14b8a6" opacity="0.25"/>
      <circle cx="-4" cy="40" r="3" fill="#14b8a6"/>
      <circle cx="40" cy="28" r="7" fill="#fbbf24" opacity="0.3"/>
      <circle cx="40" cy="28" r="4" fill="#fbbf24"/>
    </g>

    <!-- Gate 3: NOT -->
    <g transform="translate(60,120)">
      <path d="M0 0 L36 18 L0 36 Z" fill="url(#notG)"/>
      <circle cx="42" cy="18" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      <circle cx="-6" cy="18" r="6" fill="#14b8a6" opacity="0.25"/>
      <circle cx="-6" cy="18" r="3" fill="#14b8a6"/>
      <circle cx="54" cy="18" r="7" fill="#fbbf24" opacity="0.3"/>
      <circle cx="54" cy="18" r="4" fill="#fbbf24"/>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M232 -10 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <path d="M-8 162 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="214" cy="150" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="18" cy="72" r="3.5" fill="#a855f7" opacity="0.65"/>
  </g>
</svg>
