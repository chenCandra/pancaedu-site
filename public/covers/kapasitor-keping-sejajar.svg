<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateposG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="platenegG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (4 lines: very long title) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="28" fill="#1b2340">
    <text x="26" y="118">Kapasitor Keping</text>
    <text x="26" y="150">Sejajar: Menyimpan</text>
    <text x="26" y="182">Muatan dalam Medan</text>
    <text x="26" y="214">Listrik</text>
  </g>
  <text x="26" y="240" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Menyimpan Energi Lewat Medan Listrik</text>

  <!-- mini badge chips: C=Q/V / Medan Listrik / Muatan -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,268)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M32 16 a10 10 0 1 0 0 20" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">C=Q/V</text>
    </g>
    <g transform="translate(104,268)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <g stroke="#1d4ed8" stroke-width="2" stroke-linecap="round">
        <line x1="16" y1="16" x2="16" y2="36"/>
        <line x1="24" y1="16" x2="24" y2="36"/>
        <line x1="32" y1="16" x2="32" y2="36"/>
      </g>
      <path d="M24 30 l0 8 M24 32 l-3 -3 M24 32 l3 -3" stroke="#1d4ed8" stroke-width="1.6" fill="none"/>
      <text x="26" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#1e3a8a">Medan Listrik</text>
    </g>
    <g transform="translate(182,268)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <circle cx="26" cy="26" r="10" fill="#f97316"/>
      <text x="26" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">+</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Muatan</text>
    </g>
  </g>

  <!-- hero illustration: two parallel plates with +/- charges and field lines -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- positive plate (left) -->
    <rect x="30" y="10" width="20" height="160" rx="4" fill="url(#plateposG)"/>
    <!-- negative plate (right) -->
    <rect x="190" y="10" width="20" height="160" rx="4" fill="url(#platenegG)"/>

    <!-- charges on plates -->
    <g font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      <text x="40" y="34">+</text><text x="40" y="64">+</text><text x="40" y="94">+</text><text x="40" y="124">+</text><text x="40" y="154">+</text>
      <text x="200" y="34">&#8722;</text><text x="200" y="64">&#8722;</text><text x="200" y="94">&#8722;</text><text x="200" y="124">&#8722;</text><text x="200" y="154">&#8722;</text>
    </g>

    <!-- field lines between plates -->
    <g stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <line x1="60" y1="30" x2="182" y2="30"/>
      <line x1="60" y1="58" x2="182" y2="58"/>
      <line x1="60" y1="86" x2="182" y2="86"/>
      <line x1="60" y1="114" x2="182" y2="114"/>
      <line x1="60" y1="142" x2="182" y2="142"/>
    </g>
    <g fill="#a855f7">
      <path d="M182 30 l-10 -4 0 8 z"/>
      <path d="M182 58 l-10 -4 0 8 z"/>
      <path d="M182 86 l-10 -4 0 8 z"/>
      <path d="M182 114 l-10 -4 0 8 z"/>
      <path d="M182 142 l-10 -4 0 8 z"/>
    </g>

    <!-- voltage source hint -->
    <g transform="translate(90,186)" font-family="Arial, sans-serif" font-size="10" font-weight="800">
      <rect x="-24" y="-4" width="48" height="18" rx="9" fill="#ec4899"/>
      <text x="0" y="9" text-anchor="middle" fill="#ffffff">V</text>
    </g>

    <!-- sparkle accents -->
    <path d="M232 10 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="14" cy="4" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <circle cx="228" cy="170" r="3" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
