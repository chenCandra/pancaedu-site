<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi tujuh lencana besaran pokok: panjang, massa, waktu, suhu, arus listrik, intensitas cahaya, dan jumlah zat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="320" cy="340" r="140" fill="#ffffff" fill-opacity="0.06"/>

  <g fill="#fde68a">
    <path transform="translate(60,60) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
    <path transform="translate(580,70) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>

  <!-- 7 lencana tersusun melengkung -->
  <!-- 1 Panjang -->
  <g transform="translate(110,230)">
    <circle r="52" fill="#3b82f6"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <rect x="-28" y="-8" width="56" height="16" rx="4" fill="#ffffff"/>
    <line x1="-14" y1="-8" x2="-14" y2="2" stroke="#3b82f6" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="4" stroke="#3b82f6" stroke-width="2"/>
    <line x1="14" y1="-8" x2="14" y2="2" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">m</text>
  </g>
  <!-- 2 Massa -->
  <g transform="translate(205,160)">
    <circle r="52" fill="#ec4899"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <path d="M-22 -4 L22 -4 L16 14 L-16 14 Z" fill="#ffffff"/>
    <rect x="-6" y="-14" width="12" height="10" rx="2" fill="#ffffff"/>
    <text x="0" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">kg</text>
  </g>
  <!-- 3 Waktu -->
  <g transform="translate(320,120)">
    <circle r="52" fill="#14b8a6"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <circle r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="4" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">s</text>
  </g>
  <!-- 4 Suhu -->
  <g transform="translate(435,160)">
    <circle r="52" fill="#f97316"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <rect x="-6" y="-18" width="12" height="26" rx="6" fill="#ffffff"/>
    <circle cx="0" cy="12" r="11" fill="#ffffff"/>
    <circle cx="0" cy="12" r="6" fill="#ef4444"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">K</text>
  </g>
  <!-- 5 Arus listrik -->
  <g transform="translate(530,230)">
    <circle r="52" fill="#8b5cf6"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <path d="M4 -18 L-12 2 L-2 2 L-6 18 L12 -4 L2 -4 Z" fill="#fde047"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">A</text>
  </g>
  <!-- 6 Intensitas cahaya -->
  <g transform="translate(205,290)">
    <circle r="44" fill="#eab308"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <circle cy="-4" r="14" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-32"/>
      <line x1="16" y1="-16" x2="22" y2="-22"/>
      <line x1="-16" y1="-16" x2="-22" y2="-22"/>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">cd</text>
  </g>
  <!-- 7 Jumlah zat -->
  <g transform="translate(435,290)">
    <circle r="44" fill="#22c55e"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <path d="M-10 -18 L10 -18 L18 14 Q 0 24 -18 14 Z" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="-5" cy="2" r="4" fill="#22c55e"/>
    <circle cx="6" cy="8" r="3" fill="#22c55e"/>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">mol</text>
  </g>

  <circle cx="320" cy="120" r="0" fill="none"/>
</svg>
