<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="particleG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1b2340">
    <text x="26" y="122">Gaya Magnetik</text>
    <text x="26" y="158">(Gaya Lorentz)</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Arah Gaya lewat Kaidah Tangan Kanan</text>

  <!-- mini badge chips: F=qvB / Muatan / Melingkar -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="26" cy="26" r="6" fill="#7c3aed"/>
      <path d="M26 26 L40 14" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M40 14 l-10 1 2 -9 z" fill="#7c3aed"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">F=qvB</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#ffe4e6"/>
      <circle cx="26" cy="26" r="9" fill="#f43f5e"/>
      <text x="26" y="30" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">+</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">Muatan</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="4 4"/>
      <path d="M26 15 l4 3 -4 3 z" fill="#0891b2"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155e75">Melingkar</text>
    </g>
  </g>

  <!-- hero illustration: charged particle curving through a magnetic field region (into page) -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- field region -->
    <rect x="10" y="10" width="220" height="150" rx="16" fill="url(#fieldG)" opacity="0.6"/>
    <g fill="#4338ca" opacity="0.55" font-family="Arial, sans-serif" font-size="13" font-weight="700">
      <text x="34" y="34">&#215;</text><text x="74" y="34">&#215;</text><text x="114" y="34">&#215;</text><text x="154" y="34">&#215;</text><text x="194" y="34">&#215;</text>
      <text x="34" y="70">&#215;</text><text x="74" y="70">&#215;</text><text x="114" y="70">&#215;</text><text x="154" y="70">&#215;</text><text x="194" y="70">&#215;</text>
      <text x="34" y="106">&#215;</text><text x="74" y="106">&#215;</text><text x="114" y="106">&#215;</text><text x="154" y="106">&#215;</text><text x="194" y="106">&#215;</text>
      <text x="34" y="142">&#215;</text><text x="74" y="142">&#215;</text><text x="114" y="142">&#215;</text><text x="154" y="142">&#215;</text><text x="194" y="142">&#215;</text>
    </g>

    <!-- dashed circular path -->
    <circle cx="120" cy="85" r="55" fill="none" stroke="#a855f7" stroke-width="2.4" stroke-dasharray="5 6" opacity="0.8"/>

    <!-- charged particle with motion trail -->
    <circle cx="120" cy="30" r="12" fill="url(#particleG)"/>
    <text x="120" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">+</text>
    <path d="M90 50 Q70 85 90 120" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- velocity arrow (v) -->
    <path d="M134 22 L168 10" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M168 10 l-11 1 4 -9 z" fill="#16a34a"/>
    <text x="172" y="10" font-size="12" font-weight="800" fill="#15803d" font-family="Arial, sans-serif">v</text>

    <!-- force arrow (F) pointing to circle center -->
    <path d="M120 30 L120 65" stroke="#ec4899" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M120 65 l-6 -9 12 0 z" fill="#ec4899"/>
    <text x="126" y="58" font-size="12" font-weight="800" fill="#9d174d" font-family="Arial, sans-serif">F</text>

    <!-- small compass/magnet badge, bottom right -->
    <g transform="translate(248,150)">
      <circle r="24" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
      <rect x="-5" y="-16" width="10" height="20" rx="3" fill="#ef4444"/>
      <rect x="-5" y="4" width="10" height="20" rx="3" fill="#3b82f6"/>
      <text x="0" y="-19" text-anchor="middle" font-size="9" font-weight="800" fill="#ef4444" font-family="Arial, sans-serif">N</text>
      <text x="0" y="31" text-anchor="middle" font-size="9" font-weight="800" fill="#3b82f6" font-family="Arial, sans-serif">S</text>
    </g>

    <!-- sparkle accents -->
    <path d="M250 24 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.85"/>
    <circle cx="14" cy="178" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <circle cx="200" cy="184" r="3" fill="#f97316" opacity="0.75"/>
  </g>
</svg>
