<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi panel surya, turbin angin, dan tangan menanam pohon kecil di depan globe Bumi, menggambarkan upaya global dan nasional mencegah pemanasan global secara optimis">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globeG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="panelG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="turbineG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Upaya Mencegahnya</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Aksi Global dan Nasional untuk Bumi</text>

  <!-- badge chips: Kerja Sama / Energi Bersih / Aksi Nyata -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M12 28 Q 16 14 24 18 Q 26 20 26 24 L 20 34 Q 14 34 12 28 Z" fill="#fcd9a8"/>
      <path d="M40 28 Q 36 14 28 18 Q 26 20 26 24 L 32 34 Q 38 34 40 28 Z" fill="#f4b680"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9d174d">Kerja Sama</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <circle cx="20" cy="22" r="8" fill="none" stroke="#059669" stroke-width="2.4"/>
      <path d="M20 14 L20 8 M14 22 L8 22" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M32 30 L24 30 L28 36 Z" fill="#16a34a"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Energi Bersih</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <rect x="22" y="22" width="8" height="16" rx="2" fill="#92400e"/>
      <path d="M26 22 Q 16 16 14 4" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="4" r="6" fill="#4ade80"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Aksi Nyata</text>
    </g>
  </g>

  <!-- hero illustration: panel surya + turbin + tangan menanam pohon + globe -->
  <g transform="translate(330,92)">
    <ellipse cx="150" cy="226" rx="175" ry="18" fill="#1b2340" opacity="0.08"/>

    <!-- globe kecil motif kerja sama global -->
    <g transform="translate(200,36)">
      <circle r="34" fill="url(#globeG2)"/>
      <path d="M-22 -8 Q -10 -20 4 -14 Q 11 -8 6 1 Q -4 4 -12 1 Q -22 -2 -22 -8 Z" fill="#22c55e"/>
      <g stroke="#ffffff" stroke-width="1" opacity="0.4" fill="none">
        <ellipse rx="34" ry="13"/>
        <ellipse rx="13" ry="34"/>
      </g>
    </g>

    <!-- tanah -->
    <path d="M-30 196 Q 70 174 150 196 T 300 182 L 300 230 L -30 230 Z" fill="#15803d"/>
    <path d="M-30 212 Q 80 198 160 212 T 300 202 L 300 230 L -30 230 Z" fill="#22c55e"/>

    <!-- turbin angin kiri -->
    <g transform="translate(20,160)">
      <rect x="-3" y="0" width="6" height="66" fill="url(#turbineG2)"/>
      <circle cx="0" cy="0" r="5" fill="#94a3b8"/>
      <g fill="#ffffff">
        <path d="M0 0 L -6 -48 L 7 -42 Z"/>
        <path d="M0 0 L 34 16 L 26 28 Z" transform="rotate(10)"/>
        <path d="M0 0 L -28 30 L -38 20 Z" transform="rotate(10)"/>
      </g>
    </g>

    <!-- panel surya kanan -->
    <g transform="translate(252,198) rotate(-16)">
      <rect x="-14" y="0" width="9" height="26" fill="#78350f"/>
      <rect x="28" y="0" width="9" height="26" fill="#78350f"/>
      <rect x="-40" y="-26" width="96" height="30" rx="4" fill="url(#panelG2)"/>
      <g stroke="#bfdbfe" stroke-width="1.6">
        <line x1="-20" y1="-26" x2="-20" y2="4"/>
        <line x1="0" y1="-26" x2="0" y2="4"/>
        <line x1="20" y1="-26" x2="20" y2="4"/>
      </g>
    </g>

    <!-- tangan menanam pohon di tengah -->
    <g transform="translate(130,208)">
      <ellipse cx="0" cy="14" rx="36" ry="11" fill="#92400e"/>
      <rect x="-3" y="-22" width="6" height="28" fill="#15803d"/>
      <path d="M0 -22 Q -17 -27 -20 -42" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0 -19 Q 17 -24 22 -39" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="-20" cy="-42" r="7" fill="#4ade80"/>
      <circle cx="22" cy="-39" r="7" fill="#22c55e"/>
      <path d="M-38 8 Q -30 -8 -10 -4 Q 0 -1 0 8 L -8 18 Q -26 20 -38 8 Z" fill="#fcd9a8"/>
      <path d="M38 8 Q 30 -8 10 -4 Q 0 -1 0 8 L 8 18 Q 26 20 38 8 Z" fill="#f4b680"/>
    </g>

    <!-- dotted link, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <path d="M60 100 Q 120 70 170 56" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M280 110 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="10" cy="80" r="3.5" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
