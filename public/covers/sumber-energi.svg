<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg4)"/>
  <circle cx="80" cy="60" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="600" cy="300" r="90" fill="#ffffff" opacity="0.06"/>

  <!-- sun -->
  <g transform="translate(540,70)">
    <g stroke="#fde047" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-30"/>
      <line x1="-30" y1="-28" x2="-22" y2="-20"/>
      <line x1="30" y1="-28" x2="22" y2="-20"/>
      <line x1="-40" y1="0" x2="-30" y2="0"/>
    </g>
    <circle r="26" fill="#fde047"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 260 Q100 220 220 250 Q340 280 440 240 Q560 210 640 250 L640 360 L0 360 Z" fill="#16a34a"/>
  <path d="M0 280 Q120 250 260 275 Q400 300 520 265 Q600 250 640 270 L640 360 L0 360 Z" fill="#15803d"/>

  <!-- wind turbine -->
  <g transform="translate(150,190)">
    <rect x="-5" y="0" width="10" height="100" fill="#f3f4f6"/>
    <circle r="8" fill="#e5e7eb"/>
    <ellipse cx="0" cy="-34" rx="7" ry="34" fill="#f9fafb" transform="rotate(0)"/>
    <ellipse cx="0" cy="-34" rx="7" ry="34" fill="#f3f4f6" transform="rotate(120)"/>
    <ellipse cx="0" cy="-34" rx="7" ry="34" fill="#e5e7eb" transform="rotate(240)"/>
  </g>

  <!-- waterfall rock -->
  <g transform="translate(330,150)">
    <polygon points="-50,140 -20,20 40,0 70,140" fill="#9ca3af"/>
    <polygon points="-50,140 -20,20 -5,40 -30,140" fill="#6b7280"/>
    <path d="M10 10 Q5 60 14 120 Q18 60 22 110 Q26 60 30 130" stroke="#60a5fa" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="18" cy="148" rx="46" ry="14" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- coal / mountain element -->
  <g transform="translate(500,150)">
    <polygon points="-60,150 0,30 60,150" fill="#a8a29e"/>
    <polygon points="-20,150 0,30 20,150" fill="#78716c" opacity="0.5"/>
    <circle cx="-70" cy="158" r="14" fill="#1f2937"/>
    <circle cx="-48" cy="166" r="12" fill="#111827"/>
    <circle cx="-62" cy="172" r="10" fill="#1f2937"/>
  </g>
</svg>
