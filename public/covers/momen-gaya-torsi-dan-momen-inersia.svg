<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wrenchG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="boltG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint4)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG4)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG4)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="128">Momen Gaya (Torsi)</text>
    <text x="26" y="162">dan Momen Inersia</text>
  </g>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Lengan Gaya dan Kemudahan Memutar</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="14" y1="30" x2="34" y2="30" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
      <path d="M26 16 L34 30 L18 30 Z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Gaya</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <line x1="10" y1="32" x2="42" y2="32" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="32" r="2.6" fill="#059669"/>
      <circle cx="42" cy="32" r="2.6" fill="#059669"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Lengan</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M26 16 A10 10 0 1 1 16 26" stroke="#c2410c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M16 26 L12 20 L20 22 Z" fill="#c2410c"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Torsi</text>
    </g>
  </g>

  <!-- hero illustration: wrench on a bolt with force at a distance + torque arc -->
  <g transform="translate(362,118)">
    <ellipse cx="130" cy="186" rx="130" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- pivot bolt -->
    <circle cx="40" cy="150" r="24" fill="url(#boltG)"/>
    <circle cx="40" cy="150" r="24" fill="none" stroke="#475569" stroke-width="2"/>
    <g fill="#475569">
      <rect x="37" y="128" width="6" height="10"/>
      <rect x="37" y="162" width="6" height="10"/>
      <rect x="18" y="147" width="10" height="6"/>
      <rect x="52" y="147" width="10" height="6"/>
    </g>

    <!-- wrench handle at an angle, long lever arm -->
    <g transform="rotate(-24 40 150)">
      <rect x="40" y="140" width="180" height="20" rx="10" fill="url(#wrenchG)"/>
      <path d="M28 150 a16 20 0 0 0 20 20 l0 -40 a16 20 0 0 0 -20 20 z" fill="url(#wrenchG)"/>
    </g>

    <!-- lever arm distance marker -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.6">
      <line x1="40" y1="150" x2="200" y2="97"/>
    </g>
    <text x="118" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7e22ce">r</text>

    <!-- force arrow applied at the end of the handle -->
    <g transform="translate(196,90)">
      <line x1="0" y1="0" x2="34" y2="-34" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M40 -40 L22 -36 L36 -22 Z" fill="#2563eb"/>
      <text x="38" y="-44" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#2563eb">F</text>
    </g>

    <!-- torque arc indicator around pivot -->
    <path d="M40 126 A24 24 0 0 1 62 142" stroke="#ea580c" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="M62 142 L52 134 L58 148 Z" fill="#ea580c"/>
    <text x="48" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ea580c">&#964;</text>

    <!-- sparkle accents -->
    <path d="M214 160 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="20" cy="196" r="4" fill="#ec4899" opacity="0.7"/>
    <circle cx="236" cy="128" r="3" fill="#14b8a6" opacity="0.65"/>
  </g>
</svg>
