<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rampG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="boxG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="pulleyG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG2)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="118">Gaya Gesek,</text>
    <text x="26" y="152">Bidang Miring,</text>
    <text x="26" y="186">dan Sistem Katrol</text>
  </g>
  <text x="26" y="214" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Gesekan, Kemiringan, dan Katrol</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,244)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M12 32 L40 32" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 32 Q22 22 28 32" stroke="#c2410c" stroke-width="2.4" fill="none"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Gesek</text>
    </g>
    <g transform="translate(104,244)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M12 36 L40 36 L40 30 L12 36 Z" fill="#059669"/>
      <path d="M12 36 L34 16" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">Bidang Miring</text>
    </g>
    <g transform="translate(182,244)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <circle cx="26" cy="20" r="8" fill="none" stroke="#ca8a04" stroke-width="2.6"/>
      <line x1="26" y1="28" x2="26" y2="40" stroke="#ca8a04" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="26" y1="40" x2="34" y2="40" stroke="#ca8a04" stroke-width="2.6" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Katrol</text>
    </g>
  </g>

  <!-- hero illustration: box on inclined ramp with force arrows + pulley detail -->
  <g transform="translate(362,110)">
    <ellipse cx="130" cy="214" rx="130" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- incline ramp -->
    <path d="M10 210 L10 150 L230 80 L230 210 Z" fill="url(#rampG)"/>
    <path d="M10 150 L230 80" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- box on ramp -->
    <g transform="translate(118,98) rotate(-18)">
      <rect x="0" y="-30" width="54" height="40" rx="7" fill="url(#boxG)"/>
      <line x1="0" y1="-10" x2="54" y2="-10" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

      <!-- N arrow (green, perpendicular) -->
      <line x1="27" y1="-30" x2="27" y2="-66" stroke="#059669" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M27 -74 L20 -62 L34 -62 Z" fill="#059669"/>

      <!-- friction arrow (teal, up the slope) -->
      <line x1="2" y1="-10" x2="-20" y2="-10" stroke="#0d9488" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M-28 -10 L-16 -16 L-16 -4 Z" fill="#0d9488"/>
    </g>

    <!-- w arrow (orange, straight down) -->
    <line x1="146" y1="68" x2="146" y2="112" stroke="#f97316" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M146 120 L139 106 L153 106 Z" fill="#f97316"/>

    <!-- small pulley + rope detail, upper right -->
    <g transform="translate(206,36)">
      <circle cx="0" cy="0" r="18" fill="url(#pulleyG2)"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <path d="M-18 0 Q-30 30 -14 54" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M18 0 Q30 20 22 46" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="-20" y="46" width="12" height="16" rx="2" fill="#a855f7"/>
    </g>

    <!-- sparkle accents -->
    <path d="M14 56 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.55">
      <line x1="50" y1="206" x2="110" y2="206"/>
    </g>
    <circle cx="246" cy="130" r="4" fill="#14b8a6" opacity="0.7"/>
  </g>
</svg>
