<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wheelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hubG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint3)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG3)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG3)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="118">Dinamika Rotasi</text>
    <text x="26" y="152">dan Energi Kinetik</text>
    <text x="26" y="186">Rotasi</text>
  </g>
  <text x="26" y="214" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Versi Rotasi dari Hukum II Newton</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,244)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M26 16 A10 10 0 1 1 16 26" stroke="#c2410c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M16 26 L12 20 L20 22 Z" fill="#c2410c"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Torsi</text>
    </g>
    <g transform="translate(104,244)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#059669" stroke-width="2.6"/>
      <circle cx="26" cy="26" r="3" fill="#059669"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Momen Inersia</text>
    </g>
    <g transform="translate(182,244)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M26 15 A11 11 0 1 1 15.5 29" stroke="#db2777" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M15.5 29 L11 25 L18 22 Z" fill="#db2777"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Rotasi</text>
    </g>
  </g>

  <!-- hero illustration: spinning colorful wheel with torque arrow and motion-blur arcs -->
  <g transform="translate(372,108)">
    <ellipse cx="120" cy="210" rx="130" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- motion blur arcs -->
    <path d="M30 70 A110 110 0 0 1 60 190" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M18 100 A140 140 0 0 1 40 215" stroke="#14b8a6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>

    <!-- spinning wheel -->
    <circle cx="120" cy="150" r="78" fill="url(#wheelG)"/>
    <circle cx="120" cy="150" r="78" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <g stroke="#fff7ed" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="120" y1="88" x2="120" y2="212"/>
      <line x1="58" y1="150" x2="182" y2="150"/>
      <line x1="76" y1="106" x2="164" y2="194"/>
      <line x1="76" y1="194" x2="164" y2="106"/>
    </g>
    <circle cx="120" cy="150" r="22" fill="url(#hubG)"/>
    <circle cx="120" cy="150" r="7" fill="#ffffff"/>

    <!-- torque arrow -->
    <path d="M190 100 A90 90 0 0 1 206 150" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M214 150 L202 138 L198 154 Z" fill="#2563eb"/>
    <text x="214" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#2563eb">&#964;</text>

    <!-- sparkle accents -->
    <path d="M30 56 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="214" cy="212" r="4" fill="#ec4899" opacity="0.75"/>
    <circle cx="36" cy="214" r="3" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
