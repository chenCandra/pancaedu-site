<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="u5bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="u5blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u5car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#u5bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#u5blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#u5blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="36" fill="#1b2340">
    <text x="26" y="124">Usaha dan Teorema</text>
    <text x="26" y="164">Usaha-Energi</text>
  </g>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Menghubungkan Gaya ke Energi Kinetik</text>

  <!-- mini badge chips: Usaha (W) / F.s / Energi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="16" y="20" width="20" height="14" rx="2" fill="#1d4ed8"/>
      <line x1="2" y1="27" x2="15" y2="27" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M15 27 l-8 -4 l0 8 z" fill="#1d4ed8" transform="rotate(180 11 27)"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Usaha (W)</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <line x1="10" y1="33" x2="42" y2="33" stroke="#d97706" stroke-width="2" stroke-dasharray="2 3"/>
      <line x1="10" y1="16" x2="30" y2="16" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30 16 l-8 -4 l0 8 z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">F&#183;s</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <path d="M29 12 L17 29 h8 l-3 15 14 -19 h-8 z" fill="#ca8a04"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Energi</text>
    </g>
  </g>

  <!-- hero illustration: car with braking-distance arrow + speed gauge cue -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="195" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- motion lines behind car -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="2" y1="150" x2="18" y2="150"/>
      <line x1="2" y1="162" x2="22" y2="162"/>
      <line x1="2" y1="174" x2="14" y2="174"/>
    </g>

    <!-- car -->
    <g transform="translate(66,148)">
      <rect x="-42" y="-6" width="84" height="24" rx="10" fill="url(#u5car)"/>
      <rect x="-22" y="-26" width="46" height="24" rx="11" fill="url(#u5car)"/>
      <rect x="-15" y="-20" width="26" height="13" rx="4" fill="#bfdbfe"/>
      <circle cx="40" cy="4" r="4" fill="#fde68a"/>
      <circle cx="-24" cy="20" r="11" fill="#1b2340"/>
      <circle cx="-24" cy="20" r="4" fill="#9ca3af"/>
      <circle cx="24" cy="20" r="11" fill="#1b2340"/>
      <circle cx="24" cy="20" r="4" fill="#9ca3af"/>
    </g>

    <!-- braking distance dashed arrow -->
    <path d="M130 168 L224 168" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="3 6" stroke-linecap="round" opacity="0.7"/>
    <path d="M224 168 l-10 -5 l0 10 z" fill="#a855f7" opacity="0.7"/>

    <!-- stop flag -->
    <g transform="translate(232,150)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#78350f" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M0 0 L20 5 L0 12 Z" fill="#ef4444"/>
    </g>

    <!-- speed gauge -->
    <g transform="translate(210,60)">
      <path d="M-20 4 A20 20 0 0 1 20 4" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="-12" y2="-6" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="3" fill="#1b2340"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="246" cy="110" r="3" fill="#14b8a6" opacity="0.75"/>
    <path d="M30 60 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#ec4899" opacity="0.75"/>
    <circle cx="150" cy="30" r="2.6" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
