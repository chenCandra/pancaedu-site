<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg7)"/>
  <circle cx="80" cy="60" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="580" cy="300" r="80" fill="#ffffff" opacity="0.06"/>

  <!-- ground -->
  <path d="M0 300 Q200 280 400 300 Q520 312 640 295 L640 360 L0 360 Z" fill="#15803d" opacity="0.9"/>

  <!-- power plant -->
  <g transform="translate(140,230)">
    <rect x="-70" y="-40" width="140" height="80" rx="6" fill="#9ca3af"/>
    <rect x="-20" y="-110" width="24" height="80" rx="4" fill="#d1d5db"/>
    <ellipse cx="-8" cy="-110" rx="12" ry="8" fill="#e5e7eb"/>
    <circle cx="-8" cy="-130" r="14" fill="#f3f4f6" opacity="0.7"/>
    <circle cx="2" cy="-150" r="16" fill="#f9fafb" opacity="0.55"/>
    <circle cx="-16" cy="-160" r="12" fill="#ffffff" opacity="0.4"/>
    <rect x="-55" y="-20" width="20" height="24" fill="#fde047"/>
    <rect x="20" y="-20" width="20" height="24" fill="#fde047"/>
    <rect x="-18" y="40" width="36" height="20" fill="#4b5563"/>
  </g>

  <!-- glowing cable -->
  <path d="M220 236 Q320 170 420 220" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>
  <path d="M220 236 Q320 170 420 220" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <g fill="#fff7ed" opacity="0.85">
    <circle cx="280" cy="195" r="3"/>
    <circle cx="340" cy="178" r="3"/>
    <circle cx="390" cy="200" r="3"/>
  </g>

  <!-- house -->
  <g transform="translate(480,250)">
    <rect x="-60" y="-10" width="120" height="80" fill="#fef3c7"/>
    <polygon points="-72,-10 0,-70 72,-10" fill="#dc2626"/>
    <rect x="-16" y="30" width="32" height="40" fill="#78350f"/>
    <rect x="-44" y="10" width="28" height="28" fill="#fde047" opacity="0.95"/>
    <rect x="18" y="10" width="28" height="28" fill="#93c5fd"/>
    <circle cx="-30" cy="24" r="30" fill="#fde047" opacity="0.25"/>
    <rect x="-2" y="-40" width="10" height="20" fill="#6b7280"/>
    <path d="M3 -42 q10 -6 4 -16" stroke="#9ca3af" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- lamp post -->
  <g transform="translate(590,270)">
    <rect x="-3" y="-60" width="6" height="60" fill="#4b5563"/>
    <circle cy="-68" r="12" fill="#fde047"/>
    <circle cy="-68" r="22" fill="#fde047" opacity="0.25"/>
  </g>
</svg>
