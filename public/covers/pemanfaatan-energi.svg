<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint7" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG7" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plantG7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint7)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG7)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG7)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="222" height="24" rx="12" fill="#fbbf24"/>
    <text x="139" y="84.5" text-anchor="middle" fill="#ffffff">PEMANFAATAN ENERGI</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">Pemanfaatan Energi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Dari Pembangkit Menuju Rumah</text>

  <!-- mini badge chips: Pembangkit / Jaringan / Rumah -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#e5e7eb"/>
      <rect x="14" y="20" width="24" height="16" rx="2" fill="#6b7280"/>
      <rect x="20" y="8" width="6" height="14" fill="#9ca3af"/>
      <circle cx="23" cy="6" r="3.5" fill="#d1d5db"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">Pembangkit</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <path d="M12 32 Q26 14 40 32" stroke="#ca8a04" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="12" cy="32" r="3" fill="#854d0e"/>
      <circle cx="40" cy="32" r="3" fill="#854d0e"/>
      <circle cx="26" cy="19" r="3" fill="#854d0e"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Jaringan</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <polygon points="26,10 10,24 42,24" fill="#dc2626"/>
      <rect x="14" y="24" width="24" height="16" fill="#fef3c7"/>
      <rect x="22" y="30" width="8" height="10" fill="#78350f"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Rumah</text>
    </g>
  </g>

  <!-- hero illustration: power plant -> glowing cable -> cozy house -->
  <g>
    <!-- ground -->
    <path d="M340 305 Q440 288 540 306 Q590 316 640 298 L640 360 L340 360 Z" fill="#15803d" opacity="0.85"/>

    <!-- power plant -->
    <g transform="translate(430,225)">
      <rect x="-70" y="-40" width="140" height="80" rx="6" fill="url(#plantG7)"/>
      <rect x="-20" y="-110" width="24" height="70" rx="4" fill="#d1d5db"/>
      <ellipse cx="-8" cy="-110" rx="12" ry="8" fill="#e5e7eb"/>
      <circle cx="-8" cy="-128" r="13" fill="#f3f4f6" opacity="0.7"/>
      <circle cx="2" cy="-146" r="15" fill="#f9fafb" opacity="0.55"/>
      <circle cx="-16" cy="-156" r="11" fill="#ffffff" opacity="0.4"/>
      <rect x="-55" y="-20" width="20" height="24" fill="#fde047"/>
      <rect x="20" y="-20" width="20" height="24" fill="#fde047"/>
      <rect x="-18" y="40" width="36" height="20" fill="#4b5563"/>
    </g>

    <!-- lamp post -->
    <g transform="translate(345,310)">
      <rect x="-3" y="-55" width="6" height="55" fill="#4b5563"/>
      <circle cy="-62" r="10" fill="#fde047"/>
      <circle cy="-62" r="18" fill="#fde047" opacity="0.25"/>
    </g>

    <!-- glowing cable -->
    <path d="M495 220 Q545 185 575 205" fill="none" stroke="#fde047" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 13"/>
    <path d="M495 220 Q545 185 575 205" fill="none" stroke="#fde047" stroke-width="1.8" fill-opacity="0" opacity="0.9"/>
    <circle cx="520" cy="197" r="2.6" fill="#fff7ed"/>
    <circle cx="555" cy="192" r="2.6" fill="#fff7ed"/>

    <!-- house -->
    <g transform="translate(585,255)">
      <rect x="-55" y="-10" width="110" height="70" fill="#fef3c7"/>
      <polygon points="-67,-10 0,-65 67,-10" fill="#dc2626"/>
      <rect x="-14" y="26" width="28" height="34" fill="#78350f"/>
      <rect x="-40" y="8" width="24" height="24" fill="#fde047" opacity="0.95"/>
      <rect x="16" y="8" width="24" height="24" fill="#93c5fd"/>
      <circle cx="-28" cy="20" r="26" fill="#fde047" opacity="0.22"/>
      <rect x="-2" y="-38" width="8" height="18" fill="#6b7280"/>
      <path d="M2 -40 q9 -5 4 -14" stroke="#9ca3af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M608 150 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#14b8a6" opacity="0.8"/>
    <circle cx="470" cy="180" r="3" fill="#a855f7" opacity="0.6"/>
    <circle cx="455" cy="165" r="2" fill="#a855f7" opacity="0.5"/>
  </g>
</svg>
