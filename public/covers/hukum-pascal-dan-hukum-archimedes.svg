<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="cylinderG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="liquidG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="eggG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="blobG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint4)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG4)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG4)"/>
  <rect width="640" height="360" fill="none" stroke="#a5f3fc" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a5f3fc" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#a5f3fc"/>
    <text x="493" y="32" text-anchor="middle" fill="#0e7490">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="110" height="24" rx="12" fill="#0e7490"/>
    <text x="83" y="84.5" text-anchor="middle" fill="#ffffff">FLUIDA</text>
  </g>

  <!-- title -->
  <text x="26" y="138" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Hukum Pascal dan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Hukum Archimedes</text>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#155e75">Dongkrak Hidrolik dan Gaya Apung</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#e0e7ff"/>
      <path d="M26 14 L26 24" stroke="#4338ca" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M19 24 L33 24" stroke="#4338ca" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 17 L26 24 L32 17" fill="none" stroke="#4338ca" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Pascal</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <path d="M18 30 q8 -6 16 0" stroke="#0e7490" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M26 24 L26 14 M26 14 L21 19 M26 14 L31 19" stroke="#0e7490" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#155e75">Archimedes</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M26 32 c-6 0 -9 -4 -9 -9 0 -5 9 -12 9 -12 s9 7 9 12 c0 5 -3 9 -9 9z" fill="#047857" opacity="0.25"/>
      <path d="M26 30 L26 16 M26 16 L21 21 M26 16 L31 21" stroke="#047857" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Gaya Apung</text>
    </g>
  </g>

  <!-- hero illustration: hydraulic car lift + floating egg detail -->
  <g transform="translate(372,112)">
    <ellipse cx="110" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- shared fluid reservoir connecting both pistons -->
    <rect x="-20" y="158" width="250" height="22" rx="8" fill="url(#liquidG)"/>
    <rect x="-20" y="158" width="250" height="5" fill="#bae6fd" opacity="0.9"/>

    <!-- small narrow piston (input, small force pushing down) -->
    <rect x="16" y="98" width="28" height="62" fill="url(#cylinderG)"/>
    <rect x="10" y="90" width="40" height="10" rx="3" fill="url(#capG)"/>
    <path d="M30 60 L30 84" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <path d="M23 76 L30 86 L37 76" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- small floating egg inset (Archimedes detail) -->
    <g transform="translate(236,150)">
      <circle cx="0" cy="0" r="20" fill="#ffffff"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M-14 6 Q0 1 14 6 L14 12 L-14 12 Z" fill="#38bdf8" opacity="0.85"/>
      <ellipse cx="0" cy="2" rx="8" ry="10" fill="url(#eggG)"/>
    </g>

    <!-- large wide piston (output, big force lifting the car) -->
    <rect x="128" y="54" width="82" height="106" fill="url(#cylinderG)"/>
    <rect x="120" y="44" width="98" height="12" rx="4" fill="url(#capG)"/>
    <path d="M169 38 L169 8" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M157 20 L169 6 L181 20" fill="none" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- tiny cartoon car sitting on the big piston -->
    <g transform="translate(130,-14)">
      <path d="M4 26 Q4 16 16 16 L26 6 L58 6 L68 16 L76 16 Q80 16 80 26 L80 30 L4 30 Z" fill="url(#carG)"/>
      <path d="M28 10 L34 18 L52 18 L56 10" fill="#fef2f2" opacity="0.85"/>
      <circle cx="22" cy="30" r="8" fill="#1b2340"/>
      <circle cx="62" cy="30" r="8" fill="#1b2340"/>
      <circle cx="22" cy="30" r="3" fill="#94a3b8"/>
      <circle cx="62" cy="30" r="3" fill="#94a3b8"/>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M232 20 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.85"/>
    <circle cx="4" cy="24" r="3.6" fill="#f472b6" opacity="0.75"/>
    <circle cx="96" cy="14" r="3" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.45">
      <line x1="56" y1="150" x2="118" y2="150"/>
    </g>
  </g>
</svg>
