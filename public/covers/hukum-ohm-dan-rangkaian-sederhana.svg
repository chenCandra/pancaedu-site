<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="battG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="bulbG" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1b2340">
    <text x="26" y="114">Hukum Ohm dan</text>
    <text x="26" y="148">Rangkaian</text>
    <text x="26" y="182">Sederhana</text>
  </g>
  <text x="26" y="208" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Hubungan Tegangan, Arus, dan Hambatan</text>

  <!-- mini badge chips: V=IR / Arus / Hambatan -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,236)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M20 14 l-6 14 7 0 -4 10 11 -16 -7 0 4 -8 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">V=IR</text>
    </g>
    <g transform="translate(104,236)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M14 26 L38 26" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M38 26 l-9 -5 0 10 z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Arus</text>
    </g>
    <g transform="translate(182,236)">
      <circle cx="26" cy="26" r="26" fill="#ffe4e6"/>
      <path d="M12 26 l5 -6 5 12 5 -12 5 12 5 -12 5 6" stroke="#e11d48" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#9f1239">Hambatan</text>
    </g>
  </g>

  <!-- hero illustration: battery - resistor - glowing bulb circuit loop -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- circuit loop wires -->
    <g stroke="#1b2340" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 140 L30 50 L230 50 L230 140"/>
    </g>

    <!-- battery -->
    <g transform="translate(5,118)">
      <rect x="0" y="0" width="50" height="26" rx="4" fill="url(#battG)"/>
      <rect x="-6" y="7" width="6" height="12" fill="#1d4ed8"/>
      <rect x="50" y="4" width="6" height="18" fill="#1d4ed8"/>
      <text x="25" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">+ &#8722;</text>
    </g>

    <!-- resistor (zigzag) -->
    <path d="M90 50 l8 -10 10 20 10 -20 10 20 10 -20 10 20 8 -10" stroke="#b45309" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>

    <!-- glowing bulb -->
    <g transform="translate(230,118)">
      <circle r="30" fill="url(#bulbG)" opacity="0.35"/>
      <circle r="20" fill="url(#bulbG)"/>
      <path d="M-7 10 q7 10 14 0" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-6 6 l4 6 M6 6 l-4 6" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
      <rect x="-6" y="20" width="12" height="8" rx="2" fill="#78350f"/>
    </g>

    <!-- current flow arrows -->
    <g stroke="#14b8a6" stroke-width="2" stroke-dasharray="3 5" fill="none" opacity="0.7">
      <path d="M30 100 L30 70"/>
      <path d="M150 50 L170 50"/>
    </g>
    <path d="M30 70 l-5 9 10 0 z" fill="#14b8a6" opacity="0.7"/>

    <!-- sparkle accents -->
    <path d="M250 70 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="200" cy="170" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="10" cy="30" r="3" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
