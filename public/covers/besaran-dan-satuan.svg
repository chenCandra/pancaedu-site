<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bs-bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bs-shirtBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bs-shirtTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bs-rulerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bs-tableG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bs-blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bs-bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#bs-blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#bs-blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="200" height="24" rx="12" fill="#fbbf24"/>
    <text x="128" y="84.5" text-anchor="middle" fill="#ffffff">BESARAN &amp; SATUAN</text>
  </g>

  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Besaran dan Satuan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Kenapa Hasil Ukur Bisa Beda-Beda?</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="10" y="20" width="32" height="12" rx="3" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Besaran</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <text x="26" y="33" text-anchor="middle" font-size="16" font-weight="800" fill="#be185d">cm</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Satuan</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M16 30 L24 20 L30 25 L38 14" stroke="#047857" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Baku</text>
    </g>
  </g>

  <g transform="translate(366,150)">
    <ellipse cx="128" cy="150" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- meja -->
    <rect x="18" y="86" width="220" height="20" rx="7" fill="url(#bs-tableG)"/>
    <rect x="34" y="106" width="12" height="32" fill="#78350f"/>
    <rect x="212" y="106" width="12" height="32" fill="#78350f"/>

    <!-- karakter kiri: jengkal tangan, biru -->
    <g transform="translate(26,30)">
      <circle cx="0" cy="0" r="18" fill="#fde68a"/>
      <circle cx="-6" cy="-3" r="2.6" fill="#1b2340"/>
      <circle cx="6" cy="-3" r="2.6" fill="#1b2340"/>
      <path d="M-7 6 Q 0 11 7 6" stroke="#1b2340" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-20 16 Q 0 2 20 16 L18 50 L-18 50 Z" fill="url(#bs-shirtBlue)"/>
    </g>
    <path d="M10 58 Q 55 36 100 58" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="55" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">5 jengkal</text>

    <!-- karakter kanan: penggaris, teal -->
    <g transform="translate(236,30)">
      <circle cx="0" cy="0" r="18" fill="#fde68a"/>
      <circle cx="-6" cy="-3" r="2.6" fill="#1b2340"/>
      <circle cx="6" cy="-3" r="2.6" fill="#1b2340"/>
      <path d="M-7 7 Q 0 4 7 7" stroke="#1b2340" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-20 16 Q 0 2 20 16 L18 50 L-18 50 Z" fill="url(#bs-shirtTeal)"/>
    </g>
    <rect x="140" y="40" width="94" height="16" rx="5" fill="url(#bs-rulerG)"/>
    <g stroke="#ffffff" stroke-width="1.8" opacity="0.9">
      <line x1="156" y1="40" x2="156" y2="50"/>
      <line x1="172" y1="40" x2="172" y2="52"/>
      <line x1="188" y1="40" x2="188" y2="50"/>
      <line x1="204" y1="40" x2="204" y2="52"/>
      <line x1="220" y1="40" x2="220" y2="50"/>
    </g>
    <text x="186" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">80 cm</text>

    <!-- speech bubble tanda tanya -->
    <g transform="translate(128,-6)">
      <path d="M-24 -18 Q -24 -30 -12 -30 L 12 -30 Q 24 -30 24 -18 L 24 -4 Q 24 8 12 8 L -2 8 L -10 18 L -8 8 L -12 8 Q -24 8 -24 -4 Z" fill="#ec4899"/>
      <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">?</text>
    </g>

    <!-- sparkle accents -->
    <path d="M6 100 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="244" cy="100" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="-4" cy="40" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <g stroke="#f97316" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.55">
      <line x1="60" y1="100" x2="200" y2="100"/>
    </g>
  </g>
</svg>
