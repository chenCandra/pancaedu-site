<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi dua karakter kartun membandingkan panjang meja dengan jengkal tangan dan penggaris, hasilnya beda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="60" cy="70" r="85" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="580" cy="60" r="70" fill="#ffffff" fill-opacity="0.07"/>

  <g fill="#fde68a">
    <path transform="translate(320,50) scale(1)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <circle cx="200" cy="50" r="5" fill="#ec4899"/>
  <circle cx="440" cy="60" r="5" fill="#ffffff"/>

  <!-- meja yang diukur -->
  <rect x="140" y="250" width="360" height="22" rx="8" fill="#92400e"/>
  <rect x="160" y="272" width="16" height="40" fill="#78350f"/>
  <rect x="464" y="272" width="16" height="40" fill="#78350f"/>
  <ellipse cx="320" cy="316" rx="200" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- jengkal tangan di atas meja (kiri) -->
  <g stroke="#ec4899" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M150 232 Q 230 200 310 232"/>
  </g>
  <text x="230" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">5 jengkal</text>

  <!-- penggaris di atas meja (kanan) -->
  <rect x="330" y="222" width="160" height="22" rx="6" fill="#3b82f6"/>
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="2">
    <line x1="350" y1="222" x2="350" y2="234"/>
    <line x1="380" y1="222" x2="380" y2="238"/>
    <line x1="410" y1="222" x2="410" y2="234"/>
    <line x1="440" y1="222" x2="440" y2="238"/>
    <line x1="470" y1="222" x2="470" y2="234"/>
  </g>
  <text x="410" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">80 cm</text>

  <!-- karakter kiri (baju biru) -->
  <g transform="translate(150,170)">
    <circle cx="0" cy="-34" r="30" fill="#fde68a"/>
    <circle cx="-10" cy="-38" r="4" fill="#1e293b"/>
    <circle cx="10" cy="-38" r="4" fill="#1e293b"/>
    <path d="M-10 -24 Q 0 -18 10 -24" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-30 10 Q 0 -14 30 10 L 30 60 L -30 60 Z" fill="#3b82f6"/>
    <circle cx="0" cy="-64" r="10" fill="#78350f"/>
  </g>

  <!-- karakter kanan (baju teal), menunjuk bingung -->
  <g transform="translate(560,170)">
    <circle cx="0" cy="-34" r="30" fill="#fde68a"/>
    <circle cx="-10" cy="-38" r="4" fill="#1e293b"/>
    <circle cx="10" cy="-38" r="4" fill="#1e293b"/>
    <path d="M-8 -22 Q 0 -28 8 -22" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-30 10 Q 0 -14 30 10 L 30 60 L -30 60 Z" fill="#14b8a6"/>
    <circle cx="0" cy="-64" r="10" fill="#78350f"/>
    <line x1="-28" y1="20" x2="-70" y2="-10" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- tanda seru kebingungan antara dua angka -->
  <circle cx="320" cy="140" r="22" fill="#ec4899"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">?</text>
</svg>
