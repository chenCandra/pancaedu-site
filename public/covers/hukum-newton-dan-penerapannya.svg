<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="pulleyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="torsoG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG1)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title -->
  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="118">Hukum Newton:</text>
    <text x="26" y="152">Analisis Gaya dan</text>
    <text x="26" y="186">Penerapan Dasar</text>
  </g>
  <text x="26" y="214" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Diagram Bebas Gaya dan &#931;F = m&#183;a</text>

  <!-- badge chips: Hukum I / Hukum II / Hukum III -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,244)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">I</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Hukum I</text>
    </g>
    <g transform="translate(104,244)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M14 30 L26 16 L38 30" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Hukum II</text>
    </g>
    <g transform="translate(182,244)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M14 22 L34 22 M30 17 L34 22 L30 27" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 32 L18 32 M22 27 L18 32 L22 37" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">Hukum III</text>
    </g>
  </g>

  <!-- hero illustration: elevator cross-section with character and N / w arrows -->
  <g transform="translate(372,98)">
    <ellipse cx="130" cy="232" rx="118" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- cable and pulley -->
    <rect x="108" y="-28" width="8" height="42" fill="#94a3b8"/>
    <circle cx="112" cy="-34" r="16" fill="url(#pulleyG)"/>
    <circle cx="112" cy="-34" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

    <!-- elevator cabin -->
    <rect x="46" y="14" width="132" height="196" rx="16" fill="url(#cabinG)"/>
    <rect x="60" y="26" width="104" height="30" rx="6" fill="#e0f2fe" opacity="0.7"/>
    <line x1="112" y1="60" x2="112" y2="210" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- floor indicator panel -->
    <rect x="150" y="66" width="20" height="40" rx="4" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="160" cy="74" r="3" fill="#a855f7"/>
    <circle cx="160" cy="86" r="3" fill="#fbbf24"/>
    <circle cx="160" cy="98" r="3" fill="#14b8a6"/>

    <!-- character -->
    <circle cx="90" cy="150" r="14" fill="#fde68a"/>
    <circle cx="85" cy="148" r="1.6" fill="#1b2340"/>
    <circle cx="95" cy="148" r="1.6" fill="#1b2340"/>
    <path d="M85 156 Q90 160 95 156" stroke="#1b2340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="78" y="164" width="24" height="36" rx="9" fill="url(#torsoG)"/>
    <rect x="80" y="198" width="8" height="18" rx="3" fill="#334155"/>
    <rect x="92" y="198" width="8" height="18" rx="3" fill="#334155"/>

    <!-- N arrow (up, green) -->
    <line x1="140" y1="214" x2="140" y2="150" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 140 L132 154 L148 154 Z" fill="#059669"/>
    <text x="150" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#059669">N</text>

    <!-- w arrow (down, orange) -->
    <line x1="56" y1="150" x2="56" y2="214" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 224 L48 210 L64 210 Z" fill="#f97316"/>
    <text x="36" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#f97316">w</text>

    <!-- sparkle accents, varied colors -->
    <path d="M206 18 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <g stroke="#14b8a6" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.6">
      <line x1="14" y1="222" x2="62" y2="212"/>
    </g>
    <circle cx="214" cy="206" r="4" fill="#a855f7" opacity="0.75"/>
    <circle cx="226" cy="196" r="3" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
