<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="springG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="springG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="massG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG5)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="128">Hukum Hooke dan</text>
    <text x="26" y="162">Modulus Elastisitas</text>
  </g>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">F = k&#916;x dan Energi Potensial</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="31" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">F=k&#916;x</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">F = k&#916;x</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M14 26 Q20 16 26 26 Q32 36 38 26" stroke="#db2777" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Elastis</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M14 26 l5 -7 5 7 5 -7 5 7" stroke="#059669" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Pegas</text>
    </g>
  </g>

  <!-- hero illustration: spring before/after with length markers and force arrow -->
  <g transform="translate(360,118)">
    <ellipse cx="130" cy="196" rx="130" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- BEFORE: short spring, top -->
    <rect x="0" y="40" width="14" height="36" rx="3" fill="#64748b"/>
    <path d="M14 42 l12 -8 12 16 12 -16 12 16 12 -16 12 16 L94 42" stroke="url(#springG1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#059669" stroke-width="1.6" stroke-dasharray="2 4" opacity="0.7">
      <line x1="0" y1="90" x2="0" y2="110"/>
      <line x1="94" y1="90" x2="94" y2="110"/>
      <line x1="0" y1="104" x2="94" y2="104"/>
    </g>
    <text x="42" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">sebelum (x&#8320;)</text>

    <!-- AFTER: stretched spring, bottom, with force arrow -->
    <rect x="0" y="150" width="14" height="36" rx="3" fill="#64748b"/>
    <path d="M14 152 l16 -8 16 16 16 -16 16 16 16 -16 16 16 L166 152" stroke="url(#springG2)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="166" y="150" width="40" height="36" rx="6" fill="url(#massG)"/>
    <g stroke="#ea580c" stroke-width="1.6" stroke-dasharray="2 4" opacity="0.7">
      <line x1="0" y1="198" x2="0" y2="214"/>
      <line x1="166" y1="198" x2="166" y2="214"/>
      <line x1="0" y1="208" x2="166" y2="208"/>
    </g>
    <text x="54" y="142" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">sesudah (x)</text>

    <!-- force arrow pulling the mass -->
    <line x1="210" y1="168" x2="244" y2="168" stroke="#2563eb" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M250 168 L236 160 L236 176 Z" fill="#2563eb"/>
    <text x="232" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#2563eb">F</text>

    <!-- sparkle accents -->
    <path d="M230 50 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="214" cy="100" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="20" cy="222" r="3" fill="#14b8a6" opacity="0.65"/>
  </g>
</svg>
