<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clockG2a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="clockG2b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="rocketG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG2)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Dilatasi Waktu</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#4338ca">Waktu Melambat Saat Bergerak Mendekati Cahaya</text>

  <!-- mini badge chips: Waktu Relatif / gamma / v mendekati c -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="27" r="11" fill="none" stroke="#2563eb" stroke-width="2.4"/>
      <path d="M26 27 L26 19 M26 27 L32 29" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <rect x="23" y="13" width="6" height="4" rx="1" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Waktu Relatif</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fae8ff"/>
      <text x="26" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#a21caf" font-style="italic">&#947;</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#86198f">&#947; (gamma)</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">v &#8776; c</text>
      <path d="M14 36 L38 36" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
      <path d="M33 32 L38 36 L33 40" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">v mendekati c</text>
    </g>
  </g>

  <!-- hero illustration: two clocks (normal vs slowed) + small rocket -->
  <g transform="translate(372,112)">
    <ellipse cx="118" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- normal clock, left -->
    <g transform="translate(55,90)">
      <circle cx="0" cy="0" r="46" fill="url(#clockG2a)"/>
      <circle cx="0" cy="0" r="37" fill="#ffffff"/>
      <g stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-25"/>
        <line x1="0" y1="30" x2="0" y2="25"/>
        <line x1="-30" y1="0" x2="-25" y2="0"/>
        <line x1="30" y1="0" x2="25" y2="0"/>
        <line x1="21" y1="-21" x2="18" y2="-18"/>
        <line x1="-21" y1="-21" x2="-18" y2="-18"/>
        <line x1="21" y1="21" x2="18" y2="18"/>
        <line x1="-21" y1="21" x2="-18" y2="18"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="15" y2="8" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#1e3a8a"/>
      <text x="0" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Diam</text>
    </g>

    <!-- slowed clock, right, fewer highlighted ticks -->
    <g transform="translate(168,120)">
      <circle cx="0" cy="0" r="40" fill="url(#clockG2b)"/>
      <circle cx="0" cy="0" r="31" fill="#ffffff"/>
      <g stroke="#f3e8ff" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
        <line x1="0" y1="-25" x2="0" y2="-21"/>
        <line x1="0" y1="25" x2="0" y2="21"/>
        <line x1="-25" y1="0" x2="-21" y2="0"/>
      </g>
      <g stroke="#a21caf" stroke-width="2.6" stroke-linecap="round">
        <line x1="18" y1="-18" x2="15" y2="-15"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="-13" stroke="#a21caf" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="6" y2="4" stroke="#a21caf" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#a21caf"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#86198f">Bergerak</text>
    </g>

    <!-- small rocket silhouette nearby -->
    <g transform="translate(205,60) rotate(35)">
      <path d="M0 -20 Q8 -8 8 8 L-8 8 Q-8 -8 0 -20 Z" fill="url(#rocketG2)"/>
      <circle cx="0" cy="-2" r="3" fill="#e2e8f0"/>
      <path d="M-5 8 Q0 18 5 8" fill="#fb923c"/>
    </g>

    <!-- dashed motion line -->
    <path d="M60 170 Q120 190 190 165" stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- sparkle accents -->
    <path d="M230 40 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="30" cy="30" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <circle cx="240" cy="140" r="4" fill="#f97316" opacity="0.75"/>
  </g>
</svg>
