<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fefb"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="squareG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="convG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#a7f3d0" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#10b981" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a7f3d0" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#d1fae5"/>
    <text x="493" y="32" text-anchor="middle" fill="#065f46">Fisika</text>
    <rect x="526" y="16" width="86" height="24" rx="12" fill="#e0e7ff"/>
    <text x="569" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="240" height="24" rx="12" fill="#10b981"/>
    <text x="148" y="84.5" text-anchor="middle" fill="#ffffff">ELEKTRONIKA DIGITAL</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">
    <text x="26" y="128">Sinyal Analog</text>
    <text x="26" y="170">dan Digital</text>
  </g>
  <text x="26" y="196" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#065f46">Dua Cara Dunia Mengirim Informasi</text>

  <!-- mini badge chips: Analog / Digital / Konversi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,218)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 28 Q17 14 22 28 T32 28 T40 28" stroke="#2563eb" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Analog</text>
    </g>
    <g transform="translate(104,218)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M12 32 H18 V20 H28 V32 H34 V20" stroke="#059669" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Digital</text>
    </g>
    <g transform="translate(182,218)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M17 18 A10 10 0 1 1 15 33" stroke="#7c3aed" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M13 15 L17 18 L12 22 Z" fill="#7c3aed"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Konversi</text>
    </g>
  </g>

  <!-- hero illustration: analog sine wave vs digital square wave, with conversion icon -->
  <g transform="translate(372,118)">
    <ellipse cx="115" cy="195" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- analog row -->
    <g transform="translate(0,34)">
      <line x1="0" y1="0" x2="232" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.6"/>
      <path d="M0 0 C 20 -26, 40 -26, 58 0 C 76 26, 96 26, 116 0 C 134 -26, 154 -26, 174 0 C 192 26, 212 26, 232 0"
            stroke="url(#sineG)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="-18" r="4" fill="#14b8a6" opacity="0.85"/>
      <circle cx="145" cy="-18" r="4" fill="#14b8a6" opacity="0.85"/>
      <text x="0" y="-36" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ANALOG</text>
    </g>

    <!-- conversion icon, centered between the two waves -->
    <g transform="translate(108,88)">
      <circle cx="0" cy="0" r="20" fill="url(#convG)"/>
      <path d="M-8 -7 A10 10 0 1 1 -9 9" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M-12 -10 L-8 -7 L-13 -3 Z" fill="#ffffff"/>
    </g>

    <!-- digital row -->
    <g transform="translate(0,150)">
      <line x1="0" y1="0" x2="232" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.6"/>
      <path d="M0 0 H30 V-30 H68 V0 H98 V-30 H136 V0 H166 V-30 H204 V0 H232"
            stroke="url(#squareG)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="-30" r="3.5" fill="#fbbf24"/>
      <circle cx="98" cy="-30" r="3.5" fill="#fbbf24"/>
      <circle cx="166" cy="-30" r="3.5" fill="#fbbf24"/>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#065f46">DIGITAL</text>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M236 -2 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <path d="M-10 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f97316" opacity="0.85"/>
    <circle cx="214" cy="200" r="3.5" fill="#a855f7" opacity="0.6"/>
    <circle cx="8" cy="-28" r="3" fill="#2563eb" opacity="0.5"/>
  </g>
</svg>
