  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="235" height="24" rx="12" fill="#fbbf24"/>
    <text x="145" y="84.5" text-anchor="middle" fill="#ffffff">KESELAMATAN KERJA</text>
  </g>

  <text x="26" y="134" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Keselamatan Kerja</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">di Laboratorium</text>
  <text x="26" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Aman Bereksperimen, Nyaman Belajar</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,210)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="12" y="20" width="28" height="13" rx="6" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Goggles</text>
    </g>
    <g transform="translate(104,210)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M19 32 L19 18 Q19 14 23 14 Q27 14 27 18 L27 22 L29 22 L29 20 Q29 17 32 17 Q35 17 35 20 L35 32 Z" fill="#be185d"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9d174d">Sarung Tangan</text>
    </g>
    <g transform="translate(182,210)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M26 14 Q36 18 36 28 L36 36 Q26 40 16 36 L16 28 Q16 18 26 14 Z" fill="none" stroke="#047857" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Jas Lab</text>
    </g>
  </g>

  <g transform="translate(366,108)">
    <ellipse cx="128" cy="204" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- beaker kiri, teal -->
    <g transform="translate(26,150)">
      <path d="M-16 -36 L-16 10 Q-16 26 0 26 Q16 26 16 10 L16 -36 Z" fill="#ffffff" stroke="url(#ks-beaker1)" stroke-width="4"/>
      <path d="M-14 0 Q0 8 14 0 L14 10 Q14 22 0 22 Q-14 22 -14 10 Z" fill="url(#ks-beaker1)"/>
      <line x1="-20" y1="-36" x2="20" y2="-36" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-4" cy="-10" r="2.2" fill="#0d9488"/>
      <circle cx="6" cy="-18" r="1.8" fill="#0d9488"/>
    </g>

    <!-- warning triangle kanan, purple-ish accent but amber/red for warning -->
    <g transform="translate(230,46)">
      <path d="M0 -30 L26 22 L-26 22 Z" fill="#fbbf24" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-3" y="-14" width="6" height="18" rx="2" fill="#78350f"/>
      <circle cx="0" cy="12" r="3" fill="#78350f"/>
    </g>

    <!-- karakter utama, jas lab putih dengan gloves pink + goggles biru -->
    <g transform="translate(130,130)">
      <path d="M-62 16 Q 0 -24 62 16 L 54 110 L -54 110 Z" fill="#ffffff"/>
      <path d="M0 -8 L0 110" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="-14" y="24" width="12" height="12" rx="3" fill="url(#ks-goggle)"/>
      <rect x="4" y="24" width="12" height="12" rx="3" fill="url(#ks-goggle)"/>

      <!-- lengan + sarung tangan pink -->
      <path d="M-62 16 Q -86 40 -76 72" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
      <circle cx="-76" cy="78" r="18" fill="url(#ks-glove)"/>
      <rect x="-86" y="60" width="12" height="18" rx="6" fill="url(#ks-glove)"/>

      <path d="M62 16 Q 86 40 76 72" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
      <circle cx="76" cy="78" r="18" fill="url(#ks-glove)"/>

      <!-- kepala -->
      <circle cx="0" cy="-38" r="38" fill="#fde68a"/>
      <path d="M-36 -50 Q 0 -76 36 -50 Q 36 -62 0 -66 Q -36 -62 -36 -50 Z" fill="#78350f"/>

      <!-- kacamata pelindung -->
      <rect x="-30" y="-50" width="60" height="28" rx="14" fill="url(#ks-goggle)" opacity="0.9"/>
      <circle cx="-14" cy="-36" r="10" fill="#bae6fd" opacity="0.9"/>
      <circle cx="14" cy="-36" r="10" fill="#bae6fd" opacity="0.9"/>
      <line x1="-30" y1="-40" x2="-44" y2="-44" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="-40" x2="44" y2="-44" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

      <!-- senyum -->
      <path d="M-12 -12 Q 0 -4 12 -12" stroke="#78350f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
