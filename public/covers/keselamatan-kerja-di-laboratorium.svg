<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi siswa ceria memakai kacamata pelindung, sarung tangan, dan jas lab sambil memberi jempol aman">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="540" cy="80" r="100" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="80" cy="300" r="80" fill="#ffffff" fill-opacity="0.06"/>

  <g fill="#fde68a">
    <path transform="translate(500,250) scale(1)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
    <path transform="translate(120,60) scale(0.8)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <circle cx="470" cy="100" r="5" fill="#ec4899"/>
  <circle cx="150" cy="150" r="5" fill="#ffffff"/>

  <!-- rak botol lab kecil di background -->
  <g opacity="0.85">
    <rect x="480" y="190" width="30" height="55" rx="6" fill="#14b8a6"/>
    <rect x="488" y="178" width="14" height="14" rx="3" fill="#14b8a6"/>
    <rect x="530" y="200" width="30" height="45" rx="6" fill="#8b5cf6"/>
    <rect x="538" y="188" width="14" height="14" rx="3" fill="#8b5cf6"/>
  </g>

  <ellipse cx="300" cy="320" rx="150" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- karakter -->
  <g transform="translate(280,230)">
    <!-- jas lab -->
    <path d="M-80 20 Q 0 -30 80 20 L 70 140 L -70 140 Z" fill="#ffffff"/>
    <path d="M0 -10 L0 140" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="-18" y="30" width="14" height="14" rx="3" fill="#3b82f6"/>
    <rect x="4" y="30" width="14" height="14" rx="3" fill="#3b82f6"/>

    <!-- lengan + sarung tangan -->
    <path d="M-80 20 Q -110 50 -98 90" stroke="#ffffff" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="-98" cy="98" r="22" fill="#ec4899"/>
    <!-- jempol -->
    <rect x="-108" y="78" width="14" height="22" rx="7" fill="#ec4899"/>

    <path d="M80 20 Q 110 50 98 90" stroke="#ffffff" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="98" cy="98" r="22" fill="#ec4899"/>

    <!-- leher & kepala -->
    <circle cx="0" cy="-48" r="48" fill="#fde68a"/>
    <path d="M-46 -62 Q 0 -96 46 -62 Q 46 -78 0 -82 Q -46 -78 -46 -62 Z" fill="#78350f"/>

    <!-- kacamata pelindung -->
    <rect x="-38" y="-62" width="76" height="34" rx="17" fill="#3b82f6" fill-opacity="0.85"/>
    <circle cx="-18" cy="-45" r="12" fill="#bae6fd" fill-opacity="0.9"/>
    <circle cx="18" cy="-45" r="12" fill="#bae6fd" fill-opacity="0.9"/>
    <line x1="-38" y1="-50" x2="-55" y2="-55" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="-50" x2="55" y2="-55" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

    <!-- mulut senyum -->
    <path d="M-14 -16 Q 0 -6 14 -16" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- rambut depan -->
    <path d="M-30 -84 Q 0 -74 30 -84" stroke="#78350f" stroke-width="0" fill="#78350f" opacity="0"/>
  </g>

  <!-- check shield badge di pojok -->
  <g transform="translate(130,260)">
    <path d="M0 -34 L30 -22 L30 10 Q 30 34 0 44 Q -30 34 -30 10 L-30 -22 Z" fill="#22c55e"/>
    <path d="M-14 0 L-4 12 L16 -14" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
