      <path d="M0 -24 L22 -16 L22 8 Q22 24 0 32 Q-22 24 -22 8 L-22 -16 Z" fill="#22c55e"/>
      <path d="M-10 0 L-3 8 L11 -10" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="10" cy="60" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="236" cy="100" r="4" fill="#f97316" opacity="0.6"/>
    <path d="M60 -6 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24"/>
  </g>
