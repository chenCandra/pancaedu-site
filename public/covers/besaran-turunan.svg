<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bt-bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bt-blockL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bt-blockT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bt-blockV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="bt-blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bt-bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#bt-blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#bt-blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="200" height="24" rx="12" fill="#fbbf24"/>
    <text x="128" y="84.5" text-anchor="middle" fill="#ffffff">BESARAN TURUNAN</text>
  </g>

  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Besaran Turunan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Hasil Gabungan dari Besaran Pokok</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="33" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">v</text>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Kecepatan</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <rect x="14" y="16" width="24" height="20" rx="2" fill="none" stroke="#047857" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Luas</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <rect x="15" y="20" width="16" height="14" fill="none" stroke="#be185d" stroke-width="2"/>
      <path d="M15 20 L21 15 L37 15 L31 20 M31 20 L37 15 L37 29 L31 34" fill="none" stroke="#be185d" stroke-width="2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Volume</text>
    </g>
  </g>

  <g transform="translate(366,118)">
    <ellipse cx="128" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- blok L kiri atas -->
    <g transform="translate(40,34) rotate(-7)">
      <rect x="-38" y="-32" width="76" height="62" rx="12" fill="url(#bt-blockL)"/>
      <circle cx="-12" cy="-4" r="4.5" fill="#ffffff"/>
      <circle cx="12" cy="-4" r="4.5" fill="#ffffff"/>
      <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">L</text>
    </g>

    <!-- blok T kanan atas -->
    <g transform="translate(214,34) rotate(7)">
      <rect x="-38" y="-32" width="76" height="62" rx="12" fill="url(#bt-blockT)"/>
      <circle cx="-12" cy="-4" r="4.5" fill="#ffffff"/>
      <circle cx="12" cy="-4" r="4.5" fill="#ffffff"/>
      <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">T</text>
    </g>

    <!-- arrows merging -->
    <g stroke="#f97316" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M50 70 Q 90 120 128 150"/>
      <path d="M204 70 Q 164 120 128 150"/>
    </g>

    <!-- blok hasil v = L/T, bawah tengah, besar -->
    <g transform="translate(128,210)">
      <rect x="-58" y="-42" width="116" height="84" rx="16" fill="url(#bt-blockV)"/>
      <rect x="-58" y="-42" width="116" height="84" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
      <circle cx="-18" cy="-10" r="6" fill="#ffffff"/>
      <circle cx="18" cy="-10" r="6" fill="#ffffff"/>
      <path d="M-14 8 Q 0 18 14 8" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">v = L/T</text>
    </g>

    <!-- sparkle / decorative accents, varied colors -->
    <path d="M128 -4 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="246" cy="150" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="8" cy="150" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <circle cx="128" cy="96" r="5" fill="#f97316" opacity="0.5"/>
  </g>
</svg>
