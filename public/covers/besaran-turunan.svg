<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi balok mainan L dan T yang bergabung membentuk balok v, melambangkan besaran turunan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="560" cy="80" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="60" cy="300" r="80" fill="#ffffff" fill-opacity="0.07"/>

  <g fill="#fde68a">
    <path transform="translate(320,60) scale(1)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <circle cx="150" cy="90" r="5" fill="#ec4899"/>
  <circle cx="500" cy="100" r="5" fill="#ffffff"/>

  <!-- motion arrows dashed -->
  <path d="M150 140 Q 230 190 290 210" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="3 10" fill="none" stroke-linecap="round"/>
  <path d="M490 140 Q 410 190 350 210" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="3 10" fill="none" stroke-linecap="round"/>

  <ellipse cx="320" cy="300" rx="150" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- Block L (panjang) kiri atas -->
  <g transform="translate(130,110) rotate(-8)">
    <rect x="-55" y="-45" width="110" height="90" rx="14" fill="#3b82f6"/>
    <circle cx="-15" cy="-5" r="6" fill="#ffffff"/>
    <circle cx="15" cy="-5" r="6" fill="#ffffff"/>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">L</text>
  </g>

  <!-- Block T (waktu) kanan atas -->
  <g transform="translate(510,110) rotate(8)">
    <rect x="-55" y="-45" width="110" height="90" rx="14" fill="#14b8a6"/>
    <circle cx="-15" cy="-5" r="6" fill="#ffffff"/>
    <circle cx="15" cy="-5" r="6" fill="#ffffff"/>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">T</text>
  </g>

  <!-- Block v (hasil, besar, bawah tengah) -->
  <g transform="translate(320,255)">
    <rect x="-80" y="-60" width="160" height="120" rx="20" fill="#ec4899"/>
    <rect x="-80" y="-60" width="160" height="120" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
    <circle cx="-26" cy="-14" r="8" fill="#ffffff"/>
    <circle cx="26" cy="-14" r="8" fill="#ffffff"/>
    <path d="M-20 10 Q 0 24 20 10" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">v = L/T</text>
  </g>

  <!-- small gear/star accents -->
  <circle cx="230" cy="250" r="10" fill="#fde047"/>
  <circle cx="410" cy="250" r="10" fill="#8b5cf6"/>
</svg>
