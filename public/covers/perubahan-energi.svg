<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg3)"/>
  <circle cx="580" cy="60" r="80" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="300" r="70" fill="#ffffff" opacity="0.07"/>

  <!-- sun -->
  <g transform="translate(110,90)">
    <g stroke="#fde047" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="-48"/>
      <line x1="-44" y1="-44" x2="-34" y2="-34"/>
      <line x1="44" y1="-44" x2="34" y2="-34"/>
      <line x1="-62" y1="0" x2="-48" y2="0"/>
      <line x1="-44" y1="44" x2="-34" y2="34"/>
    </g>
    <circle r="38" fill="#fbbf24"/>
    <circle cx="-12" cy="-4" r="4" fill="#78350f"/>
    <circle cx="10" cy="-4" r="4" fill="#78350f"/>
    <path d="M-12 10 Q0 20 12 10" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- rays toward panel -->
  <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.8" stroke-dasharray="2 10">
    <line x1="130" y1="120" x2="160" y2="200"/>
    <line x1="108" y1="128" x2="128" y2="205"/>
    <line x1="155" y1="118" x2="195" y2="195"/>
  </g>

  <!-- solar panel -->
  <g transform="translate(170,240) rotate(-8)">
    <rect x="-80" y="-10" width="170" height="90" rx="6" fill="#1e40af"/>
    <g stroke="#93c5fd" stroke-width="3">
      <line x1="-80" y1="19" x2="90" y2="19"/>
      <line x1="-80" y1="48" x2="90" y2="48"/>
      <line x1="-26" y1="-10" x2="-26" y2="80"/>
      <line x1="30" y1="-10" x2="30" y2="80"/>
    </g>
  </g>
  <g transform="translate(170,240)">
    <rect x="-24" y="75" width="14" height="26" fill="#78350f"/>
    <rect x="36" y="75" width="14" height="26" fill="#78350f"/>
  </g>

  <!-- energy flow arrow + sparkles -->
  <path d="M270 228 Q380 160 456 190" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
  <polygon points="456,190 440,182 442,204" fill="#fde047"/>
  <g fill="#fff7ed" opacity="0.85">
    <path d="M330 178 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
    <path d="M395 162 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
  </g>

  <!-- glowing lightbulb -->
  <g transform="translate(500,190)">
    <circle r="46" fill="#fde047" opacity="0.22"/>
    <circle r="34" fill="#fde047"/>
    <rect x="-14" y="26" width="28" height="18" fill="#9ca3af"/>
    <rect x="-14" y="44" width="28" height="8" fill="#6b7280"/>
    <path d="M-10 -8 L6 8 L-4 8 L10 24" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#fff7ed" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-56" x2="0" y2="-68"/>
      <line x1="40" y1="-40" x2="48" y2="-48"/>
      <line x1="-40" y1="-40" x2="-48" y2="-48"/>
      <line x1="56" y1="0" x2="68" y2="0"/>
    </g>
  </g>
</svg>
