<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panelG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bulbG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint3)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG3)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG3)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="240" height="24" rx="12" fill="#fbbf24"/>
    <text x="148" y="84.5" text-anchor="middle" fill="#ffffff">TRANSFORMASI ENERGI</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Perubahan Energi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Dari Matahari Menuju Energi Listrik</text>

  <!-- mini badge chips: Matahari / Panel Surya / Listrik -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <g stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round">
        <line x1="26" y1="6" x2="26" y2="11"/>
        <line x1="26" y1="41" x2="26" y2="46"/>
        <line x1="6" y1="26" x2="11" y2="26"/>
        <line x1="41" y1="26" x2="46" y2="26"/>
      </g>
      <circle cx="26" cy="26" r="11" fill="#fbbf24"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Matahari</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="12" y="16" width="28" height="20" rx="2" fill="#1e40af"/>
      <line x1="12" y1="26" x2="40" y2="26" stroke="#93c5fd" stroke-width="1.6"/>
      <line x1="26" y1="16" x2="26" y2="36" stroke="#93c5fd" stroke-width="1.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Panel Surya</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <polygon points="30,8 14,30 24,30 20,46 38,22 27,22" fill="#ca8a04"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Listrik</text>
    </g>
  </g>

  <!-- hero illustration: transformation chain, sun -> panel -> bulb -->
  <g>
    <ellipse cx="500" cy="322" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sun -->
    <g transform="translate(460,150)">
      <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <line x1="0" y1="-42" x2="0" y2="-33"/>
        <line x1="0" y1="42" x2="0" y2="33"/>
        <line x1="-42" y1="0" x2="-33" y2="0"/>
        <line x1="-30" y1="-30" x2="-23" y2="-23"/>
        <line x1="-30" y1="30" x2="-23" y2="23"/>
      </g>
      <circle r="30" fill="url(#sunG3)"/>
      <circle cx="-9" cy="-3" r="3.4" fill="#78350f"/>
      <circle cx="9" cy="-3" r="3.4" fill="#78350f"/>
      <path d="M-10 9 Q0 17 10 9" stroke="#78350f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- rays toward panel -->
    <g stroke="#fde047" stroke-width="3.5" stroke-linecap="round" opacity="0.75" stroke-dasharray="2 9">
      <line x1="455" y1="175" x2="480" y2="225"/>
      <line x1="480" y1="170" x2="505" y2="222"/>
    </g>

    <!-- solar panel -->
    <g transform="translate(500,255) rotate(-8)">
      <rect x="-70" y="-10" width="140" height="62" rx="6" fill="url(#panelG3)"/>
      <g stroke="#93c5fd" stroke-width="2.6">
        <line x1="-70" y1="11" x2="70" y2="11"/>
        <line x1="-70" y1="32" x2="70" y2="32"/>
        <line x1="-23" y1="-10" x2="-23" y2="52"/>
        <line x1="23" y1="-10" x2="23" y2="52"/>
      </g>
      <rect x="-14" y="52" width="10" height="20" fill="#78350f"/>
      <rect x="24" y="52" width="10" height="20" fill="#78350f"/>
    </g>

    <!-- flow arrow to bulb -->
    <path d="M 555 240 Q 585 200 580 180" fill="none" stroke="#fde047" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 8"/>
    <polygon points="580,180 568,186 575,196" fill="#fde047"/>

    <!-- glowing lightbulb -->
    <g transform="translate(585,165)">
      <circle r="38" fill="#fde047" opacity="0.22"/>
      <circle r="28" fill="url(#bulbG3)"/>
      <rect x="-11" y="21" width="22" height="14" fill="#9ca3af"/>
      <rect x="-11" y="35" width="22" height="6" fill="#6b7280"/>
      <path d="M-8 -6 L5 7 L-3 7 L8 20" stroke="#b45309" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#fff7ed" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-44" x2="0" y2="-53"/>
        <line x1="31" y1="-31" x2="37" y2="-38"/>
        <line x1="44" y1="0" x2="53" y2="0"/>
      </g>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M520 195 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="405" cy="210" r="3.6" fill="#a855f7" opacity="0.65"/>
    <circle cx="418" cy="225" r="2.4" fill="#a855f7" opacity="0.55"/>
    <circle cx="610" cy="250" r="4" fill="#f472b6" opacity="0.7"/>
  </g>
</svg>
