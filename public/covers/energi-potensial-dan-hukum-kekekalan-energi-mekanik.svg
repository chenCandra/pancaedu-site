<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="e6bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="e6blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="e6track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="e6cartA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="e6cartB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#e6bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#e6blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#e6blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">Energi Potensial</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Hukum Kekekalan Energi Mekanik</text>

  <!-- mini badge chips: Ep / Ek / Kekal -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <line x1="26" y1="36" x2="26" y2="16" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M20 22 l6 -6 l6 6" stroke="#7c3aed" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Ep</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <g stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
        <line x1="10" y1="20" x2="20" y2="20"/>
        <line x1="10" y1="26" x2="26" y2="26"/>
        <line x1="10" y1="32" x2="16" y2="32"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Ek</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <path d="M16 26 a10 7 0 1 0 20 0 a10 7 0 1 0 -20 0" fill="none" stroke="#16a34a" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Kekal</text>
    </g>
  </g>

  <!-- hero illustration: roller-coaster hill, cart at peak + cart at valley -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="200" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sun + cloud accents -->
    <circle cx="238" cy="30" r="14" fill="#fde047" opacity="0.9"/>
    <g fill="#bfdbfe" opacity="0.8">
      <ellipse cx="30" cy="26" rx="18" ry="9"/>
      <ellipse cx="44" cy="22" rx="12" ry="7"/>
    </g>

    <!-- track -->
    <path d="M-6 150 C 30 30 90 28 120 86 C 150 142 190 168 252 136" fill="none" stroke="url(#e6track)" stroke-width="10" stroke-linecap="round"/>

    <!-- support pillars -->
    <g stroke="#9ca3af" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="30" y1="95" x2="30" y2="192"/>
      <line x1="130" y1="100" x2="130" y2="192"/>
      <line x1="220" y1="138" x2="220" y2="190"/>
    </g>

    <!-- dashed height line from peak -->
    <line x1="80" y1="62" x2="80" y2="192" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 5" opacity="0.6"/>

    <!-- cart at peak -->
    <g transform="translate(80,50)">
      <rect x="-16" y="-4" width="32" height="16" rx="5" fill="url(#e6cartA)"/>
      <circle cx="-9" cy="12" r="6" fill="#1b2340"/>
      <circle cx="9" cy="12" r="6" fill="#1b2340"/>
    </g>
    <g transform="translate(108,42)" font-family="Arial, sans-serif">
      <rect x="-13" y="-11" width="26" height="18" rx="9" fill="#7c3aed"/>
      <text x="0" y="2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Ep</text>
    </g>

    <!-- cart at valley with motion lines -->
    <g transform="translate(190,146) scale(0.9)">
      <rect x="-16" y="-4" width="32" height="16" rx="5" fill="url(#e6cartB)"/>
      <circle cx="-9" cy="12" r="6" fill="#1b2340"/>
      <circle cx="9" cy="12" r="6" fill="#1b2340"/>
    </g>
    <g stroke="#14b8a6" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
      <line x1="140" y1="150" x2="156" y2="150"/>
      <line x1="140" y1="158" x2="150" y2="158"/>
    </g>
    <g transform="translate(222,150)" font-family="Arial, sans-serif">
      <rect x="-13" y="-11" width="26" height="18" rx="9" fill="#2563eb"/>
      <text x="0" y="2" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Ek</text>
    </g>

    <!-- sparkle accents -->
    <path d="M16 110 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.8"/>
    <circle cx="252" cy="80" r="2.6" fill="#ec4899" opacity="0.75"/>
  </g>
</svg>
