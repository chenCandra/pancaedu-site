<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint10" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG10" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbowG10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.2" stop-color="#f97316"/>
      <stop offset="0.4" stop-color="#facc15"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="0.8" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint10)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG10)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG10)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">Spektrum</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2340">Elektromagnetik</text>
  <text x="26" y="192" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4338ca">Dari Gelombang Radio sampai Sinar-X</text>

  <!-- mini badge chips: Radio / Cahaya Tampak / Sinar-X -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M26 36 L26 20" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M18 24 Q26 10 34 24" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M14 29 Q26 8 38 29" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Radio</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <circle cx="26" cy="22" r="9" fill="#eab308"/>
      <rect x="22" y="30" width="8" height="6" rx="1.5" fill="#ca8a04"/>
      <text x="26" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#854d0e">Cahaya Tampak</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <text x="26" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">X</text>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Sinar-X</text>
    </g>
  </g>

  <!-- hero illustration: rainbow EM spectrum bar with 3 icons -->
  <g transform="translate(372,122)">
    <ellipse cx="118" cy="186" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <rect x="0" y="90" width="240" height="30" rx="15" fill="url(#rainbowG10)"/>

    <!-- antenna icon, radio end -->
    <g transform="translate(22,60)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 -4 Q0 -16 10 -4" stroke="#475569" stroke-width="2.4" fill="none"/>
      <path d="M-16 2 Q0 -22 16 2" stroke="#475569" stroke-width="2" fill="none" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#475569"/>
    </g>

    <!-- lightbulb icon, visible light middle -->
    <g transform="translate(118,60)">
      <circle cx="0" cy="0" r="12" fill="#fef9c3"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#eab308" stroke-width="2"/>
      <rect x="-5" y="10" width="10" height="6" rx="1.5" fill="#ca8a04"/>
    </g>

    <!-- x-ray symbol icon, right end -->
    <g transform="translate(214,60)">
      <circle cx="0" cy="0" r="14" fill="#ede9fe"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#6d28d9">X</text>
    </g>

    <text x="22" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#991b1b">Panjang &#955;</text>
    <text x="214" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#5b21b6">Pendek &#955;</text>

    <!-- sparkle accents -->
    <path d="M118 30 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="60" cy="150" r="3.5" fill="#f97316" opacity="0.7"/>
    <circle cx="190" cy="150" r="4" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
