<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magNG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="magSG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coilG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1b2340">
    <text x="26" y="122">Hukum Faraday dan</text>
    <text x="26" y="158">Hukum Lenz</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Fluks Berubah, GGL Induksi Muncul</text>

  <!-- mini badge chips: Fluks / GGL Induksi / Lenz -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M26 14 l10 8 -10 8 -10 -8 z" fill="none" stroke="#2563eb" stroke-width="2"/>
      <path d="M26 20 L26 34" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Fluks</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <rect x="18" y="16" width="16" height="22" rx="2" fill="none" stroke="#d97706" stroke-width="2"/>
      <path d="M18 24 l-4 0 M34 24 l4 0 M18 30 l-4 0 M34 30 l4 0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="8.3" font-weight="700" fill="#92400e">GGL Induksi</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M18 20 a8 8 0 1 1 16 6" fill="none" stroke="#db2777" stroke-width="2.2"/>
      <path d="M34 26 l6 2 -4 6 z" fill="#db2777"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Lenz</text>
    </g>
  </g>

  <!-- hero illustration: bar magnet moving into a coil, induced current + galvanometer -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- coil -->
    <g transform="translate(90,40)">
      <g stroke="url(#coilG)" stroke-width="5" fill="none" stroke-linecap="round">
        <ellipse cx="0" cy="18" rx="16" ry="34"/>
        <ellipse cx="22" cy="18" rx="16" ry="34"/>
        <ellipse cx="44" cy="18" rx="16" ry="34"/>
      </g>
      <!-- induced current arrows around coil -->
      <path d="M-8 -6 a24 24 0 0 1 20 -8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="3 4"/>
      <path d="M10 -15 l7 2 -5 7 z" fill="#16a34a"/>
      <path d="M52 44 a24 24 0 0 1 -18 10" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="3 4"/>
      <path d="M36 53 l-7 -1 4 -7 z" fill="#16a34a"/>
    </g>

    <!-- bar magnet moving toward coil -->
    <g transform="translate(6,22)">
      <rect x="0" y="0" width="30" height="36" rx="4" fill="url(#magNG)"/>
      <rect x="0" y="36" width="30" height="36" rx="4" fill="url(#magSG)"/>
      <text x="15" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">N</text>
      <text x="15" y="60" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">S</text>
    </g>
    <!-- motion arrow -->
    <path d="M40 54 L68 54" stroke="#a855f7" stroke-width="2.4" stroke-dasharray="4 5" stroke-linecap="round"/>
    <path d="M68 54 l-10 -5 0 10 z" fill="#a855f7"/>

    <!-- galvanometer -->
    <g transform="translate(220,150)">
      <circle r="26" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
      <text x="0" y="-8" text-anchor="middle" font-size="8" font-weight="700" fill="#9a3412">mA</text>
      <line x1="0" y1="4" x2="12" y2="-10" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="3" fill="#1b2340"/>
    </g>

    <!-- sparkle accents -->
    <path d="M250 16 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="150" cy="188" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <circle cx="8" cy="100" r="3" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
