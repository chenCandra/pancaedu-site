<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint3" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wireG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="arrowG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint3)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG3)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG3)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">
    <text x="26" y="122">Medan Magnet oleh</text>
    <text x="26" y="160">Arus Listrik</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9d174d">Kaidah Tangan Kanan &amp; Elektromagnet</text>

  <!-- mini badge chips: Kaidah Tangan Kanan / Arus / Medan -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,206)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 15 A11 11 0 1 1 15.5 29" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M15.5 29 l-5 1 2 -6 z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Tangan Kanan</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="14" y1="26" x2="36" y2="26" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M36 26 l-7 -5 l0 10 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Arus</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="26" cy="26" r="4" fill="#7c3aed"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="2 3"/>
      <circle cx="26" cy="26" r="15" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Medan</text>
    </g>
  </g>

  <!-- hero illustration: vertical current-carrying wire + concentric field loops -->
  <g transform="translate(372,55)">
    <ellipse cx="130" cy="268" rx="130" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- concentric dashed field loops (perspective ellipses) -->
    <ellipse cx="130" cy="150" rx="104" ry="36" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 6" opacity="0.55"/>
    <ellipse cx="130" cy="150" rx="74" ry="26" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 6" opacity="0.6"/>
    <ellipse cx="130" cy="150" rx="44" ry="16" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="3 6" opacity="0.65"/>
    <!-- curl-direction arrow on outer loop -->
    <path d="M226 150 l6 7 l-9 2 z" fill="#2563eb"/>

    <!-- vertical current-carrying wire -->
    <rect x="118" y="6" width="24" height="248" rx="8" fill="url(#wireG3)"/>

    <!-- current direction arrow inside wire -->
    <line x1="130" y1="200" x2="130" y2="40" stroke="url(#arrowG3)" stroke-width="6" stroke-linecap="round"/>
    <path d="M130 24 l-11 20 l22 0 z" fill="#d97706"/>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#92400e">I</text>

    <!-- decorative accents -->
    <path d="M232 230 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="28" cy="60" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="20" cy="230" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M44 20 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
