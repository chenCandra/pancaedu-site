<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="waterG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hullG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sailG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rockG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG1)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#a5f3fc" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a5f3fc" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#a5f3fc"/>
    <text x="493" y="32" text-anchor="middle" fill="#0e7490">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="110" height="24" rx="12" fill="#0e7490"/>
    <text x="83" y="84.5" text-anchor="middle" fill="#ffffff">FLUIDA</text>
  </g>

  <!-- title -->
  <text x="26" y="138" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Massa Jenis dan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Tekanan Hidrostatis</text>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#155e75">Terapung, Melayang, dan Tenggelam</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="800" fill="#0e7490">ρ=m/V</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#155e75">ρ=m/V</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#fde68a"/>
      <path d="M26 15 a9 9 0 0 1 9 9 c0 6 -9 13 -9 13 s-9 -7 -9 -13 a9 9 0 0 1 9 -9z" fill="#b45309"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Tekanan</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M14 30 q6 -6 12 0 q6 -6 12 0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M14 22 q6 -6 12 0 q6 -6 12 0" stroke="#1d4ed8" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Hidrostatis</text>
    </g>
  </g>

  <!-- hero illustration -->
  <g transform="translate(372,112)">
    <ellipse cx="110" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- water block with level line -->
    <rect x="-20" y="98" width="260" height="98" fill="url(#waterG1)" opacity="0.85"/>
    <rect x="-20" y="98" width="260" height="6" fill="#67e8f9" opacity="0.9"/>

    <!-- ship floating on the surface -->
    <g transform="translate(18,66)">
      <path d="M-4 32 Q40 50 84 32 L74 50 Q40 60 6 50 Z" fill="url(#hullG1)"/>
      <rect x="34" y="4" width="4" height="28" fill="#78350f"/>
      <path d="M38 6 L38 28 L62 28 Z" fill="url(#sailG1)"/>
      <circle cx="40" cy="44" r="2.4" fill="#fde68a"/>
      <circle cx="48" cy="46" r="2.4" fill="#fde68a"/>
    </g>

    <!-- rock sinking under the water -->
    <g transform="translate(150,118)">
      <path d="M0 18 Q4 2 20 2 Q38 0 38 16 Q40 30 22 32 Q4 34 0 18 Z" fill="url(#rockG1)"/>
      <path d="M8 14 Q16 10 24 14" stroke="#334155" stroke-width="1.6" fill="none" opacity="0.6"/>
    </g>

    <!-- bubble trails rising from the rock -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="158" cy="100" r="3"/>
      <circle cx="166" cy="86" r="2.4"/>
      <circle cx="152" cy="80" r="2"/>
      <circle cx="170" cy="150" r="2.6"/>
      <circle cx="178" cy="134" r="2"/>
    </g>

    <!-- small gauge icon (pressure increasing with depth) -->
    <g transform="translate(228,150)">
      <circle cx="0" cy="0" r="20" fill="#ffffff"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#fb923c" stroke-width="2"/>
      <path d="M0 0 L7 -9" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.4" fill="#c2410c"/>
    </g>

    <!-- sparkle + dot accents in extra colors -->
    <path d="M230 30 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f472b6" opacity="0.85"/>
    <circle cx="10" cy="20" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="200" cy="40" r="3" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="58" x2="230" y2="58"/>
    </g>
  </g>
</svg>
