<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sleeperG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a16207"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sunG1" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG1)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f97316" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fed7aa" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#ffedd5"/>
    <text x="493" y="32" text-anchor="middle" fill="#9a3412">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="188" height="24" rx="12" fill="#f97316"/>
    <text x="122" y="84.5" text-anchor="middle" fill="#ffffff">TERMODINAMIKA</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Suhu dan Pemuaian</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9a3412">Kenapa Rel Kereta Diberi Celah Kecil?</text>

  <!-- mini badge chips: Suhu / Muai Panjang / formula -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <rect x="22" y="12" width="8" height="24" rx="4" fill="#dc2626"/>
      <circle cx="26" cy="38" r="7" fill="#dc2626"/>
      <rect x="23" y="16" width="2" height="18" fill="#fecaca"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Suhu</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="16" y="23" width="20" height="6" rx="3" fill="#2563eb"/>
      <path d="M12 26 l6 -5 v4 M12 26 l6 5 v-4" fill="#2563eb"/>
      <path d="M40 26 l-6 -5 v4 M40 26 l-6 5 v-4" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Muai Panjang</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#f3e8ff"/>
      <text x="26" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">ΔL</text>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">ΔL=L0αΔT</text>
    </g>
  </g>

  <!-- hero illustration: railway track with expansion gap -->
  <g transform="translate(348,112)">
    <ellipse cx="130" cy="192" rx="160" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sun, top-right accent -->
    <g transform="translate(236,18)">
      <circle cx="0" cy="0" r="18" fill="url(#sunG1)"/>
      <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <line x1="0" y1="-26" x2="0" y2="-32"/>
        <line x1="18" y1="-18" x2="23" y2="-23"/>
        <line x1="26" y1="0" x2="32" y2="0"/>
        <line x1="18" y1="18" x2="23" y2="23"/>
      </g>
    </g>

    <!-- sleepers (behind rails) -->
    <g fill="url(#sleeperG1)">
      <rect x="4" y="128" width="14" height="60" rx="3"/>
      <rect x="48" y="128" width="14" height="60" rx="3"/>
      <rect x="150" y="128" width="14" height="60" rx="3"/>
      <rect x="194" y="128" width="14" height="60" rx="3"/>
      <rect x="236" y="128" width="14" height="60" rx="3"/>
    </g>

    <!-- rails with expansion gap -->
    <g>
      <rect x="0" y="134" width="95" height="11" rx="5" fill="url(#railG1)"/>
      <rect x="128" y="134" width="124" height="11" rx="5" fill="url(#railG1)"/>
      <rect x="0" y="172" width="95" height="11" rx="5" fill="url(#railG1)"/>
      <rect x="128" y="172" width="124" height="11" rx="5" fill="url(#railG1)"/>
    </g>

    <!-- expansion gap markers -->
    <g stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4" opacity="0.7">
      <line x1="95" y1="120" x2="95" y2="190"/>
      <line x1="128" y1="120" x2="128" y2="190"/>
    </g>
    <path d="M98 108 l6 6 -6 6 M125 108 l-6 6 6 6" fill="none" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- heat shimmer above the gap -->
    <g stroke="#fb923c" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.65">
      <path d="M100 96 q5 -10 0 -18 q-5 -8 0 -16"/>
      <path d="M114 90 q5 -10 0 -18 q-5 -8 0 -16"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M14 -2 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="258" cy="92" r="4" fill="#a855f7" opacity="0.75"/>
    <circle cx="6" cy="200" r="3.5" fill="#f59e0b" opacity="0.7"/>
    <path d="M232 196 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#2563eb" opacity="0.8"/>
  </g>
</svg>
