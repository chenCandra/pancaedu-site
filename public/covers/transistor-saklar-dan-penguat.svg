<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fefb"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="valveG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="waterSmallG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="waterBigG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#a7f3d0" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#10b981" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a7f3d0" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#d1fae5"/>
    <text x="493" y="32" text-anchor="middle" fill="#065f46">Fisika</text>
    <rect x="526" y="16" width="86" height="24" rx="12" fill="#e0e7ff"/>
    <text x="569" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="240" height="24" rx="12" fill="#10b981"/>
    <text x="148" y="84.5" text-anchor="middle" fill="#ffffff">ELEKTRONIKA DIGITAL</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">
    <text x="26" y="126">Transistor:</text>
    <text x="26" y="160">Saklar dan Penguat</text>
  </g>
  <text x="26" y="188" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#065f46">Satu Komponen, Dua Peran Penting</text>

  <!-- mini badge chips: Saklar / Penguat / Transistor -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,212)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="16" cy="32" r="3" fill="#d97706"/>
      <circle cx="36" cy="32" r="3" fill="#d97706"/>
      <path d="M16 32 L32 18" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Saklar</text>
    </g>
    <g transform="translate(104,212)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M14 30 L22 30 L22 16 L34 36 L26 36 L26 20 Z" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Penguat</text>
    </g>
    <g transform="translate(182,212)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="10" y1="20" x2="18" y2="20" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="18" y1="20" x2="18" y2="32" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="18" y1="23" x2="34" y2="16" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="18" y1="29" x2="34" y2="36" stroke="#2563eb" stroke-width="2.2"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Transistor</text>
    </g>
  </g>

  <!-- hero illustration: water-valve analogy for amplification, plus transistor symbol -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="178" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- small transistor symbol badge, top-right -->
    <g transform="translate(224,18)">
      <circle cx="0" cy="0" r="22" fill="#ffffff"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#a7f3d0" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#2563eb" stroke-width="2"/>
      <line x1="-14" y1="-5" x2="-9" y2="-5" stroke="#2563eb" stroke-width="2"/>
      <line x1="-9" y1="-5" x2="-9" y2="6" stroke="#2563eb" stroke-width="2"/>
      <line x1="-9" y1="-1" x2="8" y2="-9" stroke="#2563eb" stroke-width="2"/>
      <line x1="-9" y1="3" x2="8" y2="11" stroke="#2563eb" stroke-width="2"/>
    </g>

    <!-- control (small) pipe + flow, top-left -->
    <g transform="translate(0,6)">
      <rect x="0" y="0" width="64" height="16" rx="6" fill="url(#pipeG)"/>
      <rect x="4" y="5" width="46" height="6" rx="3" fill="url(#waterSmallG)"/>
      <text x="0" y="-6" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">SINYAL KECIL (BASIS)</text>
    </g>
    <path d="M64 8 C78 8 80 30 90 40" stroke="#93c5fd" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- valve wheel, the control point -->
    <g transform="translate(94,52)">
      <circle cx="0" cy="0" r="22" fill="url(#valveG)"/>
      <g stroke="#7c2d12" stroke-width="3" stroke-linecap="round">
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-10" y1="-10" x2="10" y2="10"/>
        <line x1="-10" y1="10" x2="10" y2="-10"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#7c2d12"/>
    </g>

    <!-- control dashed signal line into valve -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.6">
      <path d="M32 16 C40 30 60 40 76 46" fill="none"/>
    </g>

    <!-- main (big) pipe, output flow -->
    <g transform="translate(112,78)">
      <rect x="0" y="0" width="120" height="30" rx="8" fill="url(#pipeG)"/>
      <rect x="6" y="7" width="96" height="16" rx="6" fill="url(#waterBigG)"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">ARUS BESAR (KOLEKTOR)</text>
    </g>

    <!-- splash basin at pipe end -->
    <g transform="translate(246,100)">
      <ellipse cx="0" cy="0" rx="18" ry="10" fill="#93c5fd" opacity="0.7"/>
      <circle cx="-6" cy="-14" r="3" fill="#60a5fa" opacity="0.8"/>
      <circle cx="8" cy="-18" r="2.4" fill="#60a5fa" opacity="0.8"/>
    </g>

    <!-- amplification glow dots along the big flow -->
    <circle cx="150" cy="93" r="3.2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="180" cy="93" r="3.2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="210" cy="93" r="3.2" fill="#fbbf24" opacity="0.8"/>

    <!-- sparkle accents -->
    <path d="M250 150 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <path d="M14 150 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#f97316" opacity="0.85"/>
    <circle cx="-8" cy="80" r="3" fill="#a855f7" opacity="0.55"/>
  </g>
</svg>
