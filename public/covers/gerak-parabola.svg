<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- sun -->
  <circle cx="540" cy="70" r="34" fill="#fde047"/>
  <circle cx="540" cy="70" r="46" fill="#fde047" opacity="0.25"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.2">
    <ellipse cx="120" cy="60" rx="38" ry="16"/>
    <ellipse cx="150" cy="52" rx="26" ry="13"/>
    <ellipse cx="430" cy="110" rx="30" ry="12"/>
  </g>

  <!-- ground -->
  <rect x="0" y="300" width="640" height="60" fill="#1d4ed8" opacity="0.45"/>
  <ellipse cx="320" cy="300" rx="320" ry="14" fill="#1e3a8a" opacity="0.3"/>

  <!-- dashed parabolic trajectory -->
  <path d="M100 290 Q320 20 560 260" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="14 12" opacity="0.7"/>

  <!-- small arrow at the peak showing direction -->
  <g transform="translate(320,22) rotate(90)">
    <path d="M-14 6 L10 0 L-14 -6" fill="#fde047"/>
  </g>

  <!-- ball along the arc, mid flight, with motion streak -->
  <g transform="translate(430,70)">
    <path d="M-30 14 Q-14 4 0 0" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="#f97316"/>
    <path d="M-10 -8 Q0 0 10 -8 M-12 4 Q0 10 12 4" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ea580c" stroke-width="2"/>
  </g>

  <!-- landing splash dots near the end of arc -->
  <circle cx="540" cy="250" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="555" cy="235" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- cartoon kid kicking the ball -->
  <g transform="translate(130,0)">
    <ellipse cx="60" cy="298" rx="60" ry="12" fill="#0f172a" opacity="0.25"/>
    <!-- back leg (standing) -->
    <rect x="48" y="245" width="14" height="48" rx="7" fill="#fbbf24"/>
    <!-- kicking leg, extended forward/up -->
    <path d="M70 252 Q100 250 118 232" stroke="#fbbf24" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- shoe -->
    <ellipse cx="124" cy="228" rx="14" ry="9" fill="#1e293b"/>
    <!-- torso -->
    <path d="M30 190 Q30 160 60 158 Q90 160 90 190 L88 248 L32 248 Z" fill="#22c55e"/>
    <!-- arms -->
    <path d="M34 185 Q10 175 2 150" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M86 185 Q108 170 112 150" stroke="#22c55e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="60" cy="130" r="30" fill="#fbbf24"/>
    <!-- hair -->
    <path d="M32 118 Q60 92 88 118 Q86 104 60 100 Q34 104 32 118 Z" fill="#1e293b"/>
    <!-- face -->
    <circle cx="50" cy="132" r="3.5" fill="#1e293b"/>
    <circle cx="70" cy="132" r="3.5" fill="#1e293b"/>
    <path d="M48 144 Q60 152 72 144" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- supporting foot -->
    <ellipse cx="54" cy="296" rx="16" ry="8" fill="#1e293b"/>
  </g>

  <!-- small motion stars for energy -->
  <path d="M250 90 l4 10 11 1 -8 7 2 11 -9 -6 -9 6 2 -11 -8 -7 11 -1 z" fill="#ec4899" opacity="0.85"/>
  <circle cx="200" cy="150" r="5" fill="#ffffff" opacity="0.5"/>
</svg>
