<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="gpBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="gpBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gpBlobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gpBallG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="gpBodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gpSunG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#gpBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#gpBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#gpBlobPink)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="160" height="24" rx="12" fill="#2563eb"/>
    <text x="108" y="84.5" text-anchor="middle" fill="#ffffff">GERAK PARABOLA</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Gerak Parabola</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">Lintasan Melengkung Benda Dilempar</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 34 h28" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12 34 L34 16" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12 34 A12 12 0 0 1 20 25" stroke="#2563eb" stroke-width="2" fill="none"/>
      <text x="26" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Sudut</text>
      <text x="26" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Elevasi</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <path d="M14 32 Q26 16 38 32" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/>
      <path d="M12 32 h28" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Jangkauan</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 36 L26 16" stroke="#d97706" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20 22 L26 16 L32 22" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Tinggi</text>
      <text x="26" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Maks</text>
    </g>
  </g>

  <!-- hero illustration: cartoon kid kicking ball along parabolic arc, dynamic -->
  <g transform="translate(372,118)">
    <ellipse cx="110" cy="196" rx="150" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- sun + clouds -->
    <circle cx="238" cy="-6" r="20" fill="url(#gpSunG)"/>
    <ellipse cx="40" cy="-4" rx="20" ry="8" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="58" cy="-9" rx="14" ry="7" fill="#ffffff" opacity="0.85"/>

    <!-- dashed parabolic trajectory -->
    <path d="M30 170 Q130 -16 236 120" fill="none" stroke="#93c5fd" stroke-width="4" stroke-dasharray="10 9" opacity="0.9"/>

    <!-- direction arrow at the peak -->
    <g transform="translate(128,-6) rotate(66)">
      <path d="M-10 4 L8 0 L-10 -4 Z" fill="#14b8a6"/>
    </g>

    <!-- ball mid-flight with motion streak -->
    <g transform="translate(192,78)">
      <path d="M-26 10 Q-12 4 0 0" stroke="#fb923c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
      <circle cx="0" cy="0" r="14" fill="url(#gpBallG)"/>
      <path d="M-7 -6 Q0 0 7 -6 M-8 3 Q0 8 8 3" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    </g>

    <!-- landing dots -->
    <circle cx="230" cy="130" r="3" fill="#93c5fd" opacity="0.8"/>
    <circle cx="240" cy="118" r="2.2" fill="#93c5fd" opacity="0.7"/>

    <!-- cartoon kid kicking -->
    <g transform="translate(6,56)">
      <path d="M22 118 Q22 98 44 95 Q66 98 66 118 L64 150 Q44 156 24 150 Z" fill="url(#gpBodyG)"/>
      <path d="M22 100 Q4 92 -2 72" stroke="#16a34a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M64 100 Q80 90 84 72" stroke="#16a34a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="30" y="140" width="10" height="34" rx="5" fill="#fbbf24"/>
      <path d="M46 146 Q66 140 80 126" stroke="#fbbf24" stroke-width="11" fill="none" stroke-linecap="round"/>
      <ellipse cx="84" cy="122" rx="10" ry="6" fill="#1b2340"/>
      <circle cx="44" cy="72" r="20" fill="#fbbf24"/>
      <path d="M26 64 Q44 46 62 64 Q60 54 44 51 Q28 54 26 64 Z" fill="#1b2340"/>
      <circle cx="38" cy="74" r="2.4" fill="#1b2340"/>
      <circle cx="52" cy="74" r="2.4" fill="#1b2340"/>
      <path d="M36 84 Q44 90 52 84" stroke="#1b2340" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="26" cy="176" rx="11" ry="6" fill="#1b2340"/>
    </g>

    <!-- sparkle accents -->
    <path d="M250 60 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#ec4899" opacity="0.9"/>
    <circle cx="200" cy="30" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
