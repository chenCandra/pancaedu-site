<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="skinG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fbbf7a"/>
    </linearGradient>
    <linearGradient id="hairG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="bulbG1" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="glowG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rocketG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG1)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1b2340">Teori Relativitas Khusus:</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1b2340">Awal Mula Fisika Modern</text>
  <text x="26" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#4338ca">Dua Postulat yang Mengubah Fisika Klasik</text>

  <!-- mini badge chips: Einstein / Postulat / Relativitas -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#e0e7ff"/>
      <path d="M10 18 Q14 6 26 7 Q38 6 42 18 Q36 12 26 12 Q16 12 10 18 Z" fill="#4338ca"/>
      <circle cx="20" cy="25" r="2" fill="#312e81"/>
      <circle cx="32" cy="25" r="2" fill="#312e81"/>
      <path d="M18 34 Q26 30 34 34" stroke="#312e81" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312e81">Einstein</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="22" r="10" fill="#f59e0b"/>
      <rect x="22" y="30" width="8" height="6" rx="1.5" fill="#d97706"/>
      <path d="M22 17 L26 22 L30 17" stroke="#fffbeb" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Postulat</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ccfbf1"/>
      <ellipse cx="26" cy="26" rx="15" ry="6" fill="none" stroke="#0d9488" stroke-width="2"/>
      <ellipse cx="26" cy="26" rx="6" ry="15" fill="none" stroke="#0d9488" stroke-width="2" transform="rotate(40 26 26)"/>
      <circle cx="26" cy="26" r="3" fill="#0f766e"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#115e59">Relativitas</text>
    </g>
  </g>

  <!-- hero illustration: Einstein-ish figure + lightbulb idea + small rocket -->
  <g transform="translate(378,112)">
    <ellipse cx="118" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- shoulders / suit -->
    <path d="M55 196 Q55 140 118 140 Q181 140 181 196 Z" fill="url(#suitG1)"/>
    <path d="M100 150 L118 168 L136 150 L136 140 L100 140 Z" fill="#e2e8f0"/>
    <path d="M118 168 L112 182 L124 182 Z" fill="#ef4444"/>

    <!-- head -->
    <circle cx="118" cy="104" r="40" fill="url(#skinG1)"/>

    <!-- wild hair -->
    <path d="M78 96 Q66 60 94 54 Q86 36 110 40 Q118 24 132 38 Q152 32 150 56 Q172 62 158 94 Q164 80 150 76 Q140 92 126 78 Q116 90 104 78 Q92 92 82 80 Q70 84 78 96 Z" fill="url(#hairG1)"/>
    <!-- mustache -->
    <path d="M98 118 Q108 128 118 120 Q128 128 138 118 Q130 134 118 128 Q106 134 98 118 Z" fill="#e2e8f0"/>
    <!-- eyebrows / eyes -->
    <path d="M100 96 Q108 90 116 96" stroke="#94a3b8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M122 96 Q130 90 138 96" stroke="#94a3b8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="108" cy="104" r="2.6" fill="#312e81"/>
    <circle cx="130" cy="104" r="2.6" fill="#312e81"/>

    <!-- idea lightbulb above head -->
    <circle cx="186" cy="38" r="26" fill="url(#glowG1)"/>
    <circle cx="186" cy="34" r="14" fill="url(#bulbG1)"/>
    <rect x="181" y="46" width="10" height="8" rx="2" fill="#92400e"/>
    <path d="M181 30 L186 36 L191 30" stroke="#fffbeb" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M186 10 l0 -8 M166 20 l-7 -5 M206 20 l7 -5" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>

    <!-- small rocket, lower right -->
    <g transform="translate(176,150) rotate(28)">
      <path d="M0 -26 Q10 -10 10 10 L-10 10 Q-10 -10 0 -26 Z" fill="url(#rocketG1)"/>
      <circle cx="0" cy="-4" r="4" fill="#fef9c3"/>
      <path d="M-10 6 L-18 18 L-6 12 Z" fill="#b91c1c"/>
      <path d="M10 6 L18 18 L6 12 Z" fill="#b91c1c"/>
      <path d="M-5 10 Q0 24 5 10" fill="#fb923c"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M18 30 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="230" cy="90" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="20" cy="150" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M210 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
