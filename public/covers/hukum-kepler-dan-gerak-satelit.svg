<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="k2bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="k2blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k2sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="k2planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="k2moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#k2bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#k2blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#k2blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="36" fill="#1b2340">
    <text x="26" y="124">Hukum Kepler dan</text>
    <text x="26" y="164">Gerak Satelit</text>
  </g>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Orbit Elips dan Kecepatan Satelit</text>

  <!-- mini badge chips: Orbit / Kepler / Satelit -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <ellipse cx="26" cy="26" rx="18" ry="10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 4"/>
      <circle cx="26" cy="26" r="3" fill="#7c3aed"/>
      <circle cx="42" cy="22" r="2.6" fill="#f59e0b"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Orbit</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <circle cx="26" cy="27" r="9" fill="#f59e0b"/>
      <ellipse cx="26" cy="27" rx="16" ry="5" fill="none" stroke="#d97706" stroke-width="2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Kepler</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <rect x="17" y="21" width="18" height="10" rx="2" fill="#db2777"/>
      <rect x="9" y="23" width="7" height="6" fill="#f472b6"/>
      <rect x="36" y="23" width="7" height="6" fill="#f472b6"/>
      <line x1="26" y1="31" x2="26" y2="38" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9d174d">Satelit</text>
    </g>
  </g>

  <!-- hero illustration: sun + planet on elliptical dashed orbit + moon, speed arrows -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="188" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- elliptical dashed orbit -->
    <ellipse cx="135" cy="120" rx="112" ry="56" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="4 6" opacity="0.6" transform="rotate(-6 135 120)"/>

    <!-- sun with rays -->
    <g transform="translate(46,96)">
      <g stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-34" x2="0" y2="-26"/>
        <line x1="24" y1="-24" x2="19" y2="-18"/>
        <line x1="-24" y1="-24" x2="-19" y2="-18"/>
        <line x1="34" y1="0" x2="26" y2="0"/>
        <line x1="-34" y1="0" x2="-26" y2="0"/>
      </g>
      <circle r="24" fill="url(#k2sun)"/>
      <circle cx="-7" cy="-7" r="5" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- planet near sun (perihelion) with fast speed arrow + motion lines -->
    <g transform="translate(78,152)">
      <circle r="15" fill="url(#k2planet)"/>
      <ellipse cx="0" cy="0" rx="21" ry="5" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.7"/>
      <g stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="-34" y1="4" x2="-24" y2="2"/>
        <line x1="-40" y1="10" x2="-30" y2="8"/>
      </g>
      <path d="M-18 -10 l12 4 l-10 8 z" fill="#ec4899" transform="translate(-6,-4) rotate(20)"/>
    </g>

    <!-- planet far (aphelion) smaller, slow, with long thin arrow -->
    <g transform="translate(234,104)">
      <circle r="9" fill="url(#k2planet)" opacity="0.85"/>
      <path d="M12 -4 L30 -8" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <path d="M30 -8 l-8 -2 l3 5 z" fill="#3b82f6" opacity="0.7"/>
    </g>

    <!-- small moon accent -->
    <g transform="translate(150,38)">
      <circle r="10" fill="url(#k2moon)"/>
      <circle cx="-3" cy="-3" r="2" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- sparkle accents -->
    <path d="M246 150 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#f97316" opacity="0.85"/>
    <circle cx="10" cy="48" r="3" fill="#14b8a6" opacity="0.7"/>
    <circle cx="200" cy="190" r="2.6" fill="#fbbf24" opacity="0.8"/>
    <path d="M18 170 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
