<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint5" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringG5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="particleG5" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="glowG5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint5)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG5)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG5)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1b2340">Massa Relativistik dan</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#1b2340">Momentum Relativistik</text>
  <text x="26" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#4338ca">Kenapa Massa Ikut Berubah di Kecepatan Tinggi</text>

  <!-- mini badge chips: Massa Relativistik / Momentum / Akselerator -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <circle cx="20" cy="24" r="9" fill="#0e7490"/>
      <circle cx="32" cy="30" r="6" fill="#06b6d4"/>
      <text x="26" y="66" text-anchor="middle" font-size="8.3" font-weight="700" fill="#155e75">Massa Relativistik</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="18" cy="26" r="6" fill="#d97706"/>
      <path d="M24 26 L38 26" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M33 21 L38 26 L33 31" stroke="#d97706" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Momentum</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <circle cx="26" cy="26" r="13" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-dasharray="3 3"/>
      <circle cx="26" cy="13" r="3" fill="#a855f7"/>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">Akselerator</text>
    </g>
  </g>

  <!-- hero illustration: accelerator ring + glowing particle + energy arrows -->
  <g transform="translate(372,112)">
    <ellipse cx="118" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <circle cx="118" cy="112" r="95" fill="none" stroke="url(#ringG5)" stroke-width="14" stroke-dasharray="10 8" opacity="0.9"/>
    <circle cx="118" cy="112" r="95" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>

    <circle cx="118" cy="112" r="34" fill="url(#glowG5)"/>
    <circle cx="118" cy="17" r="12" fill="url(#particleG5)"/>

    <!-- growing +energi arrows -->
    <g stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M50 112 L30 112"/>
      <path d="M36 106 L30 112 L36 118"/>
    </g>
    <text x="24" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">+energi</text>

    <g stroke="#ea580c" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M118 212 L118 192"/>
      <path d="M111 198 L118 192 L125 198"/>
    </g>
    <text x="118" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">+energi</text>

    <!-- sparkle accents -->
    <path d="M210 40 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#f97316" opacity="0.85"/>
    <circle cx="20" cy="40" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="214" cy="180" r="4" fill="#14b8a6" opacity="0.75"/>
  </g>
</svg>
