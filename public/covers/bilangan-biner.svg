<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fefb"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="litG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dimG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="dispG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#a7f3d0" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#10b981" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a7f3d0" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#d1fae5"/>
    <text x="493" y="32" text-anchor="middle" fill="#065f46">Fisika</text>
    <rect x="526" y="16" width="86" height="24" rx="12" fill="#e0e7ff"/>
    <text x="569" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="240" height="24" rx="12" fill="#10b981"/>
    <text x="148" y="84.5" text-anchor="middle" fill="#ffffff">ELEKTRONIKA DIGITAL</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Bilangan Biner</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#065f46">Bahasa Angka 0 dan 1 di Dunia Digital</text>

  <!-- mini badge chips: 0 dan 1 / Biner / Desimal -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#059669">01</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">0 dan 1</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="14" y="31" width="4" height="10" rx="1" fill="#2563eb"/>
      <rect x="20" y="25" width="4" height="16" rx="1" fill="#2563eb"/>
      <rect x="26" y="33" width="4" height="8" rx="1" fill="#2563eb"/>
      <rect x="32" y="27" width="4" height="14" rx="1" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Biner</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="800" fill="#d97706">123</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Desimal</text>
    </g>
  </g>

  <!-- hero illustration: binary digit blocks converting to a decimal display -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="150" rx="130" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- caption -->
    <text x="91" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#059669">BINER</text>

    <!-- 4 bit blocks: 1 0 1 1 -->
    <g font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
      <g transform="translate(0,20)">
        <rect width="38" height="54" rx="10" fill="url(#litG)"/>
        <text x="19" y="35" fill="#ffffff">1</text>
      </g>
      <g transform="translate(48,20)">
        <rect width="38" height="54" rx="10" fill="url(#dimG)"/>
        <text x="19" y="35" fill="#64748b">0</text>
      </g>
      <g transform="translate(96,20)">
        <rect width="38" height="54" rx="10" fill="url(#litG)"/>
        <text x="19" y="35" fill="#ffffff">1</text>
      </g>
      <g transform="translate(144,20)">
        <rect width="38" height="54" rx="10" fill="url(#litG)"/>
        <text x="19" y="35" fill="#ffffff">1</text>
      </g>
    </g>

    <!-- arrow -->
    <path d="M194 37 L222 47 L194 57 Z" fill="url(#arrowG)"/>

    <!-- decimal display -->
    <g>
      <rect x="230" y="14" width="70" height="66" rx="12" fill="url(#dispG)"/>
      <text x="265" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">11</text>
      <text x="265" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7">DESIMAL</text>
    </g>

    <!-- circuit trace under blocks -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="84" x2="182" y2="84"/>
    </g>
    <g fill="#f97316" opacity="0.75">
      <circle cx="19" cy="84" r="3"/>
      <circle cx="115" cy="84" r="3"/>
      <circle cx="163" cy="84" r="3"/>
    </g>
    <circle cx="67" cy="84" r="3" fill="#14b8a6" opacity="0.8"/>

    <!-- sparkle accents -->
    <path d="M250 -8 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <path d="M6 118 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="222" cy="22" r="4" fill="#f97316" opacity="0.7"/>
    <circle cx="-8" cy="60" r="3.5" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
