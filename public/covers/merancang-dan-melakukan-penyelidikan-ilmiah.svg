      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9d174d">Kesimpulan</text>
    </g>
  </g>

  <g transform="translate(366,118)">
    <ellipse cx="128" cy="192" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- jalan berliku -->
    <path d="M10 170 Q 70 110 128 140 Q 186 170 246 70"
      stroke="#fde68a" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M10 170 Q 70 110 128 140 Q 186 170 246 70"
