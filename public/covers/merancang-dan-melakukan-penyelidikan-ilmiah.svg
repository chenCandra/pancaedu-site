<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi jalan berliku penyelidikan ilmiah dari hipotesis, eksperimen, sampai kesimpulan dengan pos pemberhentian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="80" cy="80" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="560" cy="300" r="90" fill="#ffffff" fill-opacity="0.07"/>

  <g fill="#fde68a">
    <path transform="translate(560,60) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <circle cx="90" cy="300" r="5" fill="#ec4899"/>
  <circle cx="300" cy="50" r="5" fill="#ffffff"/>

  <!-- jalan berliku -->
  <path d="M60 300 Q 160 180 320 220 Q 480 260 580 110"
    stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M60 300 Q 160 180 320 220 Q 480 260 580 110"
    stroke="#fde047" stroke-width="6" stroke-dasharray="14 16" fill="none" stroke-linecap="round"/>

  <!-- pos 1: hipotesis (lampu) -->
  <g transform="translate(60,300)">
    <circle r="40" fill="#3b82f6"/>
    <circle r="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
    <circle cy="-6" r="14" fill="#fde047"/>
    <rect x="-6" y="8" width="12" height="10" rx="2" fill="#fde047"/>
    <g stroke="#fde047" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-32"/>
      <line x1="14" y1="-18" x2="19" y2="-23"/>
      <line x1="-14" y1="-18" x2="-19" y2="-23"/>
    </g>
  </g>
  <text x="60" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Hipotesis</text>

  <!-- pos 2: eksperimen (tabung reaksi) -->
  <g transform="translate(320,220)">
    <circle r="40" fill="#14b8a6"/>
    <circle r="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M-10 -18 L10 -18 L10 10 Q 10 22 0 22 Q -10 22 -10 10 Z" fill="#ffffff"/>
    <path d="M-9 4 Q 0 10 9 4 L9 10 Q 9 20 0 20 Q -9 20 -9 10 Z" fill="#ec4899"/>
    <circle cx="6" cy="-4" r="3" fill="#5eead4"/>
  </g>
  <text x="320" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Eksperimen</text>

  <!-- pos 3: kesimpulan (centang) -->
  <g transform="translate(580,110)">
    <circle r="44" fill="#22c55e"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M-16 0 L-4 14 L18 -16" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="580" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Kesimpulan</text>

  <!-- karakter kecil melangkah di jalan -->
  <g transform="translate(190,255)">
    <circle cy="-14" r="16" fill="#fde68a"/>
    <circle cx="-5" cy="-16" r="2.5" fill="#1e293b"/>
    <circle cx="5" cy="-16" r="2.5" fill="#1e293b"/>
    <path d="M10 2 Q 0 -14 -10 2 L -10 24 L 10 24 Z" fill="#8b5cf6"/>
  </g>
</svg>
