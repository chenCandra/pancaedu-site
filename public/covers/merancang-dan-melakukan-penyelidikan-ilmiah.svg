    <circle cx="200" cy="40" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="60" cy="60" r="3.5" fill="#f97316" opacity="0.7"/>
    <path d="M280 150 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24"/>
