      <path d="M20 16 L32 16 L32 28 Q32 36 26 36 Q20 36 20 28 Z" fill="none" stroke="#047857" stroke-width="2.2"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Eksperimen</text>
    </g>
