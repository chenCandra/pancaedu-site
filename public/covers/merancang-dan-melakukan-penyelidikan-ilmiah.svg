      <circle cx="26" cy="22" r="10" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
      <rect x="22" y="30" width="8" height="8" rx="2" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Hipotesis</text>
    </g>
    <g transform="translate(104,204)">
