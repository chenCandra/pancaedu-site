    <text x="150" y="84.5" text-anchor="middle" fill="#ffffff">PENYELIDIKAN ILMIAH</text>
  </g>

  <text x="26" y="128" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Merancang &amp; Melakukan</text>
  <text x="26" y="160" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#1b2340">Penyelidikan Ilmiah</text>
  <text x="26" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Langkah demi Langkah Menuju Jawaban</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,204)">
