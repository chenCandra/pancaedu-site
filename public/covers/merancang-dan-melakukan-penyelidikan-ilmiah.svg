    <!-- footprints along the path -->
    <g fill="#b45309" opacity="0.55">
      <ellipse cx="46" cy="150" rx="4" ry="6" transform="rotate(20 46 150)"/>
      <ellipse cx="90" cy="124" rx="4" ry="6" transform="rotate(-10 90 124)"/>
      <ellipse cx="160" cy="150" rx="4" ry="6" transform="rotate(25 160 150)"/>
      <ellipse cx="206" cy="112" rx="4" ry="6" transform="rotate(-20 206 112)"/>
    </g>

