    <g transform="translate(10,170)">
      <circle r="30" fill="url(#pn-post1)"/>
      <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
      <circle cy="-4" r="10" fill="#fde047"/>
      <rect x="-4" y="6" width="8" height="7" rx="1.5" fill="#fde047"/>
      <g stroke="#fde047" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-20" x2="0" y2="-25"/>
        <line x1="10" y1="-14" x2="14" y2="-18"/>
        <line x1="-10" y1="-14" x2="-14" y2="-18"/>
      </g>
    </g>
    <text x="10" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Hipotesis</text>

    <!-- pos 2: eksperimen, teal tabung reaksi -->
    <g transform="translate(128,140)">
      <circle r="30" fill="url(#pn-post2)"/>
      <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
      <path d="M-7 -14 L7 -14 L7 8 Q7 16 0 16 Q-7 16 -7 8 Z" fill="#ffffff"/>
      <path d="M-6 2 Q0 7 6 2 L6 8 Q6 14 0 14 Q-6 14 -6 8 Z" fill="#ec4899"/>
    </g>
    <text x="128" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Eksperimen</text>

    <!-- pos 3: kesimpulan, green check -->
    <g transform="translate(246,70)">
      <circle r="32" fill="url(#pn-post3)"/>
      <circle r="32" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
      <path d="M-12 0 L-3 10 L13 -12" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="246" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">Kesimpulan</text>

