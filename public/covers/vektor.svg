<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="vkBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="vkBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vkBlobGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <marker id="vkAhBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="vkAhGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="vkAhOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#vkBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#vkBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#vkBlobGreen)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="170" height="24" rx="12" fill="#2563eb"/>
    <text x="113" y="84.5" text-anchor="middle" fill="#ffffff">VEKTOR &amp; SKALAR</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Vektor</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">Besaran yang Memiliki Arah dan Nilai</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <line x1="14" y1="34" x2="36" y2="18" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#vkAhOrange)"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Resultan</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M14 26 h18" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 20 l8 6 -8 6" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Arah</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <rect x="14" y="22" width="24" height="8" rx="2" fill="#16a34a"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Besar</text>
    </g>
  </g>

  <!-- hero illustration: colorful vectors combining into a resultant -->
  <g transform="translate(372,118)">
    <ellipse cx="110" cy="196" rx="150" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- faint axis lines -->
    <line x1="10" y1="140" x2="230" y2="140" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="20" x2="60" y2="196" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>

    <!-- origin -->
    <circle cx="60" cy="140" r="6" fill="#ffffff"/>
    <circle cx="60" cy="140" r="6" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

    <!-- vector A: blue -->
    <line x1="60" y1="140" x2="150" y2="70" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#vkAhBlue)"/>
    <text x="156" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#2563eb">A</text>

    <!-- vector B: green -->
    <line x1="60" y1="140" x2="146" y2="188" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#vkAhGreen)"/>
    <text x="150" y="206" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#16a34a">B</text>

    <!-- dashed parallelogram guide, purple -->
    <path d="M150 70 L220 100 L146 188" stroke="#a855f7" stroke-width="2" stroke-dasharray="7 6" opacity="0.6" fill="none"/>

    <!-- resultant vector: bold orange -->
    <line x1="60" y1="140" x2="220" y2="100" stroke="#ea580c" stroke-width="9" stroke-linecap="round" marker-end="url(#vkAhOrange)" opacity="0.95"/>
    <text x="224" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ea580c">R</text>

    <!-- sparkle accents -->
    <path d="M220 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="20" cy="40" r="3.5" fill="#ec4899" opacity="0.75"/>
    <circle cx="200" cy="30" r="3" fill="#fde047" opacity="0.8"/>
  </g>
</svg>
