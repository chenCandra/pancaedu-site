<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="m3bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="m3blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m3glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="m3bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#m3bg)"/>
  <circle cx="540" cy="90" r="190" fill="url(#m3blob)"/>
  <circle cx="90" cy="320" r="140" fill="url(#m3blob)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e3a8a">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="124" height="24" rx="12" fill="#2563eb"/>
    <text x="90" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#1b2340">
    <text x="26" y="110">Momentum, Impuls,</text>
    <text x="26" y="142">dan Hukum Kekekalan</text>
    <text x="26" y="174">Momentum</text>
  </g>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Bekal Wajib Sebelum Tumbukan</text>

  <!-- mini badge chips: p=mv / Impuls / Kekal -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,224)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="18" cy="26" r="7" fill="#1d4ed8"/>
      <line x1="25" y1="26" x2="40" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M34 21 l8 5 l-8 5 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">p=mv</text>
    </g>
    <g transform="translate(104,224)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M29 12 L17 29 h8 l-3 15 14 -19 h-8 z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Impuls</text>
    </g>
    <g transform="translate(182,224)">
      <circle cx="26" cy="26" r="26" fill="#dcfce7"/>
      <path d="M16 26 a10 7 0 1 0 20 0 a10 7 0 1 0 -20 0" fill="none" stroke="#16a34a" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Kekal</text>
    </g>
  </g>

  <!-- hero illustration: boxing glove striking punching bag, impact burst -->
  <g transform="translate(372,118)">
    <ellipse cx="128" cy="195" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- hanging chain -->
    <line x1="190" y1="2" x2="190" y2="44" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <circle cx="190" cy="6" r="5" fill="none" stroke="#9ca3af" stroke-width="3"/>

    <!-- punching bag -->
    <rect x="163" y="44" width="54" height="112" rx="26" fill="url(#m3bag)"/>
    <ellipse cx="190" cy="56" rx="24" ry="8" fill="#ffffff" opacity="0.18"/>
    <g stroke="#1e3a8a" stroke-width="2" opacity="0.5">
      <line x1="172" y1="90" x2="208" y2="90"/>
      <line x1="172" y1="112" x2="208" y2="112"/>
    </g>

    <!-- motion trail behind glove -->
    <path d="M6 150 Q 40 118 70 110" stroke="#f472b6" stroke-width="2.4" stroke-dasharray="3 6" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- boxing glove -->
    <g transform="translate(70,108)">
      <rect x="-18" y="26" width="46" height="26" rx="10" fill="#991b1b"/>
      <circle cx="4" cy="2" r="30" fill="url(#m3glove)"/>
      <circle cx="-16" cy="-10" r="13" fill="url(#m3glove)"/>
      <path d="M-6 -4 Q 4 -14 16 -4" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>
    </g>

    <!-- impact burst -->
    <g transform="translate(130,100)">
      <path d="M0 -22 L6 -6 L22 -10 L10 4 L20 16 L2 10 L-4 24 L-8 8 L-24 10 L-10 -2 L-18 -16 L0 -8 z" fill="#fbbf24" opacity="0.95"/>
      <path d="M0 -22 L6 -6 L22 -10 L10 4 L20 16 L2 10 L-4 24 L-8 8 L-24 10 L-10 -2 L-18 -16 L0 -8 z" fill="none" stroke="#f97316" stroke-width="1.5"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="246" cy="60" r="3.4" fill="#14b8a6" opacity="0.8"/>
    <circle cx="20" cy="40" r="3" fill="#a855f7" opacity="0.7"/>
    <path d="M232 170 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f97316" opacity="0.8"/>
    <circle cx="12" cy="180" r="2.6" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
