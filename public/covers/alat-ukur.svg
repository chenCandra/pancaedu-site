<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi trio alat ukur ceria: penggaris, jangka sorong, dan mikrometer sekrup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="560" cy="60" r="95" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="50" cy="300" r="80" fill="#ffffff" fill-opacity="0.07"/>

  <!-- sparkles -->
  <g fill="#fde68a">
    <path transform="translate(70,70) scale(1.1)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
    <path transform="translate(590,220) scale(0.8)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>
  <!-- confetti -->
  <g>
    <circle cx="120" cy="60" r="6" fill="#ec4899"/>
    <circle cx="250" cy="55" r="5" fill="#ffffff"/>
    <circle cx="400" cy="70" r="6" fill="#fde047"/>
    <circle cx="520" cy="90" r="5" fill="#ec4899"/>
    <circle cx="90" cy="150" r="4" fill="#ffffff"/>
  </g>

  <!-- ground shadows -->
  <ellipse cx="150" cy="275" rx="70" ry="12" fill="#000000" fill-opacity="0.12"/>
  <ellipse cx="330" cy="280" rx="80" ry="12" fill="#000000" fill-opacity="0.12"/>
  <ellipse cx="500" cy="270" rx="65" ry="12" fill="#000000" fill-opacity="0.12"/>

  <!-- Penggaris (biru) -->
  <g transform="translate(150,195) rotate(-7)">
    <rect x="-85" y="-26" width="170" height="52" rx="14" fill="#3b82f6"/>
    <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
      <line x1="-65" y1="-26" x2="-65" y2="-10"/>
      <line x1="-40" y1="-26" x2="-40" y2="-14"/>
      <line x1="-15" y1="-26" x2="-15" y2="-10"/>
      <line x1="10" y1="-26" x2="10" y2="-14"/>
      <line x1="35" y1="-26" x2="35" y2="-10"/>
      <line x1="60" y1="-26" x2="60" y2="-14"/>
    </g>
    <circle cx="-20" cy="4" r="5" fill="#1e3a8a"/>
    <circle cx="10" cy="4" r="5" fill="#1e3a8a"/>
    <path d="M-25 15 Q -5 28 15 15" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- thumbs up blob -->
    <g transform="translate(78,-55) rotate(10)">
      <rect x="-11" y="-6" width="22" height="20" rx="7" fill="#ffffff"/>
      <rect x="-7" y="-23" width="11" height="20" rx="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Jangka sorong (teal) -->
  <g transform="translate(330,200)">
    <rect x="-75" y="-18" width="150" height="34" rx="10" fill="#14b8a6"/>
    <rect x="-70" y="14" width="11" height="55" rx="4" fill="#14b8a6"/>
    <rect x="30" y="14" width="11" height="38" rx="4" fill="#14b8a6"/>
    <rect x="-18" y="38" width="35" height="18" rx="5" fill="#ec4899"/>
    <circle cx="-26" cy="-4" r="4.5" fill="#064e45"/>
    <circle cx="2" cy="-4" r="4.5" fill="#064e45"/>
    <path d="M-30 8 Q -12 18 6 8" stroke="#064e45" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mikrometer sekrup (ungu) -->
  <g transform="translate(500,195)">
    <path d="M-55 45 A 58 58 0 1 1 -55 -45" stroke="#8b5cf6" stroke-width="16" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="-16" width="95" height="32" rx="16" fill="#8b5cf6"/>
    <circle cx="80" cy="0" r="24" fill="#f59e0b"/>
    <circle cx="80" cy="0" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="-8" cy="-2" r="4.5" fill="#ffffff"/>
    <circle cx="18" cy="-2" r="4.5" fill="#ffffff"/>
    <path d="M-12 10 Q 4 19 22 10" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
