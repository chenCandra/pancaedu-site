<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="rulerG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="calG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="micG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">PENGUKURAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Alat Ukur</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Memilih dan Membaca Alat yang Tepat</text>

  <!-- mini badge chips: Panjang / Massa / Waktu -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <rect x="12" y="23" width="28" height="6" rx="3" fill="#2563eb"/>
      <rect x="12" y="23" width="4" height="10" rx="1" fill="#2563eb"/>
      <rect x="22" y="23" width="3" height="8" rx="1" fill="#2563eb"/>
      <rect x="32" y="23" width="3" height="8" rx="1" fill="#2563eb"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Panjang</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <rect x="14" y="30" width="24" height="12" rx="2" fill="#059669"/>
      <rect x="22" y="18" width="8" height="12" rx="1" fill="#059669"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Massa</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <circle cx="26" cy="27" r="11" fill="none" stroke="#d97706" stroke-width="2.4"/>
      <path d="M26 27 L26 19 M26 27 L32 29" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <rect x="23" y="13" width="6" height="4" rx="1" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Waktu</text>
    </g>
  </g>

  <!-- hero illustration: ruler (dominant) + calipers below, clean spacing -->
  <g transform="translate(372,118)">
    <ellipse cx="110" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- ruler, diagonal, dominant -->
    <g transform="rotate(-10)">
      <rect x="0" y="0" width="210" height="36" rx="9" fill="url(#rulerG)"/>
      <g stroke="#ffffff" stroke-width="2.2" opacity="0.9">
        <line x1="18" y1="9" x2="18" y2="27"/>
        <line x1="40" y1="13" x2="40" y2="27"/>
        <line x1="62" y1="9" x2="62" y2="27"/>
        <line x1="84" y1="13" x2="84" y2="27"/>
        <line x1="106" y1="9" x2="106" y2="27"/>
        <line x1="128" y1="13" x2="128" y2="27"/>
        <line x1="150" y1="9" x2="150" y2="27"/>
        <line x1="172" y1="13" x2="172" y2="27"/>
      </g>
      <!-- friendly face at the end of the ruler -->
      <circle cx="192" cy="18" r="3" fill="#1d4ed8"/>
      <circle cx="202" cy="18" r="3" fill="#1d4ed8"/>
      <path d="M190 25 Q197 30 204 25" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- calipers (jangka sorong), well below+left, no overlap -->
    <g transform="translate(4,96)">
      <rect x="0" y="6" width="150" height="15" rx="4" fill="url(#calG)"/>
      <rect x="2" y="21" width="9" height="26" rx="2" fill="#047857"/>
      <rect x="128" y="21" width="9" height="26" rx="2" fill="#047857"/>
      <rect x="50" y="21" width="8" height="18" rx="2" fill="#065f46"/>
      <rect x="2" y="-9" width="9" height="15" rx="2" fill="#047857"/>
      <rect x="50" y="-6" width="8" height="12" rx="2" fill="#065f46"/>
    </g>

    <!-- small micrometer badge, tucked top-right, not overlapping the ruler -->
    <g transform="translate(224,56)">
      <circle cx="0" cy="0" r="22" fill="#ffffff"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#fde68a" stroke-width="2"/>
      <rect x="-4" y="-15" width="8" height="18" rx="3" fill="url(#micG)"/>
      <circle cx="0" cy="8" r="9" fill="url(#micG)"/>
    </g>

    <!-- small magnifying glass, pink accent, bottom-right -->
    <g transform="translate(252,150) rotate(18)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="url(#glassG)" stroke-width="6"/>
      <line x1="11" y1="11" x2="24" y2="24" stroke="url(#glassG)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- tiny dotted measurement line under the ruler, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.55">
      <line x1="2" y1="86" x2="150" y2="68"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M6 -14 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="246" cy="14" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="-14" cy="120" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M190 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
