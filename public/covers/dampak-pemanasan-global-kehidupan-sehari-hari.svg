<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi desa pesisir yang tenang dengan garis air laut yang sedikit naik di dekat pantai, menggambarkan dampak pemanasan global dalam kehidupan sehari-hari">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg4)"/>

  <!-- langit dekorasi -->
  <circle cx="540" cy="70" r="60" fill="#fde68a" opacity="0.5"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="110" cy="70" rx="34" ry="15"/>
    <ellipse cx="135" cy="62" rx="22" ry="13"/>
  </g>

  <!-- daratan -->
  <path d="M0 220 Q 160 195 320 215 T 640 205 L 640 240 L 0 240 Z" fill="#ca8a04" opacity="0.9"/>

  <!-- laut -->
  <rect x="0" y="230" width="640" height="130" fill="#0e7490"/>
  <path d="M0 230 Q 160 218 320 232 T 640 224 L 640 230 Z" fill="#22d3ee" opacity="0.8"/>

  <!-- garis permukaan air yang sedikit naik (penanda) -->
  <line x1="40" y1="246" x2="600" y2="246" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  <text x="560" y="240" fill="#e0f7fa" font-family="sans-serif" font-size="12" opacity="0.85" text-anchor="end">muka air naik</text>

  <!-- ombak kecil -->
  <g stroke="#67e8f9" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M30 280 q 20 10 40 0 t 40 0"/>
    <path d="M400 300 q 20 10 40 0 t 40 0"/>
    <path d="M160 320 q 20 10 40 0 t 40 0"/>
  </g>

  <!-- rumah panggung di tepi pantai -->
  <g transform="translate(180,205)">
    <rect x="-10" y="35" width="8" height="35" fill="#78350f"/>
    <rect x="50" y="35" width="8" height="35" fill="#78350f"/>
    <path d="M-45 -10 L15 -45 L75 -10 Z" fill="#0f766e"/>
    <rect x="-40" y="-10" width="110" height="46" fill="#f0fdfa"/>
    <rect x="-20" y="10" width="26" height="26" rx="3" fill="#38bdf8"/>
    <rect x="40" y="10" width="20" height="22" rx="3" fill="#92400e"/>
  </g>

  <g transform="translate(330,220)">
    <rect x="-8" y="30" width="7" height="28" fill="#78350f"/>
    <rect x="38" y="30" width="7" height="28" fill="#78350f"/>
    <path d="M-35 -8 L12 -34 L58 -8 Z" fill="#115e59"/>
    <rect x="-30" y="-8" width="84" height="38" fill="#ecfeff"/>
    <rect x="-14" y="8" width="20" height="20" rx="3" fill="#38bdf8"/>
  </g>

  <!-- pohon kelapa -->
  <g transform="translate(470,200)">
    <path d="M0 0 Q 4 50 -2 90" stroke="#78350f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#16a34a">
      <path d="M0 0 Q -38 -10 -48 -34 Q -10 -22 0 0 Z"/>
      <path d="M0 0 Q 36 -14 44 -38 Q 8 -24 0 0 Z"/>
      <path d="M0 0 Q -20 -40 -4 -58 Q 10 -34 0 0 Z"/>
      <path d="M0 0 Q 26 -36 14 -58 Q -4 -30 0 0 Z"/>
    </g>
  </g>

  <!-- perahu kecil -->
  <g transform="translate(540,276)">
    <path d="M-30 0 Q 0 16 30 0 L 22 10 Q 0 20 -22 10 Z" fill="#92400e"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#78350f" stroke-width="3"/>
    <path d="M0 -28 L0 -8 L18 -14 Z" fill="#fef3c7"/>
  </g>
</svg>
