<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi desa pesisir yang tenang dengan garis air laut yang sedikit naik di dekat pantai, menggambarkan dampak pemanasan global dalam kehidupan sehari-hari">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="roofTealG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="houseWallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Dampak Keseharian</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Pemanasan Global di Sekitar Kita</text>

  <!-- badge chips: Banjir Rob / Cuaca Ekstrem / Panen -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <path d="M12 30 q 7 6 14 0 t 14 0" stroke="#0e7490" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M12 38 q 7 6 14 0 t 14 0" stroke="#0891b2" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">Banjir Rob</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M14 18 Q20 10 26 16 Q32 10 38 18 Q 36 26 26 24 Q16 26 14 18 Z" fill="#f87171"/>
      <path d="M22 26 q 3 8 0 12" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30 26 q 3 8 0 12" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Cuaca Ekstrem</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 14 Q22 24 22 30 a4 4 0 1 0 8 0 Q30 24 26 14 Z" fill="#ca8a04" transform="rotate(20 26 26) scale(0.9) translate(2,0)"/>
      <path d="M18 36 L34 36" stroke="#92400e" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Panen</text>
    </g>
  </g>

  <!-- hero illustration: desa pesisir tenang -->
  <g transform="translate(340,96)">
    <ellipse cx="130" cy="220" rx="160" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- matahari lembut -->
    <circle cx="230" cy="20" r="22" fill="#fde047" opacity="0.9"/>

    <!-- awan -->
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="40" cy="30" rx="26" ry="12"/>
      <ellipse cx="60" cy="24" rx="18" ry="10"/>
    </g>

    <!-- daratan -->
    <path d="M-30 110 Q 60 92 150 108 T 280 100 L 280 128 L -30 128 Z" fill="#ca8a04" opacity="0.9"/>

    <!-- laut -->
    <rect x="-30" y="120" width="310" height="100" fill="url(#seaG)"/>
    <line x1="0" y1="132" x2="250" y2="132" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

    <g stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M0 160 q 16 8 32 0 t 32 0"/>
      <path d="M150 180 q 16 8 32 0 t 32 0"/>
    </g>

    <!-- rumah panggung -->
    <g transform="translate(60,90)">
      <rect x="-8" y="28" width="7" height="28" fill="#78350f"/>
      <rect x="38" y="28" width="7" height="28" fill="#78350f"/>
      <path d="M-34 -8 L12 -32 L58 -8 Z" fill="url(#roofTealG)"/>
      <rect x="-30" y="-8" width="84" height="36" fill="url(#houseWallG)"/>
      <rect x="-14" y="6" width="20" height="18" rx="3" fill="#38bdf8"/>
      <rect x="20" y="6" width="16" height="18" rx="3" fill="#92400e"/>
    </g>

    <!-- pohon kelapa, hijau segar -->
    <g transform="translate(176,78)">
      <path d="M0 0 Q 4 40 -2 72" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g fill="#16a34a">
        <path d="M0 0 Q -30 -8 -38 -28 Q -8 -18 0 0 Z"/>
        <path d="M0 0 Q 28 -10 34 -30 Q 6 -18 0 0 Z"/>
        <path d="M0 0 Q -16 -32 -4 -46 Q 8 -26 0 0 Z"/>
      </g>
    </g>

    <!-- perahu kecil -->
    <g transform="translate(220,182)">
      <path d="M-24 0 Q 0 13 24 0 L 18 8 Q 0 16 -18 8 Z" fill="#92400e"/>
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#78350f" stroke-width="2.6"/>
      <path d="M0 -22 L0 -6 L14 -11 Z" fill="#fef3c7"/>
    </g>

    <!-- dotted link, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <path d="M-10 110 Q 20 60 60 40" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M250 70 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fb923c" opacity="0.85"/>
    <circle cx="10" cy="60" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
