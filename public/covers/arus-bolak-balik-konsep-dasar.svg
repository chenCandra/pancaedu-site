<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scopeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="plugG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1b2340">
    <text x="26" y="122">Arus Bolak-Balik:</text>
    <text x="26" y="158">Konsep Dasar</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Tegangan dan Arus yang Berubah-ubah</text>

  <!-- mini badge chips: AC / Sinusoidal / Frekuensi -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 26 C17 16 21 36 26 26 C31 16 35 36 40 26" stroke="#2563eb" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">AC</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M11 22 C16 13 20 31 26 22 C32 13 36 31 41 22" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M11 32 C16 23 20 41 26 32 C32 23 36 41 41 32" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">Sinusoidal</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <rect x="14" y="22" width="5" height="12" rx="1.5" fill="#f97316"/>
      <rect x="22" y="15" width="5" height="19" rx="1.5" fill="#f97316"/>
      <rect x="30" y="19" width="5" height="15" rx="1.5" fill="#f97316"/>
      <rect x="38" y="24" width="5" height="10" rx="1.5" fill="#f97316"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Frekuensi</text>
    </g>
  </g>

  <!-- hero illustration: oscilloscope with glowing sine wave + wall plug/socket -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- oscilloscope -->
    <g transform="translate(0,16)">
      <rect x="0" y="0" width="172" height="118" rx="14" fill="url(#scopeG)"/>
      <rect x="14" y="14" width="144" height="70" rx="8" fill="url(#screenG)"/>
      <!-- faint grid -->
      <g stroke="#38bdf8" stroke-width="0.6" opacity="0.25">
        <line x1="50" y1="14" x2="50" y2="84"/>
        <line x1="86" y1="14" x2="86" y2="84"/>
        <line x1="122" y1="14" x2="122" y2="84"/>
        <line x1="14" y1="35" x2="158" y2="35"/>
        <line x1="14" y1="49" x2="158" y2="49"/>
        <line x1="14" y1="63" x2="158" y2="63"/>
      </g>
      <!-- glow wave (behind) -->
      <path d="M20 49 C35 20 50 78 65 49 C80 20 95 78 110 49 C125 20 140 78 150 49" stroke="#22d3ee" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.35"/>
      <!-- crisp sine wave -->
      <path d="M20 49 C35 20 50 78 65 49 C80 20 95 78 110 49 C125 20 140 78 150 49" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- knobs -->
      <circle cx="28" cy="100" r="7" fill="#fbbf24"/>
      <circle cx="52" cy="100" r="7" fill="#f97316"/>
      <circle cx="148" cy="100" r="4" fill="#4ade80"/>
      <rect x="70" y="94" width="56" height="12" rx="6" fill="#0f172a"/>
    </g>

    <!-- wall socket + plug, lower right, non-overlapping -->
    <g transform="translate(196,154)">
      <rect x="0" y="0" width="64" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="16" y="14" width="8" height="22" rx="4" fill="#475569"/>
      <rect x="40" y="14" width="8" height="22" rx="4" fill="#475569"/>
      <!-- plug -->
      <g transform="translate(-46,10) rotate(-8)">
        <rect x="0" y="0" width="34" height="32" rx="7" fill="url(#plugG)"/>
        <rect x="8" y="30" width="6" height="13" rx="2" fill="#92400e"/>
        <rect x="22" y="30" width="6" height="13" rx="2" fill="#92400e"/>
      </g>
      <!-- lightning spark -->
      <path d="M62 -14 l-9 14 6 0 -5 12 14 -16 -7 0 z" fill="#f97316" opacity="0.9"/>
    </g>

    <!-- decorative dashed AC ripple under scope -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <path d="M4 146 C 30 138, 50 154, 76 146 S 122 138, 148 146" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M160 2 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="14" cy="4" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <circle cx="268" cy="94" r="3" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
