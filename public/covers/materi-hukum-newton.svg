<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="nf-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="nf-ah-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fde047"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="100" cy="50" r="3"/>
    <circle cx="150" cy="90" r="2"/>
    <circle cx="520" cy="60" r="3"/>
    <circle cx="470" cy="100" r="2"/>
    <circle cx="80" cy="140" r="2"/>
    <circle cx="560" cy="150" r="2.5"/>
  </g>
  <path d="M440 50 l4 10 11 1 -8 7 2 11 -9 -6 -9 6 2 -11 -8 -7 11 -1 z" fill="#fde047" opacity="0.85"/>

  <!-- ground -->
  <rect x="0" y="310" width="640" height="50" fill="#1d4ed8" opacity="0.4"/>
  <ellipse cx="320" cy="312" rx="300" ry="16" fill="#1e3a8a" opacity="0.3"/>

  <!-- rocket exhaust flame (action: rocket pushes gas down) -->
  <g>
    <path d="M300 250 Q320 330 340 250 Q330 270 320 268 Q310 270 300 250 Z" fill="#f97316"/>
    <path d="M308 250 Q320 305 332 250 Q326 262 320 260 Q314 262 308 250 Z" fill="#fde047"/>
  </g>

  <!-- rocket body -->
  <g>
    <ellipse cx="320" cy="256" rx="30" ry="12" fill="#0f172a" opacity="0.2"/>
    <path d="M296 250 L296 150 Q296 100 320 72 Q344 100 344 150 L344 250 Z" fill="#ef4444"/>
    <path d="M296 190 L344 190 L344 250 L296 250 Z" fill="#f8fafc"/>
    <!-- window -->
    <circle cx="320" cy="150" r="18" fill="#60a5fa"/>
    <circle cx="320" cy="150" r="18" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- fins -->
    <path d="M296 220 L266 260 L296 254 Z" fill="#fde047"/>
    <path d="M344 220 L374 260 L344 254 Z" fill="#fde047"/>
    <!-- stripe -->
    <rect x="296" y="210" width="48" height="10" fill="#1e293b"/>
  </g>

  <!-- action-reaction force arrows -->
  <!-- reaction: thrust pushes rocket UP -->
  <line x1="390" y1="230" x2="390" y2="140" stroke="#ef4444" stroke-width="9" stroke-linecap="round" marker-end="url(#nf-ah-red)"/>
  <text x="400" y="150" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="bold">F aksi</text>

  <!-- action: rocket pushes gas DOWN -->
  <line x1="250" y1="180" x2="250" y2="270" stroke="#fde047" stroke-width="9" stroke-linecap="round" marker-end="url(#nf-ah-yellow)"/>
  <text x="150" y="265" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="bold">F reaksi</text>

  <!-- motion streak lines beside rocket -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="450" y1="120" x2="450" y2="150"/>
    <line x1="470" y1="150" x2="470" y2="190"/>
    <line x1="430" y1="190" x2="430" y2="220"/>
  </g>
</svg>
