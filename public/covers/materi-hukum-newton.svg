<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="nwBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="nwBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nwBlobRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nwBodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="nwFlameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <marker id="nwAhBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="nwAhOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#nwBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#nwBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#nwBlobRed)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="120" height="24" rx="12" fill="#2563eb"/>
    <text x="88" y="84.5" text-anchor="middle" fill="#ffffff">DINAMIKA</text>
  </g>

  <!-- title -->
  <text x="26" y="108" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Hukum Newton</text>
  <text x="26" y="150" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">tentang Gerak</text>
  <text x="26" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#b91c1c">Tiga Hukum Dasar tentang Gerak Benda</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,212)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">I</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Hukum I</text>
    </g>
    <g transform="translate(104,212)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#991b1b">II</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Hukum II</text>
    </g>
    <g transform="translate(182,212)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#92400e">III</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Hukum III</text>
    </g>
  </g>

  <!-- hero illustration: rocket launch with aksi-reaksi forces -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="196" rx="140" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- starfield -->
    <g fill="#1b2340" opacity="0.35">
      <circle cx="20" cy="10" r="2"/><circle cx="60" cy="24" r="1.6"/>
      <circle cx="230" cy="18" r="2"/><circle cx="210" cy="40" r="1.6"/>
    </g>
    <path d="M200 -4 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fde047" opacity="0.9"/>

    <!-- exhaust flame -->
    <path d="M94 148 Q110 198 126 148 Q118 168 110 166 Q102 168 94 148 Z" fill="url(#nwFlameG)"/>
    <path d="M100 148 Q110 180 120 148 Q114 158 110 157 Q106 158 100 148 Z" fill="#fde68a"/>

    <!-- rocket body -->
    <ellipse cx="110" cy="152" rx="20" ry="8" fill="#1b2340" opacity="0.15"/>
    <path d="M90 148 L90 72 Q90 38 110 20 Q130 38 130 72 L130 148 Z" fill="url(#nwBodyG)"/>
    <rect x="90" y="110" width="40" height="38" fill="#f8fafc"/>
    <circle cx="110" cy="72" r="11" fill="#93c5fd"/>
    <circle cx="110" cy="72" r="11" fill="none" stroke="#1b2340" stroke-width="2"/>
    <path d="M90 122 L58 150 L90 144 Z" fill="#fde047"/>
    <path d="M130 122 L162 150 L130 144 Z" fill="#fde047"/>
    <rect x="90" y="104" width="40" height="7" fill="#1b2340"/>

    <!-- aksi / reaksi force arrows -->
    <line x1="170" y1="150" x2="170" y2="76" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#nwAhBlue)"/>
    <text x="178" y="94" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">F aksi</text>

    <line x1="52" y1="96" x2="52" y2="152" stroke="#ea580c" stroke-width="7" stroke-linecap="round" marker-end="url(#nwAhOrange)"/>
    <text x="2" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">F reaksi</text>

    <!-- sparkle accents -->
    <circle cx="246" cy="130" r="3.5" fill="#14b8a6" opacity="0.8"/>
    <circle cx="14" cy="60" r="3" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
