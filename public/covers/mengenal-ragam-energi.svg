<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)"/>
  <circle cx="40" cy="40" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="600" cy="330" r="90" fill="#ffffff" opacity="0.07"/>

  <!-- badge backgrounds -->
  <circle cx="150" cy="115" r="64" fill="#fff7ed"/>
  <circle cx="320" cy="95" r="64" fill="#fff7ed"/>
  <circle cx="490" cy="115" r="64" fill="#fff7ed"/>
  <circle cx="230" cy="255" r="64" fill="#fff7ed"/>
  <circle cx="410" cy="255" r="64" fill="#fff7ed"/>

  <!-- 1 battery: energi kimia -->
  <g transform="translate(150,115)">
    <rect x="-8" y="-38" width="16" height="10" rx="2" fill="#1e3a8a"/>
    <rect x="-24" y="-30" width="48" height="60" rx="10" fill="#16a34a"/>
    <polygon points="4,-16 -10,8 -2,8 -6,24 10,0 2,0" fill="#fde047"/>
  </g>

  <!-- 2 potential: ball on arc -->
  <g transform="translate(320,95)">
    <path d="M-30 20 Q0 -30 30 20" fill="none" stroke="#9ca3af" stroke-width="4" stroke-dasharray="5 6" stroke-linecap="round"/>
    <circle cx="-30" cy="20" r="11" fill="#ef4444"/>
    <circle cx="24" cy="-4" r="5" fill="#ef4444" opacity="0.4"/>
  </g>

  <!-- 3 kinetic: car -->
  <g transform="translate(490,123)">
    <rect x="-34" y="-10" width="68" height="22" rx="8" fill="#f97316"/>
    <path d="M-20 -10 L-10 -26 L18 -26 L28 -10 Z" fill="#fb923c"/>
    <rect x="-6" y="-22" width="18" height="12" fill="#bae6fd"/>
    <circle cx="-18" cy="14" r="10" fill="#374151"/>
    <circle cx="18" cy="14" r="10" fill="#374151"/>
    <path d="M-46 -4 h-10 M-50 4 h-10" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- 4 electric: lightbulb -->
  <g transform="translate(230,255)">
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-46" x2="0" y2="-56"/>
      <line x1="26" y1="-30" x2="34" y2="-38"/>
      <line x1="-26" y1="-30" x2="-34" y2="-38"/>
    </g>
    <circle cy="-16" r="26" fill="#fde047"/>
    <rect x="-10" y="6" width="20" height="16" fill="#9ca3af"/>
    <rect x="-10" y="22" width="20" height="6" fill="#6b7280"/>
    <path d="M-8 -22 L4 -10 L-4 -10 L8 2" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5 thermal: flame -->
  <g transform="translate(410,255)">
    <path d="M0 -34 C16 -14 18 4 6 18 C10 6 2 0 0 6 C-2 0 -10 6 -6 18 C-18 4 -16 -14 0 -34 Z" fill="#ef4444"/>
    <path d="M0 -14 C8 -4 9 6 2 12 C4 4 0 2 0 4 C0 2 -4 4 -2 12 C-9 6 -8 -4 0 -14 Z" fill="#fde047"/>
  </g>
</svg>
