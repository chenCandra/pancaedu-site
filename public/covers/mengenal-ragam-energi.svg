<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="battG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ballG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bulbG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG2)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="163" height="24" rx="12" fill="#fbbf24"/>
    <text x="109.5" y="84.5" text-anchor="middle" fill="#ffffff">BENTUK ENERGI</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Bentuk-bentuk Energi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Kinetik, Termal, Listrik, dan Kimia</text>

  <!-- mini badge chips: Listrik / Panas / Gerak -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fef9c3"/>
      <polygon points="30,8 14,30 24,30 20,46 38,22 27,22" fill="#ca8a04"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Listrik</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M26 10 C34 20 36 30 28 38 C31 30 24 27 26 32 C28 27 21 30 24 38 C16 30 18 20 26 10 Z" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Panas</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="18" cy="26" r="6" fill="#2563eb"/>
      <path d="M26 20 L36 26 L26 32" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Gerak</text>
    </g>
  </g>

  <!-- hero illustration: colorful energy "sampler" cluster -->
  <g>
    <ellipse cx="480" cy="322" rx="165" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- battery -->
    <g transform="translate(455,185)">
      <rect x="-14" y="-40" width="28" height="12" rx="3" fill="#047857"/>
      <rect x="-30" y="-28" width="60" height="62" rx="12" fill="url(#battG2)"/>
      <polygon points="6,-14 -12,8 -3,8 -8,26 12,0 2,0" fill="#fde047"/>
    </g>

    <!-- bouncing ball -->
    <g transform="translate(560,150)">
      <path d="M-40 20 Q0 -28 40 20" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-dasharray="4 7" stroke-linecap="round"/>
      <circle r="24" fill="url(#ballG2)"/>
      <circle cx="-7" cy="-7" r="6" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- lightbulb -->
    <g transform="translate(560,260)">
      <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-38" x2="0" y2="-46"/>
        <line x1="22" y1="-26" x2="28" y2="-32"/>
        <line x1="-22" y1="-26" x2="-28" y2="-32"/>
      </g>
      <circle cy="-14" r="24" fill="url(#bulbG2)"/>
      <rect x="-9" y="6" width="18" height="14" fill="#9ca3af"/>
      <rect x="-9" y="20" width="18" height="6" fill="#6b7280"/>
      <path d="M-7 -20 L4 -9 L-4 -9 L7 2" stroke="#b45309" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- flame -->
    <g transform="translate(430,280)">
      <path d="M0 -30 C14 -12 16 4 5 16 C9 5 2 0 0 5 C-2 0 -9 5 -5 16 C-16 4 -14 -12 0 -30 Z" fill="url(#flameG2)"/>
      <path d="M0 -12 C7 -3 8 5 2 10 C4 3 0 2 0 3 C0 2 -4 3 -2 10 C-8 5 -7 -3 0 -12 Z" fill="#fde047"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M612 112 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#2563eb" opacity="0.8"/>
    <g stroke="#a855f7" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.55">
      <line x1="362" y1="208" x2="362" y2="258"/>
    </g>
    <circle cx="475" cy="320" r="4" fill="#14b8a6" opacity="0.7"/>
    <circle cx="492" cy="330" r="2.6" fill="#14b8a6" opacity="0.6"/>
  </g>
</svg>
