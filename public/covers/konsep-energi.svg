<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="battG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint1)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG1)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG1)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="152" height="24" rx="12" fill="#fbbf24"/>
    <text x="104" y="84.5" text-anchor="middle" fill="#ffffff">KONSEP DASAR</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Konsep Energi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Definisi dan Hukum Kekekalan Energi</text>

  <!-- mini badge chips: Kimia / Kinetik / Potensial -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <rect x="14" y="14" width="24" height="28" rx="4" fill="#059669"/>
      <rect x="21" y="10" width="10" height="6" rx="2" fill="#059669"/>
      <polygon points="29,18 20,30 25,30 22,38 32,26 27,26" fill="#fde047"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Kimia</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <circle cx="20" cy="26" r="7" fill="#ea580c"/>
      <path d="M30 18 L38 26 L30 34" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="14" y1="16" x2="18" y2="16" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="36" x2="16" y2="36" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Kinetik</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <path d="M10 34 Q26 8 42 34" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="3 4" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="30" r="7" fill="#7c3aed"/>
      <circle cx="34" cy="14" r="3" fill="#a855f7" opacity="0.7"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Potensial</text>
    </g>
  </g>

  <!-- hero illustration -->
  <g>
    <ellipse cx="480" cy="322" rx="165" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sun -->
    <g transform="translate(430,140)">
      <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9">
        <line x1="0" y1="-50" x2="0" y2="-40"/>
        <line x1="0" y1="50" x2="0" y2="40"/>
        <line x1="-50" y1="0" x2="-40" y2="0"/>
        <line x1="50" y1="0" x2="40" y2="0"/>
        <line x1="-35" y1="-35" x2="-28" y2="-28"/>
        <line x1="35" y1="-35" x2="28" y2="-28"/>
        <line x1="-35" y1="35" x2="-28" y2="28"/>
        <line x1="35" y1="35" x2="28" y2="28"/>
      </g>
      <circle r="36" fill="url(#sunG1)"/>
      <circle cx="-11" cy="-4" r="4" fill="#78350f"/>
      <circle cx="11" cy="-4" r="4" fill="#78350f"/>
      <path d="M-12 10 Q0 20 12 10" stroke="#78350f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- battery -->
    <g transform="translate(555,155)">
      <rect x="-14" y="-56" width="28" height="14" rx="4" fill="#1d4ed8"/>
      <rect x="-34" y="-44" width="68" height="112" rx="14" fill="url(#battG1)"/>
      <rect x="-27" y="-37" width="54" height="98" rx="9" fill="#93c5fd" opacity="0.35"/>
      <polygon points="6,-24 -16,10 -4,10 -10,36 18,-2 2,-2" fill="#fde047"/>
    </g>

    <!-- running kid -->
    <g transform="translate(355,300) scale(0.78)">
      <path d="M-6 0 Q-30 10 -44 36" stroke="#15803d" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M10 0 Q30 -6 46 24" stroke="#16a34a" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="-44" cy="40" r="9" fill="#374151"/>
      <circle cx="46" cy="28" r="9" fill="#374151"/>
      <path d="M-16 -70 Q0 -80 16 -70 L18 2 Q0 12 -18 2 Z" fill="#ef4444"/>
      <path d="M-14 -58 Q-40 -50 -48 -22" stroke="#f3b985" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M14 -58 Q38 -78 34 -104" stroke="#f3b985" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="2" cy="-96" r="22" fill="#f3b985"/>
      <path d="M-20 -100 Q0 -122 22 -100 Q22 -112 0 -116 Q-20 -112 -20 -100 Z" fill="#4b3621"/>
      <circle cx="-6" cy="-98" r="3" fill="#1f2937"/>
      <circle cx="10" cy="-98" r="3" fill="#1f2937"/>
      <path d="M-6 -88 Q2 -84 10 -88" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M606 118 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="352" cy="188" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="340" cy="204" r="2.6" fill="#a855f7" opacity="0.6"/>
    <path d="M525 300 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f472b6" opacity="0.85"/>
    <g stroke="#f59e0b" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="470" y1="95" x2="518" y2="95"/>
    </g>
  </g>
</svg>
