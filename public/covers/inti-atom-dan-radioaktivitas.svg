<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint9" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG9" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="protonG9" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="neutronG9" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="glowG9" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint9)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG9)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG9)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Inti Atom dan</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Radioaktivitas</text>
  <text x="26" y="192" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4338ca">Peluruhan, Waktu Paruh, dan Energi Ikat Inti</text>

  <!-- mini badge chips: Inti Atom / Peluruhan / Waktu Paruh -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <circle cx="21" cy="22" r="6" fill="#dc2626"/>
      <circle cx="31" cy="22" r="6" fill="#1d4ed8"/>
      <circle cx="26" cy="31" r="6" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">Inti Atom</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <circle cx="20" cy="26" r="7" fill="#059669"/>
      <g stroke="#059669" stroke-width="1.8" stroke-linecap="round">
        <line x1="29" y1="20" x2="40" y2="12"/>
        <line x1="31" y1="26" x2="42" y2="26"/>
        <line x1="29" y1="32" x2="40" y2="40"/>
      </g>
      <text x="26" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Peluruhan</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 15 A11 11 0 1 1 15 26" fill="none" stroke="#d97706" stroke-width="2.2"/>
      <path d="M26 15 L26 22 L31 25" stroke="#d97706" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">Waktu Paruh</text>
    </g>
  </g>

  <!-- hero illustration: nucleus cluster + radiating decay lines -->
  <g transform="translate(372,112)">
    <ellipse cx="118" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <circle cx="118" cy="110" r="70" fill="url(#glowG9)"/>

    <!-- radiating decay lines -->
    <g stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="118" y1="110" x2="40" y2="50" stroke="#f59e0b"/>
      <line x1="118" y1="110" x2="200" y2="40" stroke="#22c55e"/>
      <line x1="118" y1="110" x2="210" y2="130" stroke="#f59e0b"/>
      <line x1="118" y1="110" x2="40" y2="170" stroke="#22c55e"/>
    </g>
    <circle cx="40" cy="50" r="4" fill="#f59e0b"/>
    <circle cx="200" cy="40" r="4" fill="#22c55e"/>
    <circle cx="210" cy="130" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="170" r="4" fill="#22c55e"/>

    <!-- nucleus cluster -->
    <circle cx="108" cy="100" r="15" fill="url(#protonG9)"/>
    <circle cx="130" cy="98" r="15" fill="url(#neutronG9)"/>
    <circle cx="118" cy="118" r="15" fill="url(#neutronG9)"/>
    <circle cx="96" cy="120" r="13" fill="url(#protonG9)"/>
    <circle cx="138" cy="118" r="13" fill="url(#protonG9)"/>
    <circle cx="118" cy="95" r="12" fill="url(#neutronG9)"/>

    <!-- sparkle accents -->
    <path d="M225 95 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#a855f7" opacity="0.8"/>
    <circle cx="20" cy="110" r="3.5" fill="#14b8a6" opacity="0.7"/>
  </g>
</svg>
