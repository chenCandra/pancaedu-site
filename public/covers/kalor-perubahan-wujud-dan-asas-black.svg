<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="iceG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="heatG2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG2)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#fed7aa" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f97316" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fed7aa" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#ffedd5"/>
    <text x="493" y="32" text-anchor="middle" fill="#9a3412">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="188" height="24" rx="12" fill="#f97316"/>
    <text x="122" y="84.5" text-anchor="middle" fill="#ffffff">TERMODINAMIKA</text>
  </g>

  <!-- title (2 lines, long title) -->
  <text x="26" y="122" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">Kalor, Perubahan Wujud,</text>
  <text x="26" y="156" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">dan Asas Black</text>
  <text x="26" y="182" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9a3412">Asas Black: Kalor Lepas = Kalor Terima</text>

  <!-- mini badge chips: Kalor / Asas Black / Wujud -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,216)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M26 12 C19 20 16 28 20 34 C19 29 23 26 24 29 C26 24 31 28 29 34 C34 28 32 19 26 12 Z" fill="#f97316"/>
      <path d="M26 22 C23 26 22 30 24 33 C24 30 26 29 27 31 C28 29 30 31 29 33 C31 30 30 25 26 22 Z" fill="#fbbf24"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Kalor</text>
    </g>
    <g transform="translate(104,216)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M12 21 h18 m-5 -4.5 l5 4.5 -5 4.5" stroke="#2563eb" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 31 h-18 m5 -4.5 l-5 4.5 5 4.5" stroke="#2563eb" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Asas Black</text>
    </g>
    <g transform="translate(182,216)">
      <circle cx="26" cy="26" r="26" fill="#f3e8ff"/>
      <rect x="15" y="31" width="9" height="9" rx="1.5" fill="#7c3aed"/>
      <path d="M26 40 q4 -8 0 -14 q-4 6 0 14 z" fill="#a855f7"/>
      <circle cx="35" cy="17" r="1.8" fill="#7c3aed"/>
      <circle cx="31" cy="12" r="1.4" fill="#7c3aed"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Wujud</text>
    </g>
  </g>

  <!-- hero illustration: ice melting in a glass of warm water, heat arrows blue->red -->
  <g transform="translate(372,118)">
    <ellipse cx="130" cy="192" rx="140" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- glass outline -->
    <path d="M50 38 L150 38 L140 184 Q138 192 128 192 L72 192 Q62 192 60 184 Z" fill="#ffffff" opacity="0.35" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- warm water fill -->
    <path d="M54 78 Q100 68 146 78 L140 184 Q138 192 128 192 L72 192 Q62 192 60 184 Z" fill="url(#waterG2)"/>
    <ellipse cx="100" cy="78" rx="46" ry="6" fill="#ffffff" opacity="0.28"/>

    <!-- ripples around the ice -->
    <ellipse cx="100" cy="79" rx="34" ry="5" fill="none" stroke="#0ea5e9" stroke-width="1.4" opacity="0.35"/>
    <ellipse cx="100" cy="79" rx="46" ry="7" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.2"/>

    <!-- ice cube, floating, melting -->
    <g transform="translate(96,58) rotate(10)">
      <rect x="-20" y="-20" width="40" height="40" rx="5" fill="url(#iceG2)" stroke="#ffffff" stroke-width="2"/>
      <path d="M-10 -12 L2 -2 M5 5 L14 12" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <path d="M114 92 q4 7 0 12 q-4 -5 0 -12 z" fill="#38bdf8"/>

    <!-- heat-transfer arrows, blue to red -->
    <g>
      <path d="M18 142 Q40 122 60 102" stroke="url(#heatG2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 102 l-11 1 l5 10 z" fill="#3b82f6"/>
      <path d="M182 150 Q156 126 130 104" stroke="url(#heatG2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M130 104 l11 2 l-6 10 z" fill="#3b82f6"/>
      <path d="M100 188 Q98 152 97 114" stroke="url(#heatG2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M97 114 l-6 10 l12 1 z" fill="#3b82f6"/>
    </g>

    <!-- sparkle accents, varied colors -->
    <path d="M232 20 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="246" cy="86" r="4" fill="#a855f7" opacity="0.75"/>
    <circle cx="10" cy="48" r="3.5" fill="#14b8a6" opacity="0.75"/>
    <path d="M18 184 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
