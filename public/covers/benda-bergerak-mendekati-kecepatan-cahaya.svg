<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="blobG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gaugeG4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glowG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint4)"/>
  <circle cx="545" cy="80" r="190" fill="url(#blobG4)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG4)"/>
  <rect width="640" height="360" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#6366f1" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#c7d2fe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#e0e7ff"/>
    <text x="493" y="32" text-anchor="middle" fill="#3730a3">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#ede9fe"/>
    <text x="572" y="32" text-anchor="middle" fill="#5b21b6">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="176" height="24" rx="12" fill="#6366f1"/>
    <text x="116" y="84.5" text-anchor="middle" fill="#ffffff">FISIKA MODERN</text>
  </g>

  <!-- title -->
  <text x="26" y="116" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2340">Apa yang Terjadi Jika</text>
  <text x="26" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2340">Benda Bergerak Mendekati</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2340">Kecepatan Cahaya?</text>
  <text x="26" y="188" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4338ca">Dua Sudut Pandang yang Sangat Berbeda</text>

  <!-- mini badge chips: Kecepatan Cahaya / Energi Tak Hingga / Batas Alam -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M14 26 L38 26" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30 20 L38 26 L30 32" stroke="#d97706" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Kec. Cahaya</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M26 14 L20 28 L26 28 L22 38 L34 22 L27 22 Z" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="8.3" font-weight="700" fill="#991b1b">Energi Tak Hingga</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#e0e7ff"/>
      <path d="M14 26 a12 12 0 1 1 24 0" fill="none" stroke="#4338ca" stroke-width="2.4"/>
      <line x1="26" y1="26" x2="34" y2="16" stroke="#4338ca" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#312e81">Batas Alam</text>
    </g>
  </g>

  <!-- hero illustration: speedometer gauge approaching c -->
  <g transform="translate(372,122)">
    <ellipse cx="118" cy="186" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <circle cx="118" cy="100" r="60" fill="url(#glowG4)"/>

    <path d="M48 120 A70 70 0 0 1 188 120" fill="none" stroke="url(#gaugeG4)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="118" cy="120" r="50" fill="#ffffff"/>

    <!-- tick marks -->
    <g stroke="#475569" stroke-width="2" stroke-linecap="round">
      <line x1="68" y1="120" x2="75" y2="120"/>
      <line x1="80" y1="82" x2="86" y2="87"/>
      <line x1="118" y1="68" x2="118" y2="75"/>
      <line x1="156" y1="82" x2="150" y2="87"/>
      <line x1="168" y1="120" x2="161" y2="120"/>
    </g>
    <text x="168" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2626">c</text>

    <!-- needle, close to c -->
    <g transform="translate(118,120) rotate(68)">
      <path d="M0 0 L-44 -5 L-44 5 Z" fill="#1b2340"/>
    </g>
    <circle cx="118" cy="120" r="7" fill="#1b2340"/>

    <text x="118" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">v mendekati c</text>

    <!-- light-burst accent -->
    <path d="M196 60 l4 9 9 1 -7 6 1.5 9 -7.5 -5 -7.5 5 1.5 -9 -7 -6 9 -1 z" fill="#fde047" opacity="0.9"/>
    <circle cx="40" cy="60" r="4" fill="#14b8a6" opacity="0.7"/>
    <circle cx="206" cy="150" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
