<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi globe Bumi ceria dengan termometer di sampingnya dan sinar matahari hangat, menggambarkan pemanasan global">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg2)"/>

  <!-- dekorasi lembut -->
  <circle cx="560" cy="80" r="80" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="300" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="110" cy="60" r="14" fill="#ffffff" opacity="0.18"/>

  <!-- matahari di belakang -->
  <circle cx="470" cy="100" r="60" fill="#fde68a" opacity="0.85"/>
  <g stroke="#fde68a" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <line x1="470" y1="20" x2="470" y2="2"/>
    <line x1="550" y1="100" x2="568" y2="100"/>
    <line x1="528" y1="42" x2="542" y2="28"/>
    <line x1="528" y1="158" x2="542" y2="172"/>
    <line x1="412" y1="42" x2="398" y2="28"/>
  </g>

  <!-- awan kecil -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="90" cy="110" rx="30" ry="14"/>
    <ellipse cx="112" cy="102" rx="20" ry="12"/>
  </g>

  <!-- globe -->
  <g transform="translate(290,190)">
    <circle r="110" fill="#38bdf8"/>
    <!-- benua -->
    <path d="M-70 -30 Q -40 -60 0 -45 Q 30 -35 20 -5 Q 0 10 -30 5 Q -65 0 -70 -30 Z" fill="#22c55e"/>
    <path d="M30 20 Q 60 10 80 35 Q 85 60 60 70 Q 30 75 20 50 Q 15 30 30 20 Z" fill="#16a34a"/>
    <path d="M-50 50 Q -20 45 -15 70 Q -25 90 -55 85 Q -75 70 -50 50 Z" fill="#22c55e"/>
    <!-- highlight -->
    <ellipse cx="-35" cy="-55" rx="40" ry="20" fill="#ffffff" opacity="0.18"/>
    <!-- wajah ceria -->
    <circle cx="-18" cy="-6" r="6" fill="#0c4a6e"/>
    <circle cx="14" cy="-10" r="6" fill="#0c4a6e"/>
    <path d="M-18 14 Q -2 30 16 12" stroke="#0c4a6e" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- garis panas di sekitar globe -->
  <g stroke="#fca5a5" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M190 60 Q 210 40 230 55" fill="none"/>
    <path d="M400 60 Q 420 40 440 55" fill="none"/>
    <path d="M420 300 Q 440 285 455 300" fill="none"/>
  </g>

  <!-- termometer -->
  <g transform="translate(470,220)">
    <rect x="-13" y="-110" width="26" height="150" rx="13" fill="#fef3c7"/>
    <circle r="30" cy="55" fill="#fef3c7"/>
    <rect x="-7" y="-95" width="14" height="140" rx="7" fill="#e5e7eb"/>
    <rect x="-7" y="-20" width="14" height="65" rx="7" fill="#ef4444"/>
    <circle r="22" cy="55" fill="#ef4444"/>
    <g stroke="#9ca3af" stroke-width="2">
      <line x1="10" y1="-80" x2="16" y2="-80"/>
      <line x1="10" y1="-50" x2="16" y2="-50"/>
      <line x1="10" y1="-20" x2="16" y2="-20"/>
      <line x1="10" y1="10" x2="16" y2="10"/>
    </g>
  </g>

  <!-- kilau -->
  <g fill="#fef3c7" opacity="0.9">
    <circle cx="150" cy="200" r="3"/>
    <circle cx="540" cy="150" r="2.5"/>
    <circle cx="400" cy="300" r="2"/>
  </g>
</svg>
