<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi globe Bumi ceria dengan termometer di sampingnya dan sinar matahari hangat, menggambarkan pemanasan global">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="thermoG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Pemanasan Global</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Bumi yang Makin Hangat, Apa Dampaknya?</text>

  <!-- badge chips: Suhu Naik / Global / Dampak -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M26 14 Q22 24 22 30 a4 4 0 1 0 8 0 Q30 24 26 14 Z" fill="#dc2626"/>
      <path d="M20 12 L24 8 M32 12 L28 8" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Suhu Naik</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <ellipse cx="26" cy="26" rx="4.5" ry="11" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
      <line x1="15" y1="26" x2="37" y2="26" stroke="#1d4ed8" stroke-width="1.6"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Global</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M26 14 L34 30 H18 Z" fill="#d97706"/>
      <rect x="23" y="20" width="6" height="7" fill="#fff7e6"/>
      <circle cx="26" cy="29" r="1.6" fill="#fff7e6"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Dampak</text>
    </g>
  </g>

  <!-- hero illustration: globe + thermometer, central and iconic -->
  <g transform="translate(372,110)">
    <ellipse cx="90" cy="206" rx="150" ry="18" fill="#1b2340" opacity="0.08"/>

    <!-- matahari di belakang -->
    <circle cx="200" cy="14" r="26" fill="url(#sunG)"/>
    <g stroke="#fde047" stroke-width="3.4" stroke-linecap="round" opacity="0.85">
      <line x1="200" y1="-20" x2="200" y2="-30"/>
      <line x1="236" y1="14" x2="246" y2="14"/>
      <line x1="221" y1="-9" x2="229" y2="-17"/>
      <line x1="221" y1="37" x2="229" y2="45"/>
    </g>

    <!-- globe, dominant, centered -->
    <g transform="translate(70,110)">
      <circle r="78" fill="url(#globeG)"/>
      <path d="M-50 -20 Q -28 -42 0 -32 Q 22 -24 14 -2 Q 0 8 -20 4 Q -46 0 -50 -20 Z" fill="#22c55e"/>
      <path d="M22 16 Q 44 8 58 26 Q 60 44 42 50 Q 22 54 14 36 Q 10 22 22 16 Z" fill="#16a34a"/>
      <ellipse cx="-24" cy="-38" rx="28" ry="14" fill="#ffffff" opacity="0.18"/>
      <circle cx="-14" cy="-4" r="5" fill="#0c4a6e"/>
      <circle cx="12" cy="-6" r="5" fill="#0c4a6e"/>
      <path d="M-14 12 Q 0 24 14 10" stroke="#0c4a6e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-24" cy="6" rx="6" ry="3.4" fill="#f472b6" opacity="0.55"/>
      <ellipse cx="30" cy="4" rx="6" ry="3.4" fill="#f472b6" opacity="0.55"/>
    </g>

    <!-- garis panas -->
    <g stroke="#fca5a5" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M-20 60 Q 0 40 20 55" fill="none"/>
      <path d="M-30 150 Q -10 135 6 150" fill="none"/>
    </g>

    <!-- termometer -->
    <g transform="translate(236,130)">
      <rect x="-11" y="-92" width="22" height="118" rx="11" fill="#fff7e6"/>
      <circle r="24" cy="46" fill="#fff7e6"/>
      <rect x="-6" y="-80" width="12" height="112" rx="6" fill="#e5e7eb"/>
      <rect x="-6" y="-18" width="12" height="50" rx="6" fill="url(#thermoG)"/>
      <circle r="17" cy="46" fill="url(#thermoG)"/>
      <g stroke="#9ca3af" stroke-width="1.8">
        <line x1="8" y1="-66" x2="13" y2="-66"/>
        <line x1="8" y1="-40" x2="13" y2="-40"/>
        <line x1="8" y1="-14" x2="13" y2="-14"/>
      </g>
    </g>

    <!-- dotted link line, purple accent -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.55">
      <path d="M148 110 Q 190 118 215 128" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M250 60 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="4" cy="-24" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="-40" cy="100" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
