<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi rumah dengan panel surya di atap dan turbin angin di sampingnya, menggambarkan upaya pemenuhan kebutuhan energi">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg1)"/>

  <!-- dekorasi lembut -->
  <circle cx="90" cy="70" r="70" fill="#ffffff" opacity="0.08"/>
  <circle cx="560" cy="60" r="46" fill="#ffffff" opacity="0.10"/>
  <circle cx="470" cy="150" r="18" fill="#ffffff" opacity="0.14"/>
  <circle cx="60" cy="200" r="10" fill="#ffffff" opacity="0.18"/>

  <!-- matahari lembut -->
  <circle cx="92" cy="78" r="34" fill="#fde68a" opacity="0.9"/>
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="92" y1="24" x2="92" y2="8"/>
    <line x1="140" y1="78" x2="156" y2="78"/>
    <line x1="126" y1="112" x2="138" y2="124"/>
    <line x1="58" y1="112" x2="46" y2="124"/>
  </g>

  <!-- awan -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="500" cy="80" rx="34" ry="16"/>
    <ellipse cx="524" cy="72" rx="24" ry="14"/>
    <ellipse cx="478" cy="74" rx="20" ry="12"/>
  </g>

  <!-- bukit -->
  <path d="M0 300 Q 160 250 330 290 T 640 270 L 640 360 L 0 360 Z" fill="#15803d"/>
  <path d="M0 320 Q 180 280 340 310 T 640 300 L 640 360 L 0 360 Z" fill="#22c55e"/>

  <!-- pohon kecil -->
  <g>
    <rect x="536" y="266" width="8" height="26" fill="#78350f"/>
    <circle cx="540" cy="256" r="20" fill="#16a34a"/>
    <circle cx="556" cy="268" r="14" fill="#22c55e"/>
  </g>
  <g>
    <rect x="62" y="276" width="7" height="22" fill="#78350f"/>
    <circle cx="65" cy="266" r="17" fill="#22c55e"/>
  </g>

  <!-- turbin angin -->
  <g transform="translate(470,240)">
    <rect x="-4" y="0" width="8" height="90" fill="#f1f5f9"/>
    <circle cx="0" cy="0" r="7" fill="#e2e8f0"/>
    <g fill="#ffffff">
      <path d="M0 0 L -6 -70 L 8 -62 Z"/>
      <path d="M0 0 L 50 22 L 40 36 Z" transform="rotate(10)"/>
      <path d="M0 0 L -40 40 L -52 26 Z" transform="rotate(10)"/>
    </g>
  </g>

  <!-- rumah -->
  <g transform="translate(180,160)">
    <!-- atap -->
    <path d="M-100 40 L 0 -50 L 100 40 Z" fill="#dc2626"/>
    <!-- panel surya di atap -->
    <g transform="translate(-10,5) rotate(-28)">
      <rect x="-52" y="-14" width="104" height="30" rx="4" fill="#1d4ed8"/>
      <g stroke="#93c5fd" stroke-width="2">
        <line x1="-26" y1="-14" x2="-26" y2="16"/>
        <line x1="0" y1="-14" x2="0" y2="16"/>
        <line x1="26" y1="-14" x2="26" y2="16"/>
        <line x1="-52" y1="1" x2="52" y2="1"/>
      </g>
    </g>
    <!-- dinding -->
    <rect x="-85" y="40" width="170" height="100" fill="#fef3c7"/>
    <!-- pintu -->
    <rect x="-16" y="90" width="32" height="50" rx="4" fill="#92400e"/>
    <circle cx="8" cy="114" r="2.5" fill="#fde68a"/>
    <!-- jendela -->
    <rect x="-66" y="66" width="34" height="30" rx="3" fill="#60a5fa"/>
    <line x1="-49" y1="66" x2="-49" y2="96" stroke="#ffffff" stroke-width="2"/>
    <line x1="-66" y1="81" x2="-32" y2="81" stroke="#ffffff" stroke-width="2"/>
    <rect x="34" y="66" width="34" height="30" rx="3" fill="#60a5fa"/>
    <line x1="51" y1="66" x2="51" y2="96" stroke="#ffffff" stroke-width="2"/>
    <line x1="34" y1="81" x2="68" y2="81" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- kilau kecil -->
  <g fill="#fef3c7" opacity="0.9">
    <circle cx="300" cy="60" r="3"/>
    <circle cx="340" cy="90" r="2.5"/>
    <circle cx="400" cy="50" r="2"/>
  </g>
</svg>
