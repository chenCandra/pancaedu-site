<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
  aria-label="Ilustrasi rumah dengan panel surya di atap dan turbin angin di sampingnya, menggambarkan upaya pemenuhan kebutuhan energi">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="panelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#fde8b8"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="turbineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">LINGKUNGAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Kebutuhan Energi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Permasalahan dan Upaya Pemenuhannya</text>

  <!-- badge chips: Kebutuhan / Solusi / Energi Bersih -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <path d="M26 10 L40 24 H34 V40 H18 V24 H12 Z" fill="#dc2626"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Kebutuhan</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M28 10 L18 28 H25 L22 42 L36 24 H28 Z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Solusi</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <circle cx="20" cy="22" r="8" fill="none" stroke="#059669" stroke-width="2.4"/>
      <path d="M20 14 L20 8 M14 22 L8 22 M26 14 L30 9" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M32 30 L24 30 L28 36 Z" fill="#16a34a"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Energi Bersih</text>
    </g>
  </g>

  <!-- hero illustration: rumah + panel surya + turbin -->
  <g transform="translate(338,100)">
    <ellipse cx="130" cy="220" rx="170" ry="18" fill="#1b2340" opacity="0.08"/>

    <!-- matahari kecil -->
    <circle cx="238" cy="18" r="18" fill="#fde047"/>
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="238" y1="-10" x2="238" y2="-18"/>
      <line x1="268" y1="18" x2="276" y2="18"/>
      <line x1="257" y1="-1" x2="263" y2="-7"/>
    </g>

    <!-- bukit -->
    <path d="M-40 206 Q 60 180 160 202 T 300 190 L 300 240 L -40 240 Z" fill="url(#hillG)"/>

    <!-- pohon kecil -->
    <g transform="translate(-4,186)">
      <rect x="-3" y="0" width="6" height="18" fill="#78350f"/>
      <circle cx="0" cy="-10" r="14" fill="#22c55e"/>
    </g>

    <!-- rumah -->
    <g transform="translate(92,118)">
      <path d="M-62 26 L0 -28 L62 26 Z" fill="url(#roofG)"/>
      <g transform="translate(-6,2) rotate(-26)">
        <rect x="-30" y="-9" width="60" height="18" rx="3" fill="url(#panelG)"/>
        <g stroke="#bfdbfe" stroke-width="1.6">
          <line x1="-15" y1="-9" x2="-15" y2="9"/>
          <line x1="0" y1="-9" x2="0" y2="9"/>
          <line x1="15" y1="-9" x2="15" y2="9"/>
        </g>
      </g>
      <rect x="-50" y="26" width="100" height="62" fill="url(#wallG)"/>
      <rect x="-10" y="56" width="20" height="32" rx="3" fill="#92400e"/>
      <rect x="-38" y="40" width="20" height="18" rx="2" fill="#38bdf8"/>
      <rect x="20" y="40" width="20" height="18" rx="2" fill="#38bdf8"/>
    </g>

    <!-- turbin angin -->
    <g transform="translate(236,98)">
      <rect x="-3" y="0" width="6" height="86" fill="url(#turbineG)"/>
      <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
      <g fill="#f8fafc">
        <path d="M0 0 L -6 -56 L 7 -50 Z"/>
        <path d="M0 0 L 44 18 L 34 30 Z" transform="rotate(8)"/>
        <path d="M0 0 L -34 32 L -44 20 Z" transform="rotate(8)"/>
      </g>
    </g>

    <!-- dotted energy line -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.55">
      <path d="M140 60 Q 180 50 232 42" fill="none"/>
    </g>

    <!-- sparkle accents -->
    <path d="M300 60 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#14b8a6" opacity="0.85"/>
    <circle cx="-30" cy="60" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="300 " cy="150" r="3.5" fill="#a855f7" opacity="0.7"/>
  </g>
</svg>
