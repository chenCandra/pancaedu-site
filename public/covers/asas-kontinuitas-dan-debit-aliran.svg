<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint2" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="hoseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="nozzleG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="jetG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="blobG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint2)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG2)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG2)"/>
  <rect width="640" height="360" fill="none" stroke="#a5f3fc" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#06b6d4" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#a5f3fc" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#a5f3fc"/>
    <text x="493" y="32" text-anchor="middle" fill="#0e7490">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="110" height="24" rx="12" fill="#0e7490"/>
    <text x="83" y="84.5" text-anchor="middle" fill="#ffffff">FLUIDA</text>
  </g>

  <!-- title -->
  <text x="26" y="138" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Asas Kontinuitas dan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Debit Aliran</text>
  <text x="26" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#155e75">Makin Sempit Pipa, Makin Deras Alirannya</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#cffafe"/>
      <path d="M26 12 c7 9 11 14 11 20 a11 11 0 0 1 -22 0 c0 -6 4 -11 11 -20z" fill="#0e7490"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#155e75">Debit</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="800" fill="#6d28d9">A·v</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">A·v</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M12 22 h12 l6 -6 h8" stroke="#047857" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 14 l8 2 -8 2 z" fill="#047857"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Kontinuitas</text>
    </g>
  </g>

  <!-- hero illustration: garden hose with pinched nozzle -->
  <g transform="translate(372,112)">
    <ellipse cx="110" cy="196" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- wide hose section, slow flow -->
    <rect x="-30" y="76" width="110" height="36" rx="18" fill="url(#hoseG)"/>
    <g stroke="#15803d" stroke-width="2" opacity="0.35">
      <line x1="-16" y1="76" x2="-16" y2="112"/>
      <line x1="4" y1="76" x2="4" y2="112"/>
      <line x1="24" y1="76" x2="24" y2="112"/>
      <line x1="44" y1="76" x2="44" y2="112"/>
      <line x1="64" y1="76" x2="64" y2="112"/>
    </g>

    <!-- pinched nozzle narrowing -->
    <path d="M80 76 Q128 84 150 92 L150 100 Q128 108 80 112 Z" fill="url(#nozzleG)"/>
    <circle cx="150" cy="96" r="5" fill="#92400e"/>

    <!-- fast narrow jet spraying out -->
    <g stroke="url(#jetG)" stroke-width="3.4" stroke-linecap="round" opacity="0.95">
      <line x1="156" y1="88" x2="224" y2="76"/>
      <line x1="156" y1="96" x2="230" y2="96"/>
      <line x1="156" y1="104" x2="224" y2="116"/>
    </g>
    <circle cx="230" cy="74" r="3.2" fill="#0ea5e9"/>
    <circle cx="236" cy="96" r="3.6" fill="#0ea5e9"/>
    <circle cx="228" cy="118" r="3" fill="#0ea5e9"/>

    <!-- slow wide arrow before nozzle -->
    <path d="M-20 94 L46 94" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <path d="M38 86 L52 94 L38 102 Z" fill="#ffffff" opacity="0.65"/>

    <!-- small speed gauge icons: slow vs fast -->
    <g transform="translate(6,150)">
      <circle cx="0" cy="0" r="18" fill="#ffffff"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#86efac" stroke-width="2"/>
      <path d="M0 0 L5 -6" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#15803d"/>
    </g>
    <g transform="translate(206,150)">
      <circle cx="0" cy="0" r="18" fill="#ffffff"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M0 0 L10 -4" stroke="#0369a1" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#0369a1"/>
    </g>

    <!-- sparkle + dot accents -->
    <path d="M230 30 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f472b6" opacity="0.85"/>
    <circle cx="10" cy="20" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="190" cy="40" r="3" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="140" x2="150" y2="140"/>
    </g>
  </g>
</svg>
