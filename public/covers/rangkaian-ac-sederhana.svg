<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint4" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint4)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG4)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG4)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (3 lines) -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2340">
    <text x="26" y="108">Rangkaian AC</text>
    <text x="26" y="134">Sederhana: Resistor,</text>
    <text x="26" y="160">Induktor, Kapasitor</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9d174d">Fase Tegangan-Arus pada R, L, C</text>

  <!-- mini badge chips: R / L / C -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,206)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M12 26 l4 -8 l4 8 l4 -8 l4 8 l4 -8 l4 8" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">R</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <path d="M10 26 a4 7 0 0 1 8 0 a4 7 0 0 1 8 0 a4 7 0 0 1 8 0 a4 7 0 0 1 8 0" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">L</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#ede9fe"/>
      <line x1="20" y1="15" x2="20" y2="37" stroke="#7c3aed" stroke-width="3"/>
      <line x1="32" y1="15" x2="32" y2="37" stroke="#7c3aed" stroke-width="3"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">C</text>
    </g>
  </g>

  <!-- hero illustration: R-L-C row with sine wave trace -->
  <g transform="translate(372,90)">
    <ellipse cx="130" cy="190" rx="130" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- sine wave trace -->
    <path d="M0 50 Q15 20 30 50 T 60 50 T 90 50 T 120 50 T 150 50 T 180 50 T 210 50 T 240 50" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>

    <!-- connecting wire -->
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="140" x2="24" y2="140"/>
      <line x1="76" y1="140" x2="100" y2="140"/>
      <line x1="168" y1="140" x2="192" y2="140"/>
      <line x1="208" y1="140" x2="240" y2="140"/>
    </g>
    <circle cx="0" cy="140" r="4.5" fill="#64748b"/>
    <circle cx="240" cy="140" r="4.5" fill="#64748b"/>

    <!-- resistor (R) -->
    <path d="M24 140 l6 -14 l8 28 l8 -28 l8 28 l8 -28 l6 14" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- inductor (L) -->
    <path d="M100 140 a8 16 0 0 1 16 0 a8 16 0 0 1 16 0 a8 16 0 0 1 16 0 a8 16 0 0 1 16 0" fill="none" stroke="#1d4ed8" stroke-width="5"/>

    <!-- capacitor (C) -->
    <line x1="194" y1="118" x2="194" y2="162" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <line x1="206" y1="118" x2="206" y2="162" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>

    <!-- small labels -->
    <text x="48" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">R</text>
    <text x="132" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">L</text>
    <text x="200" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#5b21b6">C</text>

    <!-- decorative accents -->
    <path d="M232 95 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="14" cy="95" r="4" fill="#f97316" opacity="0.75"/>
    <circle cx="246" cy="170" r="3.5" fill="#a855f7" opacity="0.7"/>
    <path d="M44 195 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
