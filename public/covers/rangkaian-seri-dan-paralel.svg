<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint6" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbfe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbG6" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint6)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG6)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG6)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="58" height="24" rx="12" fill="#fce7f3"/>
    <text x="491" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="524" y="16" width="88" height="24" rx="12" fill="#e0e7ff"/>
    <text x="568" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="190" height="24" rx="12" fill="#ec4899"/>
    <text x="123" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (2 lines) -->
  <g font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2340">
    <text x="26" y="122">Rangkaian Seri</text>
    <text x="26" y="160">dan Paralel</text>
  </g>
  <text x="26" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9d174d">Arus, Tegangan, dan Hambatan Total</text>

  <!-- mini badge chips: Seri / Paralel / Arus-Tegangan -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,206)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <line x1="10" y1="26" x2="18" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="26" cy="26" r="6" fill="#f59e0b"/>
      <line x1="34" y1="26" x2="42" y2="26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Seri</text>
    </g>
    <g transform="translate(104,206)">
      <circle cx="26" cy="26" r="26" fill="#ccfbf1"/>
      <line x1="12" y1="16" x2="12" y2="36" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="40" y1="16" x2="40" y2="36" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="12" y1="20" x2="40" y2="20" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="12" y1="32" x2="40" y2="32" stroke="#0d9488" stroke-width="2.2"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">Paralel</text>
    </g>
    <g transform="translate(182,206)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <path d="M28 14 L19 28 L25 28 L23 38 L33 24 L27 24 Z" fill="#d97706"/>
      <text x="26" y="66" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">Arus/Tegangan</text>
    </g>
  </g>

  <!-- hero illustration: series bulb loop vs parallel bulb branches -->
  <g transform="translate(372,85)">
    <ellipse cx="130" cy="190" rx="130" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- SERIES diagram -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <rect x="8" y="40" width="94" height="92" rx="8"/>
    </g>
    <!-- battery on left wire -->
    <line x1="2" y1="78" x2="14" y2="78" stroke="#1b2340" stroke-width="3"/>
    <line x1="4" y1="94" x2="12" y2="94" stroke="#1b2340" stroke-width="5"/>
    <!-- bulbs on top wire -->
    <circle cx="33" cy="40" r="9" fill="url(#bulbG6)"/>
    <path d="M29 36 L37 44 M29 44 L37 36" stroke="#b45309" stroke-width="1.4"/>
    <circle cx="77" cy="40" r="9" fill="url(#bulbG6)"/>
    <path d="M73 36 L81 44 M73 44 L81 36" stroke="#b45309" stroke-width="1.4"/>
    <text x="55" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Seri</text>

    <!-- PARALLEL diagram -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" fill="none">
      <line x1="150" y1="40" x2="230" y2="40"/>
      <line x1="150" y1="132" x2="230" y2="132"/>
      <line x1="150" y1="40" x2="150" y2="132"/>
      <line x1="230" y1="40" x2="230" y2="132"/>
    </g>
    <!-- battery on left wire -->
    <line x1="144" y1="78" x2="156" y2="78" stroke="#1b2340" stroke-width="3"/>
    <line x1="146" y1="94" x2="154" y2="94" stroke="#1b2340" stroke-width="5"/>
    <!-- branch 1 with bulb -->
    <line x1="176" y1="40" x2="176" y2="78" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="176" y1="94" x2="176" y2="132" stroke="#94a3b8" stroke-width="3.5"/>
    <circle cx="176" cy="86" r="9" fill="url(#bulbG6)"/>
    <path d="M172 82 L180 90 M172 90 L180 82" stroke="#b45309" stroke-width="1.4"/>
    <!-- branch 2 with bulb -->
    <line x1="204" y1="40" x2="204" y2="78" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="204" y1="94" x2="204" y2="132" stroke="#94a3b8" stroke-width="3.5"/>
    <circle cx="204" cy="86" r="9" fill="url(#bulbG6)"/>
    <path d="M200 82 L208 90 M200 90 L208 82" stroke="#b45309" stroke-width="1.4"/>
    <text x="190" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#115e59">Paralel</text>

    <!-- decorative accents -->
    <path d="M232 20 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="14" cy="18" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="246" cy="168" r="3.5" fill="#14b8a6" opacity="0.7"/>
    <path d="M118 185 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#14b8a6" opacity="0.85"/>
  </g>
</svg>
