<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint6" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="blobG6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="springSeriG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="springParA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="springParB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="massG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgTint6)"/>
  <circle cx="540" cy="80" r="190" fill="url(#blobG6)"/>
  <circle cx="80" cy="330" r="140" fill="url(#blobG6)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#bfdbfe" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="452" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="483" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="522" y="16" width="90" height="24" rx="12" fill="#e0e7ff"/>
    <text x="567" y="32" text-anchor="middle" fill="#3730a3">Kelas XI</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="132" height="24" rx="12" fill="#2563eb"/>
    <text x="94" y="84.5" text-anchor="middle" fill="#ffffff">MEKANIKA</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="800" fill="#1b2340" font-size="30">
    <text x="26" y="128">Susunan Pegas Seri</text>
    <text x="26" y="162">dan Paralel</text>
  </g>
  <text x="26" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Menghitung k Total Rangkaian Pegas</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,222)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M14 26 l6 -7 6 7 6 -7 6 7" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Seri</text>
    </g>
    <g transform="translate(104,222)">
      <circle cx="26" cy="26" r="26" fill="#ccfbf1"/>
      <path d="M14 20 l5 -5 5 5 5 -5 5 5" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 32 l5 -5 5 5 5 -5 5 5" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Paralel</text>
    </g>
    <g transform="translate(182,222)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="31" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">k&#8348;</text>
      <text x="26" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">k total</text>
    </g>
  </g>

  <!-- hero illustration: two mini spring-system diagrams side by side -->
  <g transform="translate(362,112)">
    <ellipse cx="128" cy="200" rx="128" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- SERI: chained springs, left -->
    <rect x="18" y="18" width="70" height="10" rx="4" fill="#64748b"/>
    <path d="M24 28 l10 -7 10 14 10 -14 10 14 L64 28" stroke="url(#springSeriG)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="28" width="12" height="18" rx="2" fill="#94a3b8"/>
    <path d="M70 46 l9 -6 9 12 9 -12 9 12 L106 46" stroke="url(#springSeriG)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="94" y="46" width="30" height="24" rx="5" fill="url(#massG2)"/>
    <text x="68" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Seri</text>

    <!-- PARALEL: two springs side by side, right -->
    <rect x="160" y="10" width="80" height="10" rx="4" fill="#64748b"/>
    <path d="M166 20 l9 -6 9 12 9 -12 9 12 9 -12 9 12 L220 20" stroke="url(#springParA)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166 34 l9 -6 9 12 9 -12 9 12 9 -12 9 12 L220 34" stroke="url(#springParB)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,46)"/>
    <rect x="186" y="110" width="30" height="24" rx="5" fill="url(#massG2)"/>
    <text x="201" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Paralel</text>

    <!-- dashed divider between the two diagrams -->
    <line x1="140" y1="10" x2="140" y2="190" stroke="#a855f7" stroke-width="2" stroke-dasharray="2 6" opacity="0.5"/>

    <!-- sparkle accents -->
    <path d="M232 170 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="20" cy="150" r="4" fill="#ec4899" opacity="0.65"/>
    <circle cx="246" cy="60" r="3" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
