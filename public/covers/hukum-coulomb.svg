<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf4f9"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="posG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="negG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fbcfe8" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#ec4899" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark, top-left -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fbcfe8" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fce7f3"/>
    <text x="493" y="32" text-anchor="middle" fill="#9d174d">Fisika</text>
    <rect x="526" y="16" width="92" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas XII</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="220" height="24" rx="12" fill="#ec4899"/>
    <text x="138" y="84.5" text-anchor="middle" fill="#ffffff">LISTRIK &amp; MAGNET</text>
  </g>

  <!-- title (3 lines, smaller size: long title) -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#1b2340">
    <text x="26" y="108">Hukum Coulomb: Gaya</text>
    <text x="26" y="140">Tarik &amp; Tolak Antar</text>
    <text x="26" y="172">Muatan Listrik</text>
  </g>
  <text x="26" y="196" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#9d174d">Dua Muatan Saling Tarik atau Tolak</text>

  <!-- mini badge chips: F=kq1q2/r2 / Tarik / Tolak -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,224)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <text x="26" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">kq&#8321;q&#8322;</text>
      <text x="26" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">F=kq1q2/r&#178;</text>
    </g>
    <g transform="translate(104,224)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="12" cy="26" r="5" fill="#1d4ed8"/>
      <circle cx="40" cy="26" r="5" fill="#1d4ed8"/>
      <path d="M20 26 L24 26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M32 26 L28 26" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M24 26 l-6 -4 0 8 z" fill="#1d4ed8"/>
      <path d="M28 26 l6 -4 0 8 z" fill="#1d4ed8"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Tarik</text>
    </g>
    <g transform="translate(182,224)">
      <circle cx="26" cy="26" r="26" fill="#ffedd5"/>
      <path d="M14 26 l7 -5 M14 26 l7 5" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M38 26 l-7 -5 M38 26 l-7 5" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Tolak</text>
    </g>
  </g>

  <!-- hero illustration: charged spheres demonstrating repulsion (top, ++) and attraction (bottom, +-) -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="190" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- repulsion pair (++) -->
    <g transform="translate(0,34)">
      <circle cx="30" cy="26" r="28" fill="url(#posG)"/>
      <text x="30" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">+</text>
      <circle cx="150" cy="26" r="28" fill="url(#posG)"/>
      <text x="150" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">+</text>
      <!-- repulsion arrows pointing outward -->
      <path d="M6 26 L-16 26" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
      <path d="M-16 26 l9 -5 0 10 z" fill="#f97316"/>
      <path d="M174 26 L196 26" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
      <path d="M196 26 l-9 -5 0 10 z" fill="#f97316"/>
    </g>

    <!-- attraction pair (+ -) -->
    <g transform="translate(20,128)">
      <circle cx="30" cy="26" r="26" fill="url(#posG)"/>
      <text x="30" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">+</text>
      <circle cx="140" cy="26" r="26" fill="url(#negG)"/>
      <text x="140" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">&#8722;</text>
      <!-- attraction arrows pointing inward -->
      <path d="M68 26 L92 26" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
      <path d="M92 26 l-9 -5 0 10 z" fill="#14b8a6"/>
      <path d="M102 26 L78 26" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
      <path d="M78 26 l9 -5 0 10 z" fill="#14b8a6"/>
    </g>

    <!-- faint field lines -->
    <g stroke="#a855f7" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.4" fill="none">
      <path d="M30 2 C 10 -14, -10 -14, -26 2"/>
      <path d="M150 2 C 170 -14, 190 -14, 206 2"/>
    </g>

    <!-- sparkle accents -->
    <path d="M232 46 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="8" cy="188" r="3.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="220" cy="184" r="3" fill="#2563eb" opacity="0.7"/>
  </g>
</svg>
