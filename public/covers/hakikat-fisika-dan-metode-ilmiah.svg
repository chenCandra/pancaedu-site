<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="hk-bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="hk-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="hk-apple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="hk-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hk-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="hk-blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#hk-bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#hk-blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#hk-blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="230" height="24" rx="12" fill="#fbbf24"/>
    <text x="143" y="84.5" text-anchor="middle" fill="#ffffff">HAKIKAT FISIKA</text>
  </g>

  <text x="26" y="134" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Hakikat Fisika &amp;</text>
  <text x="26" y="168" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1b2340">Metode Ilmiah</text>
  <text x="26" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Cara Berpikir untuk Memahami Alam</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,210)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <circle cx="26" cy="27" r="11" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
      <line x1="34" y1="35" x2="40" y2="41" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Amati</text>
    </g>
    <g transform="translate(104,210)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <path d="M18 18 L18 26 Q18 34 26 34 Q34 34 34 26 L34 18" fill="none" stroke="#be185d" stroke-width="2.4"/>
      <line x1="18" y1="18" x2="34" y2="18" stroke="#be185d" stroke-width="2.4"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Uji</text>
    </g>
    <g transform="translate(182,210)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <path d="M16 27 L23 34 L37 18" stroke="#047857" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Simpulkan</text>
    </g>
  </g>

  <g transform="translate(372,112)">
    <ellipse cx="110" cy="200" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- daun melayang, hijau -->
    <g transform="translate(192,60) rotate(18)">
      <path d="M0 -22 C 16 -14 16 14 0 22 C -16 14 -16 -14 0 -22 Z" fill="url(#hk-leaf)"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#065f46" stroke-width="1.6"/>
    </g>

    <!-- apel melayang, merah -->
    <g transform="translate(150,32)">
      <circle r="22" fill="url(#hk-apple)"/>
      <path d="M0 -22 Q 7 -30 14 -25" stroke="#15803d" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <circle cx="-7" cy="-5" r="4.5" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- bintang kecil melayang, amber -->
    <path d="M214 118 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#fbbf24"/>

    <!-- dashed trails from objects to character -->
    <g stroke="#a855f7" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.55">
      <path d="M150 54 Q 120 90 96 118" fill="none"/>
      <path d="M192 82 Q 160 108 118 128" fill="none"/>
    </g>

    <!-- karakter penasaran, biru -->
    <g transform="translate(70,150)">
      <path d="M-42 8 Q 0 -24 42 8 L 40 72 L -40 72 Z" fill="url(#hk-shirt)"/>
      <circle cx="0" cy="-30" r="36" fill="#fde68a"/>
      <path d="M-34 -46 Q 0 -70 34 -46 Q 34 -60 0 -64 Q -34 -60 -34 -46 Z" fill="#78350f"/>
      <circle cx="-12" cy="-32" r="6" fill="#1b2340"/>
      <circle cx="12" cy="-32" r="6" fill="#1b2340"/>
      <circle cx="-10" cy="-34" r="2" fill="#ffffff"/>
      <circle cx="14" cy="-34" r="2" fill="#ffffff"/>
      <path d="M-8 -12 Q 0 -5 8 -12" stroke="#1b2340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="-22" cy="-16" r="6" fill="#f9a8d4" opacity="0.6"/>
      <circle cx="22" cy="-16" r="6" fill="#f9a8d4" opacity="0.6"/>
    </g>

    <!-- kaca pembesar di tangan, teal -->
    <g transform="translate(120,172) rotate(-12)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="url(#hk-glass)" stroke-width="7"/>
      <line x1="18" y1="18" x2="36" y2="36" stroke="url(#hk-glass)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- sparkle accents -->
    <circle cx="12" cy="60" r="3.5" fill="#f97316" opacity="0.75"/>
    <circle cx="238" cy="40" r="4" fill="#14b8a6" opacity="0.6"/>
    <circle cx="238" cy="166" r="3.5" fill="#ec4899" opacity="0.6"/>
  </g>
</svg>
