<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg6)"/>
  <rect width="640" height="360" fill="#44403c" opacity="0.18"/>
  <circle cx="560" cy="80" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="70" cy="300" r="70" fill="#ffffff" opacity="0.05"/>

  <!-- hourglass: supply terbatas -->
  <g transform="translate(320,95)">
    <path d="M-30 -40 h60 v14 l-24 26 l24 26 v14 h-60 v-14 l24 -26 l-24 -26 Z" fill="none" stroke="#e7e5e4" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-20 -32 h40 l-20 24 Z" fill="#a8a29e"/>
    <path d="M-20 32 h40 l-20 -24 Z" fill="#78716c"/>
    <circle cx="0" cy="0" r="3" fill="#78716c"/>
  </g>

  <!-- oil barrel -->
  <g transform="translate(170,250)">
    <rect x="-45" y="-80" width="90" height="140" rx="10" fill="#1f2937"/>
    <rect x="-45" y="-40" width="90" height="14" fill="#374151"/>
    <rect x="-45" y="10" width="90" height="14" fill="#374151"/>
    <ellipse cx="0" cy="-80" rx="45" ry="12" fill="#374151"/>
    <circle cx="0" cy="-80" r="14" fill="#4b5563"/>
    <path d="M30 -60 q14 20 0 40" stroke="#1f2937" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-10 70 q6 16 0 28" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="-10" cy="106" r="7" fill="#111827"/>
  </g>

  <!-- bright flame accent on barrel (fuel) -->
  <g transform="translate(170,150)">
    <path d="M0 -20 C9 -8 10 2 3 10 C6 3 1 1 0 4 C-1 1 -6 3 -3 10 C-10 2 -9 -8 0 -20 Z" fill="#f97316"/>
  </g>

  <!-- coal pile -->
  <g transform="translate(470,270)">
    <ellipse cx="0" cy="40" rx="90" ry="16" fill="#111827" opacity="0.3"/>
    <circle cx="-40" cy="10" r="30" fill="#1f2937"/>
    <circle cx="10" cy="-6" r="36" fill="#111827"/>
    <circle cx="55" cy="14" r="26" fill="#1f2937"/>
    <circle cx="0" cy="24" r="22" fill="#374151"/>
    <circle cx="-4" cy="-14" r="8" fill="#4b5563" opacity="0.6"/>
    <circle cx="20" cy="-18" r="6" fill="#4b5563" opacity="0.5"/>
  </g>
