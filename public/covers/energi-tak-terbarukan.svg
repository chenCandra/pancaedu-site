<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgTint6" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="blobG6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrelG6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="coalG6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#bgTint6)"/>
  <circle cx="540" cy="90" r="190" fill="url(#blobG6)"/>
  <circle cx="90" cy="320" r="140" fill="url(#blobG6)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="174" height="24" rx="12" fill="#fbbf24"/>
    <text x="115" y="84.5" text-anchor="middle" fill="#ffffff">TAK TERBARUKAN</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1b2340">Energi Tak Terbarukan</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Minyak Bumi dan Batu Bara</text>

  <!-- mini badge chips: Terbatas / Fosil / Tambang -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#e7e5e4"/>
      <path d="M14 8 h24 v9 l-16 9 l16 9 v9 h-24 v-9 l16 -9 l-16 -9 Z" fill="none" stroke="#78716c" stroke-width="3.6" stroke-linejoin="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#57534e">Terbatas</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#e0e7ff"/>
      <rect x="12" y="20" width="28" height="22" rx="3" fill="#1f2937"/>
      <circle cx="26" cy="14" r="8" fill="#374151"/>
      <path d="M20 6 q6 -8 12 0" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Fosil</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fde7d4"/>
      <polygon points="26,10 10,38 42,38" fill="#78716c"/>
      <rect x="20" y="30" width="12" height="8" fill="#44403c"/>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Tambang</text>
    </g>
  </g>

  <!-- hero illustration: oil barrel, coal pile, hourglass -->
  <g>
    <!-- muted ground -->
    <path d="M340 320 Q440 305 540 322 Q590 332 640 312 L640 360 L340 360 Z" fill="#78716c" opacity="0.35"/>

    <!-- hourglass: limited supply cue -->
    <g transform="translate(490,145)">
      <path d="M-28 -38 h56 v13 l-22 25 l22 25 v13 h-56 v-13 l22 -25 l-22 -25 Z" fill="none" stroke="#a8a29e" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M-18 -30 h36 l-18 22 Z" fill="#fbbf24"/>
      <path d="M-18 30 h36 l-18 -22 Z" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="2.6" fill="#78716c"/>
    </g>

    <!-- oil barrel -->
    <g transform="translate(430,255)">
      <rect x="-42" y="-75" width="84" height="130" rx="9" fill="url(#barrelG6)"/>
      <rect x="-42" y="-38" width="84" height="12" fill="#4b5563"/>
      <rect x="-42" y="8" width="84" height="12" fill="#4b5563"/>
      <ellipse cx="0" cy="-75" rx="42" ry="10" fill="#374151"/>
      <circle cx="0" cy="-75" r="13" fill="#6b7280"/>
      <path d="M26 -56 q12 18 0 36" stroke="#1f2937" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- bright flame accent on barrel -->
    <g transform="translate(430,165)">
      <path d="M0 -18 C8 -7 9 2 3 9 C5 3 1 1 0 3 C-1 1 -5 3 -3 9 C-9 2 -8 -7 0 -18 Z" fill="#f97316"/>
    </g>

    <!-- coal pile -->
    <g transform="translate(560,275)">
      <ellipse cx="0" cy="38" rx="78" ry="14" fill="#111827" opacity="0.25"/>
      <circle cx="-34" cy="8" r="26" fill="url(#coalG6)"/>
      <circle cx="10" cy="-6" r="32" fill="#111827"/>
      <circle cx="48" cy="12" r="22" fill="url(#coalG6)"/>
      <circle cx="0" cy="20" r="18" fill="#374151"/>
      <circle cx="-4" cy="-14" r="6" fill="#6b7280" opacity="0.6"/>
      <circle cx="18" cy="-16" r="4.5" fill="#6b7280" opacity="0.5"/>
    </g>

    <!-- sparkle accents, warm + one cool contrast -->
    <circle cx="610" cy="130" r="3.6" fill="#14b8a6" opacity="0.6"/>
    <path d="M375 190 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#f59e0b" opacity="0.8"/>
    <circle cx="358" cy="215" r="2.6" fill="#f59e0b" opacity="0.55"/>
  </g>
</svg>
