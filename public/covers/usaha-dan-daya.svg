<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="udBgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="udBlobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="udBlobTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="udCrateG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="udBodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="udWatchG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="udAh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- base card -->
  <rect width="640" height="360" fill="url(#udBgTint)"/>
  <circle cx="545" cy="85" r="190" fill="url(#udBlobBlue)"/>
  <circle cx="90" cy="325" r="140" fill="url(#udBlobTeal)"/>
  <rect width="640" height="360" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- dot texture -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#93c5fd" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <!-- top-right pills -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#dbeafe"/>
    <text x="493" y="32" text-anchor="middle" fill="#1e40af">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <!-- eyebrow pill -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#2563eb"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">USAHA &amp; DAYA</text>
  </g>

  <!-- title -->
  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Usaha dan Daya</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#0d9488">Hubungan Usaha, Daya, dan Waktu</text>

  <!-- mini badge chips -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#fee2e2"/>
      <text x="26" y="33" text-anchor="middle" font-size="16" font-weight="800" fill="#991b1b">W</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Usaha (W)</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#fef3c7"/>
      <text x="26" y="33" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">P</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Daya (P)</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="33" text-anchor="middle" font-size="16" font-weight="800" fill="#065f46">t</text>
      <text x="26" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Waktu (t)</text>
    </g>
  </g>

  <!-- hero illustration: character pushing a crate, stopwatch nearby -->
  <g transform="translate(372,118)">
    <ellipse cx="120" cy="196" rx="150" ry="14" fill="#1b2340" opacity="0.08"/>

    <!-- stopwatch, top right -->
    <g transform="translate(222,34)">
      <rect x="-5" y="-30" width="10" height="9" rx="2" fill="#1b2340"/>
      <circle cx="0" cy="0" r="26" fill="#ffffff"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="url(#udWatchG)" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#1b2340" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="10" y2="6" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.6" fill="#1b2340"/>
    </g>

    <!-- motion lines -->
    <g stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="150" y1="112" x2="172" y2="112"/>
      <line x1="150" y1="128" x2="172" y2="128"/>
      <line x1="150" y1="144" x2="172" y2="144"/>
    </g>

    <!-- crate -->
    <g transform="translate(178,96)">
      <ellipse cx="30" cy="92" rx="38" ry="9" fill="#1b2340" opacity="0.15"/>
      <rect x="0" y="40" width="60" height="52" rx="5" fill="url(#udCrateG)"/>
      <rect x="0" y="40" width="60" height="52" rx="5" fill="none" stroke="#78350f" stroke-width="3"/>
      <line x1="0" y1="66" x2="60" y2="66" stroke="#78350f" stroke-width="3"/>
      <line x1="15" y1="40" x2="15" y2="92" stroke="#78350f" stroke-width="2.4"/>
      <line x1="45" y1="40" x2="45" y2="92" stroke="#78350f" stroke-width="2.4"/>
    </g>

    <!-- force arrow F -->
    <line x1="108" y1="146" x2="166" y2="146" stroke="#ea580c" stroke-width="7" stroke-linecap="round" marker-end="url(#udAh)"/>
    <text x="100" y="134" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#9a3412">F</text>

    <!-- cartoon character pushing -->
    <g transform="translate(30,70)">
      <ellipse cx="42" cy="124" rx="34" ry="8" fill="#1b2340" opacity="0.15"/>
      <path d="M38 96 Q26 110 24 124" stroke="#1b2340" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M50 96 Q64 104 70 122" stroke="#1b2340" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M28 58 Q24 82 40 100 L62 92 Q68 70 56 54 Q42 46 28 58 Z" fill="url(#udBodyG)"/>
      <path d="M54 66 Q78 72 94 88" stroke="#be185d" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="36" r="17" fill="#fbbf24"/>
      <path d="M26 30 Q42 14 58 30 Q55 20 42 18 Q29 20 26 30 Z" fill="#1b2340"/>
      <path d="M36 38 L42 38 M48 38 L54 38" stroke="#1b2340" stroke-width="2" stroke-linecap="round"/>
      <path d="M34 46 Q42 43 50 46" stroke="#1b2340" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M20 26 Q25 34 20 40 Q15 34 20 26 Z" fill="#93c5fd"/>
    </g>

    <!-- sparkle accents -->
    <path d="M232 160 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fde047" opacity="0.9"/>
    <circle cx="10" cy="40" r="3.5" fill="#ec4899" opacity="0.75"/>
  </g>
</svg>
