<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi pabrik formula mini: balok huruf M, L, T berjalan di konveyor menjadi susunan dimensi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <circle cx="70" cy="70" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="580" cy="90" r="70" fill="#ffffff" fill-opacity="0.07"/>

  <!-- cerobong asap sparkle -->
  <rect x="470" y="60" width="26" height="60" fill="#78716c" rx="4"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="483" cy="48" r="10"/>
    <circle cx="498" cy="32" r="13"/>
    <circle cx="470" cy="30" r="9"/>
  </g>
  <g fill="#fde68a">
    <path transform="translate(520,40) scale(0.8)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </g>

  <!-- pabrik bangunan -->
  <rect x="330" y="110" width="200" height="110" rx="12" fill="#92400e"/>
  <rect x="350" y="130" width="40" height="40" rx="6" fill="#fde047" fill-opacity="0.8"/>
  <rect x="470" y="130" width="40" height="40" rx="6" fill="#fde047" fill-opacity="0.8"/>

  <!-- konveyor -->
  <rect x="40" y="250" width="560" height="26" rx="8" fill="#44403c"/>
  <g fill="#1c1917">
    <circle cx="70" cy="276" r="12"/>
    <circle cx="160" cy="276" r="12"/>
    <circle cx="250" cy="276" r="12"/>
    <circle cx="340" cy="276" r="12"/>
    <circle cx="430" cy="276" r="12"/>
    <circle cx="520" cy="276" r="12"/>
  </g>
  <ellipse cx="320" cy="300" rx="260" ry="10" fill="#000000" fill-opacity="0.1"/>

  <!-- balok M -->
  <g transform="translate(110,215)">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="#3b82f6"/>
    <circle cx="-14" cy="-6" r="5" fill="#ffffff"/>
    <circle cx="14" cy="-6" r="5" fill="#ffffff"/>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">M</text>
  </g>
  <!-- balok L -->
  <g transform="translate(230,215)">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="#14b8a6"/>
    <circle cx="-14" cy="-6" r="5" fill="#ffffff"/>
    <circle cx="14" cy="-6" r="5" fill="#ffffff"/>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">L</text>
  </g>
  <!-- balok T -->
  <g transform="translate(350,215)">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="#ec4899"/>
    <circle cx="-14" cy="-6" r="5" fill="#ffffff"/>
    <circle cx="14" cy="-6" r="5" fill="#ffffff"/>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">T</text>
  </g>

  <!-- hasil keluar pabrik: balok gabungan dimensi gaya -->
  <g transform="translate(540,205)">
    <rect x="-50" y="-48" width="100" height="96" rx="16" fill="#8b5cf6"/>
    <rect x="-50" y="-48" width="100" height="96" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="-16" cy="-10" r="5" fill="#ffffff"/>
    <circle cx="16" cy="-10" r="5" fill="#ffffff"/>
    <path d="M-16 8 Q 0 18 16 8" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MLT&#8315;&#178;</text>
  </g>

  <path d="M400 215 L470 210" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
</svg>
