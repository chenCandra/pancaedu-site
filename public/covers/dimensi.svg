<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="dm-bgTint" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="dm-blockM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dm-blockL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="dm-blockT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="dm-blockR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="dm-blobG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#dm-bgTint)"/>
  <circle cx="540" cy="90" r="190" fill="url(#dm-blobG)"/>
  <circle cx="90" cy="320" r="140" fill="url(#dm-blobG)"/>
  <rect width="640" height="360" fill="none" stroke="#fde68a" stroke-width="2"/>

  <g fill="#f59e0b" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="64" cy="40" r="2"/><circle cx="88" cy="40" r="2"/>
    <circle cx="40" cy="64" r="2"/><circle cx="64" cy="64" r="2"/><circle cx="88" cy="64" r="2"/>
  </g>

  <g transform="translate(28,24)">
    <rect width="26" height="26" rx="8" fill="#1b2340"/>
    <path d="M6 7h14a2 2 0 0 1 2 2v12l-4-2-4 2-4-2-4 2V9a2 2 0 0 1 2-2z" fill="#fde68a" transform="translate(0,-1) scale(0.72)"/>
    <text x="34" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2340">PancaEdu</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="462" y="16" width="62" height="24" rx="12" fill="#fde68a"/>
    <text x="493" y="32" text-anchor="middle" fill="#92400e">Fisika</text>
    <rect x="532" y="16" width="80" height="24" rx="12" fill="#e0e7ff"/>
    <text x="572" y="32" text-anchor="middle" fill="#3730a3">Kelas X</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <rect x="28" y="68" width="150" height="24" rx="12" fill="#fbbf24"/>
    <text x="103" y="84.5" text-anchor="middle" fill="#ffffff">DIMENSI</text>
  </g>

  <text x="26" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#1b2340">Dimensi</text>
  <text x="26" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#78350f">Susunan Huruf di Balik Setiap Rumus</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(26,208)">
      <circle cx="26" cy="26" r="26" fill="#dbeafe"/>
      <text x="26" y="35" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">M</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Massa</text>
    </g>
    <g transform="translate(104,208)">
      <circle cx="26" cy="26" r="26" fill="#d1fae5"/>
      <text x="26" y="35" text-anchor="middle" font-size="22" font-weight="800" fill="#047857">L</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Panjang</text>
    </g>
    <g transform="translate(182,208)">
      <circle cx="26" cy="26" r="26" fill="#fce7f3"/>
      <text x="26" y="35" text-anchor="middle" font-size="22" font-weight="800" fill="#be185d">T</text>
      <text x="26" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Waktu</text>
    </g>
  </g>

  <g transform="translate(366,130)">
    <ellipse cx="128" cy="178" rx="150" ry="16" fill="#1b2340" opacity="0.08"/>

    <!-- conveyor belt -->
    <rect x="-10" y="150" width="276" height="18" rx="7" fill="#44403c"/>
    <g fill="#1c1917">
      <circle cx="10" cy="168" r="8"/>
      <circle cx="80" cy="168" r="8"/>
      <circle cx="150" cy="168" r="8"/>
      <circle cx="220" cy="168" r="8"/>
    </g>

    <!-- blok M -->
    <g transform="translate(26,110)">
      <rect x="-26" y="-26" width="52" height="52" rx="10" fill="url(#dm-blockM)"/>
      <circle cx="-9" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="9" cy="-4" r="3.5" fill="#ffffff"/>
      <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">M</text>
    </g>
    <!-- blok L -->
    <g transform="translate(96,110)">
      <rect x="-26" y="-26" width="52" height="52" rx="10" fill="url(#dm-blockL)"/>
      <circle cx="-9" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="9" cy="-4" r="3.5" fill="#ffffff"/>
      <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">L</text>
    </g>
    <!-- blok T -->
    <g transform="translate(166,110)">
      <rect x="-26" y="-26" width="52" height="52" rx="10" fill="url(#dm-blockT)"/>
      <circle cx="-9" cy="-4" r="3.5" fill="#ffffff"/>
      <circle cx="9" cy="-4" r="3.5" fill="#ffffff"/>
      <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">T</text>
    </g>

    <!-- arrow to result -->
    <path d="M196 100 Q 220 80 240 60" stroke="#f97316" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- hasil: blok dimensi gaya -->
    <g transform="translate(240,30)">
      <rect x="-44" y="-38" width="88" height="76" rx="14" fill="url(#dm-blockR)"/>
      <rect x="-44" y="-38" width="88" height="76" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
      <circle cx="-14" cy="-8" r="4.5" fill="#ffffff"/>
      <circle cx="14" cy="-8" r="4.5" fill="#ffffff"/>
      <path d="M-12 10 Q 0 18 12 10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">MLT⁻²</text>
    </g>

    <!-- factory chimney top-left, small decorative building -->
    <rect x="-4" y="10" width="26" height="46" rx="4" fill="#92400e" opacity="0.85"/>
    <g fill="#ffffff" opacity="0.45">
      <circle cx="9" cy="2" r="7"/>
      <circle cx="18" cy="-8" r="9"/>
    </g>

    <!-- sparkle accents -->
    <path d="M240 -18 l2.5 5.5 5.5 0.8 -4 4 0.8 5.5 -4.8 -3 -4.8 3 0.8 -5.5 -4 -4 5.5 -0.8 z" fill="#fbbf24" opacity="0.9"/>
    <circle cx="130" cy="60" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="60" cy="70" r="3.5" fill="#14b8a6" opacity="0.7"/>
  </g>
</svg>
