<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Ilustrasi dilatasi waktu: jam yang diam di Bumi dibandingkan dengan jam di dalam roket yang bergerak mendekati kecepatan cahaya">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c6ff0"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd873" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd873" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- lengkungan "ruang-waktu" di latar, cuma dekorasi -->
  <g stroke="#ffffff" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="900" cy="130" r="150"/>
    <circle cx="900" cy="130" r="235"/>
    <circle cx="900" cy="130" r="320"/>
  </g>

  <!-- garis horizon Bumi -->
  <path d="M0 565 Q 300 525 630 562" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- kilatan cahaya dekat lintasan roket, motif "mendekati kecepatan cahaya" -->
  <circle cx="900" cy="130" r="72" fill="url(#burst)"/>
  <g stroke="#ffd873" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="900" y1="28" x2="900" y2="54"/>
    <line x1="985" y1="65" x2="966" y2="80"/>
    <line x1="1012" y1="130" x2="984" y2="130"/>
    <line x1="985" y1="195" x2="966" y2="180"/>
    <line x1="815" y1="65" x2="834" y2="80"/>
  </g>

  <!-- kurva pembanding dua jam, putus-putus -->
  <path d="M345 385 Q 570 250 745 300" stroke="#ffd873" stroke-width="3" stroke-dasharray="2 11"
    stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Jam A: diam di Bumi -->
  <g transform="translate(235,405)">
    <circle r="96" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.92"/>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-96" x2="0" y2="-80"/>
      <line x1="0" y1="96" x2="0" y2="80"/>
      <line x1="-96" y1="0" x2="-80" y2="0"/>
      <line x1="96" y1="0" x2="80" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="-38" y2="-56" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="53" y2="-38" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle r="6" fill="#ffffff"/>
  </g>
  <text x="235" y="537" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="Georgia, serif" font-size="30" font-style="italic">t</text>
  <text x="235" y="568" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-family="sans-serif" font-size="18">diam di Bumi</text>

  <!-- Roket bergerak mendekati kecepatan cahaya -->
  <g transform="translate(795,275) rotate(-30)">
    <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M-42 18 Q -145 42 -235 22"/>
      <path d="M-42 0 Q -155 0 -258 -10"/>
      <path d="M-42 -18 Q -145 -42 -235 -64"/>
    </g>
    <path d="M62 0 L10 -27 L-52 -20 L-52 20 L10 27 Z" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="18" cy="0" r="10" fill="#4f46e5"/>
    <path d="M-52 -20 L-75 -35 L-52 -8 Z" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M-52 20 L-75 35 L-52 8 Z" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Jam B: di dalam roket, hasil dilatasi waktu -->
  <g transform="translate(835,440) rotate(-6)">
    <circle r="63" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.92"/>
    <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-63" x2="0" y2="-51"/>
      <line x1="0" y1="63" x2="0" y2="51"/>
      <line x1="-63" y1="0" x2="-51" y2="0"/>
      <line x1="63" y1="0" x2="51" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="-18" y2="-40" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="34" y2="-14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#ffffff"/>
  </g>
  <text x="835" y="524" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="Georgia, serif" font-size="26" font-style="italic">t&#8242;</text>
  <text x="835" y="552" text-anchor="middle" fill="#ffffff" fill-opacity="0.65" font-family="sans-serif" font-size="16">di roket, v mendekati c</text>
</svg>
